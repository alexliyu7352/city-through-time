  republic_campaigns_map:
  - id: r02_017
    en: He spent 8 years fighting in Gaul, roughly today's France,
    zh: 他在高卢，也就是今天的法国一带，
    year: -55
    with: node
    lead: 0
  - id: r02_018
    en: and came back with a great army that answered to him.
    zh: 打了8年仗，带回一支忠于他的大军。
    year: -55
  - id: r02_019
    en: In 49 BCE Caesar led his troops across the Rubicon River into Italy.
    zh: 公元前49年，凯撒率军越过卢比孔河，进入意大利。
    year: -49
  a_home_lost:
  - id: r08_001
    en: In the 1920s Benito Mussolini seized power
    zh: 1920年代，墨索里尼夺取政权，
  - id: r08_002
    en: and set up a Fascist dictatorship in Italy.
    zh: 在意大利建立法西斯独裁。
  - id: r08_003
    en: The king kept his throne, but the real power was Mussolini's.
    zh: 国王还在，实权却在他手里。
  - id: r08_004
    en: 'He wanted Rome to look like the capital of an empire again:'
    zh: 他要让罗马重现古罗马帝国的威风：
    t: 11.5575
  - id: r08_005
    en: by the Tiber he built ever larger stadiums,
    zh: 在台伯河边修起越来越大的体育场，
    t: 15.4933
  - id: r08_006
    en: ringed with marble statues, and he tore down old neighbourhoods to lay
    zh: 赛场四周立满大理石雕像；还要拆掉老街区，
    t: 18.7186
  - id: r08_007
    en: bare the ancient ruins and open wide avenues for military parades.
    zh: 让古代遗迹露出来，给阅兵队伍腾出宽阔的大道。
  - id: r08_008
    en: In 1929 he signed the Lateran Treaty with the papacy,
    zh: 1929年，他又与教廷签下《拉特兰条约》，
    t: 28.9731
  - id: r08_009
    en: ending almost 60 years of hostility that had begun in 1870. The pope
    zh: 结束了从1870年起近60年的对立：
    t: 34.0606
  - id: r08_010
    en: recognised Rome as part of Italy, and the papacy gained a state
    zh: 教宗承认罗马属于意大利，教廷则在城里得到
    t: 40.4295
  - id: r08_011
    en: 'of its own inside the city, just 0.44 km² in size: Vatican City.'
    zh: 一个只有0.44平方公里的国家——梵蒂冈城国。
  - id: r08_012
    en: The cost of his grand plans fell on ordinary Romans.
    zh: 他的宏图，代价由普通罗马人来付。
    t: 52.3445
  rome09_clearance1932:
  - id: r08_013
    en: In 1932, to clear the way for the Via dell'Impero,
    zh: 1932年，为了开辟通往斗兽场的“帝国大道”，
    t: 0.5
    see:
    - pin:tail_via_impero
    - pin:tail_cleared_homes
  - id: r08_014
    en: the "Avenue of the Empire", running to the Colosseum,
    zh: 古罗马广场旁的亚历山德里诺街区被成片拆平，
    t: 5.0887
    see:
    - pin:tail_via_impero
    - pin:tail_cleared_homes
  - id: r08_015
    en: 'much of the Alessandrino neighbourhood beside the Forum was flattened:'
    zh: 住宅、
    t: 8.8973
    see:
    - pin:tail_via_impero
    - pin:tail_cleared_homes
  - id: r08_016
    en: homes, shops and churches all went.
    zh: 铺面和教堂一起消失。
    t: 13.9382
  rome09_spina1937:
  - id: r08_017
    en: A few years later the old streets of the Borgo,
    zh: 几年后，
    see:
    - pin:tail_spina
  - id: r08_018
    en: right in front of St Peter's, were pulled down too,
    zh: 圣彼得大教堂正前方的博尔戈老街也被拆掉，
  - id: r08_019
    en: and replaced by a broad, straight avenue.
    zh: 换成一条宽阔笔直的大道。
  - id: r08_020
    en: Neighbours who had lived there for generations were scattered.
    zh: 世代住在那里的老街坊，就此散了。
  - pause: 3.5
    why: See residents leaving in the new Borgo living moment.
  rome09_war1943:
  - id: r08_021
    en: 'And a greater disaster followed: the Second World War.'
    zh: 而更大的灾难，是随之而来的第二次世界大战。
    t: 3.5
  - id: r08_022
    en: On 19 July 1943 Allied planes bombed Rome;
    zh: 1943年7月19日，盟军的飞机轰炸罗马，
    year: 1943
    with: shot:tail_bombed1943
  - id: r08_023
    en: San Lorenzo, a district of working families, was hit hardest.
    zh: 平民住的圣洛伦佐区被炸得最惨。
  - id: r08_024
    en: Days later King Victor Emmanuel III
    zh: 几天后，国王维托里奥·埃马努埃莱三世
  - id: r08_025
    en: dismissed Mussolini and had him arrested;
    zh: 罢免并逮捕了墨索里尼；
  - id: r08_026
    en: in September the new government signed an armistice with the Allies.
    zh: 9月，新政府与盟军停战。
  - id: r08_027
    en: Nazi Germany, Italy's former ally,
    zh: 原来的盟友纳粹德国随即出兵，
  - id: r08_028
    en: at once sent in its troops and occupied Rome.
    zh: 占领了罗马。
  - id: r08_029
    en: At dawn on 16 October, German troops sealed off the city's
    zh: 10月16日清晨，德军封锁了城里的犹太社区，
  - id: r08_030
    en: Jewish quarter and went from house to house, arresting people.
    zh: 挨家挨户搜捕。
  - id: r08_031
    en: On 18 October, 1,020 of Rome's Jews were put
    zh: 两天后，1020名罗马犹太人被押上火车，
  - id: r08_032
    en: on a train to the Auschwitz concentration camp.
    zh: 送往奥斯维辛集中营。
    year: 1943
  - id: r08_033
    en: On 4 June 1944 Allied troops entered Rome, and the city was free.
    zh: 1944年6月4日，盟军开进罗马，城市解放了。
    year: 1944
    see:
    - arrow:tail_allied_entry
  - id: r08_034
    en: Of the 1,020 people sent to Auschwitz, only 17 survived.
    zh: 被送往奥斯维辛的1020人里，最终只有17人活了下来。
  rome09_homecoming1945:
  - id: r08_035
    en: One of the survivors was a father named Cesare Di Segni.
    zh: 幸存者里有一位名叫切萨雷·迪塞尼的父亲。
    t: 0.5
  - id: r08_036
    en: When the war was over he came back to Rome, to the rooms
    zh: 战争结束后，他回到罗马，
    t: 5.2984
  - id: r08_037
    en: where he had lived with his children. The rooms were empty.
    zh: 回到从前和孩子一起生活过的房间。屋子里空空荡荡。
  - pause: 4.0
    why: Music alone after the empty rooms, before his nightly grief.
  - id: r08_038
    en: For weeks afterwards, he wept every night.
    zh: 那之后的好几个星期，他每天夜里都在哭。
    year: 1945
    t: 16.6631
  - id: r08_039
    en: In June 1946 Italians voted in a referendum
    zh: 1946年6月，意大利人通过公投废除君主制，
    year: 1946
    t: 19.7962
  - id: r08_040
    en: to end the monarchy and found a republic.
    zh: 建立共和国。
    t: 23.5513
  - id: r08_041
    en: Rome remained the capital.
    zh: 罗马仍是首都。
    t: 27.6659
  screen_rome:
  - id: r09_001
    en: It was a film that put post-war Rome back in front of the world.
    zh: 把战后罗马重新推到世界眼前的，是一部电影。
    t: 0.5
  - id: r09_002
    en: In 1953 Roman Holiday came out.
    zh: 1953年，《罗马假日》上映。
    year: 1953
    t: 5.7265
  - id: r09_003
    en: On screen, Audrey Hepburn's princess slips out of the palace
    zh: 银幕上，奥黛丽·赫本演的公主偷偷溜出王宫，
    t: 9.7363
  - id: r09_004
    en: and rides a motor scooter through the streets of Rome.
    zh: 坐着小摩托穿过罗马的大街小巷。
    t: 14.3486
  - id: r09_005
    en: Only a few years after the war,
    zh: 战争才过去几年，银幕上的罗马，
    t: 18.0665
  - id: r09_006
    en: the Rome on the screen was a place the whole world wanted to visit.
    zh: 又成了全世界想去的地方。
    year: 1953
    t: 20.35
  - id: r09_007
    en: Films brought the Romans work too. In the first years after the war,
    zh: 电影也给罗马人带来了工作。
    t: 23.8208
    year: 1953
  - id: r09_008
    en: the great studios of Cinecittà, in the south-east of the city,
    zh: 城东南的奇尼奇塔电影城，
    t: 28.0401
    year: 1953
    see:
    - arrow:tail_city_to_studios
  - id: r09_009
    en: were full of homeless people. As they gradually moved out,
    zh: 战后初期住满了无家可归的人；随着他们陆续搬离，
    t: 32.6761
    year: 1953
  - id: r09_010
    en: the repaired studios went back to work and became known as "Hollywood
    zh: 修好的摄影棚重新开工，成了“台伯河上的好莱坞”。
    t: 37.0546
    year: 1953
  - id: r09_011
    en: on the Tiber". Hollywood epics such as Ben-Hur were filmed here,
    zh: 《宾虚》等好莱坞大片来这里拍摄，搭布景的木匠、
    year: 1959
    t: 42.0503
  - id: r09_012
    en: and carpenters building sets and editors cutting film found jobs.
    zh: 剪胶片的剪辑师，都在这里找到了工作。
    t: 47.1511
  rome11_olympic1960:
  - id: r09_013
    en: In 1960 Rome hosted the Summer Olympics.
    zh: 1960年，罗马举办夏季奥运会。
    year: 1960
    t: 3.3
  - id: r09_014
    en: Gymnastics was held in the ancient Baths of Caracalla,
    zh: 体操比赛设在古罗马的卡拉卡拉浴场，
    with: shot:tail_maxentius1960
    lead: 3.713208333333333
  - id: r09_015
    en: and wrestling in the Basilica of Maxentius.
    zh: 摔跤比赛设在马克森提乌斯大会堂。
  - id: r09_016
    en: In buildings more than 1,000 years old, crowds cheered again.
    zh: 1000多年前的建筑里，又响起了观众的喝彩。
  - id: r09_017
    en: The stadiums Mussolini had built now welcomed athletes
    zh: 当年墨索里尼修的体育场，
  - id: r09_018
    en: from around the world. In the north of the city, the new
    zh: 这时用来接待世界各地的运动员；
    see:
    - stage:rome11_north_observed1960
    - pin:tail_olimpico1953
  - id: r09_019
    en: Olympic Village's temporary buildings came down after the Games.
    zh: 城北新建的奥运村，赛后拆掉了临时设施。
  - id: r09_020
    en: The flats built for guests from afar became homes for Romans.
    zh: 为远方客人盖的房子，成了罗马人自己的家。
    with: shot:tail_village_homes
  modern_growth: []
  silent_rome:
  - id: r10_008
    en: In the spring of 2020, Covid-19 swept through Italy,
    zh: 2020年春天，新冠疫情席卷意大利，
  - id: r10_009
    en: and streets usually packed with visitors suddenly emptied.
    zh: 平日挤满游人的街巷忽然空了。
  - id: r10_010
    en: One rainy evening,
    zh: 一个下雨的傍晚，
  - id: r10_011
    en: Pope Francis stood alone in an empty
    zh: 教宗方济各独自站在空旷的圣彼得广场上，
  - id: r10_012
    en: St Peter's Square and prayed for the world.
    zh: 为世界祈祷。
  world_returns:
  - id: r10_013
    en: But crowds always come back.
    zh: 但人群总会回来。
  rome08_flood1870:
  - id: r07_024
    en: That December, 3 months after the troops had marched in,
    zh: 就在意大利军队进城3个月后，
    year: 1870
  - id: r07_025
    en: the Tiber flooded, and the water poured into the city.
    zh: 台伯河发了一场大洪水，河水淹进了城里。
    year: 1870
  - pause: 5.8
    why: See the new single flood living moment after its date document.
  rome08_million1931:
  - id: r07_030
    en: In 1931 Rome's population passed 1 million,
    zh: 1931年，罗马人口突破100万，
    year: 1931
  - id: r07_031
    en: back to the size of the city under Augustus.
    zh: 又回到了奥古斯都时代的规模。
  rome12_outskirts1975:
  - id: r10_003
    en: Families who moved into new blocks on the outskirts were happy at
    zh: 搬进郊区新楼的人家，起初很高兴：
  - id: r10_004
    en: 'first: at last they had a proper roof, running water and electricity.'
    zh: 终于有了像样的屋顶，通了自来水和电。
  rome12_commute1975:
  - id: r10_005
    en: Before long the bills came, one after another,
    zh: 可没过多久，账单一张张寄来，
  - id: r10_006
    en: the journey to work grew longer, and the neighbours who had
    zh: 进城上班的路远了，
    see:
    - arrow:tail_commute
  - id: r10_007
    en: helped each other in the old streets now lived far apart.
    zh: 从前在老街巷里推门就能帮一把的邻居，也散了。
  rome12_jubilee2025:
  - id: r10_018
    en: More than 700 years after the first Jubilee that Dante wrote about,
    zh: 从1300年但丁写过的第一个禧年算起，
  - id: r10_019
    en: people are still making their way to Rome.
    zh: 700多年过去了，人们一直在往罗马走。
  rome12_river2026:
  - id: r10_020
    en: In 2026 Rome approved a plan to improve 75 km
    zh: 2026年，罗马通过了一项新计划，
  - id: r10_021
    en: of the Tiber's banks and connect its two sides again.
    zh: 要整治台伯河75公里长的河岸，把两岸重新连起来。
  rome12_first_hill2026: []
  rome12_river_memory2026:
  - id: r10_022
    en: This river fed the first huts,
    zh: 这条河养活过最初的茅草屋，
  - id: r10_023
    en: carried grain for an empire and turned mills during a siege,
    zh: 为帝国运过粮，在围城时推过磨，
  - id: r10_024
    en: then was walled off behind high embankments for more than 100 years.
    zh: 后来又被高高的河堤隔开了100多年。
  - id: r10_025
    en: Now the Romans want to find their way back to it.
    zh: 如今，罗马人想重新走近它。
  rome12_walls2026:
  - id: r10_026
    en: The Tiber still flows past the hills where the first people settled,
    zh: 今天，台伯河依然流过最初有人居住的山丘，
    see:
    - pin:tail_hills_return
  - id: r10_027
    en: and the Aurelian Wall still stands where it was built. For more
    zh: 奥勒良的城墙也还在原地。在过去1000多年里，
  - id: r10_028
    en: than 1,000 years, a shrunken city lived half empty inside that great
    zh: 是一座缩小了的城，空荡荡地借住在大墙里；
  - id: r10_029
    en: wall. Today, the whole of the ancient wall lives inside Rome.
    zh: 而今天，是整道古墙，住在罗马城里。
  rome12_walk2024:
  - id: r10_014
    en: In late 2024, in time for the Jubilee of 2025, the traffic
    zh: 2024年底，为了迎接2025年的禧年，
  - id: r10_015
    en: at Piazza Pia beside Castel Sant'Angelo was sent
    zh: 圣天使堡旁的庇亚广场把车流引进地下隧道，
    see:
    - pin:tail_castle_name
    - pin:tail_pia
  - id: r10_016
    en: into a tunnel and the square was given back to people on foot,
    zh: 地面还给行人，
  - id: r10_017
    en: so they could walk all the way to St Peter's.
    zh: 人们可以一路走到圣彼得。
    see:
    - arrow:tail_pilgrimage
  - pause: 5.5
    why: See the new pedestrian living moment after the ground has changed.
  rome_round9_growth_edges:
  - id: r10_001
    en: After 1975 Rome kept spreading out along the roads
    zh: 1975年以后，罗马继续沿着公路向四周的田野伸展，
  - id: r10_002
    en: into the countryside, further and further from its ancient walls.
    zh: 离古老的城墙越来越远。
  rome_round9_growth_finish: []
  rome_round12b_avignon_return:
  - id: r05_015
    en: Only 9 years later, under the influence of the French king,
    zh: 仅仅9年后，在法国国王的影响下，
    year: 1309
  - id: r05_016
    en: the pope moved his residence to Avignon, in what is now the south
    zh: 教宗把驻地迁到了今天法国南部的阿维尼翁，
  - id: r05_017
    en: of France, and the popes stayed there for nearly 70 years.
    zh: 一住就是近70年。
  - id: r05_018
    en: The clergy, envoys and merchants who made their living from the papal
    zh: 靠教廷吃饭的神职人员、使节和商人，
  - id: r05_019
    en: court gathered in Avignon instead, and Rome grew quiet again.
    zh: 也都聚到了阿维尼翁，罗马又冷清下来。
  - pause: 0.45
    why: 1377 return follows the quiet Avignon passage.
  - id: r05_020
    en: In 1377 the popes moved back to Rome;
    zh: 1377年，教宗把驻地迁回了罗马；
    year: 1377
  - id: r05_021
    en: soon afterwards the Church split,
    zh: 可紧接着，教会又分裂了近40年，
  - id: r05_022
    en: and for nearly 40 years rival popes refused to recognise each other.
    zh: 欧洲同时有几个互不承认的教宗。
  - pause: 0.55
    why: The schism ends before Martin V returns.
  - id: r05_023
    en: After the split was over,
    zh: 分裂结束后，
    year: 1417
  - id: r05_024
    en: Pope Martin V returned to Rome in 1420.
    zh: 教宗马丁五世在1420年回到罗马。
    year: 1420
  - id: r05_025
    en: From then on, the papacy stayed in Rome.
    zh: 从此，教廷一直设在罗马。
  - id: r05_026
    en: The city's abandoned churches and streets were repaired one by one.
    zh: 荒废的教堂和街道一处处修了起来。
