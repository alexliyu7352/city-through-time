langs:
- en
- zh
prologue:
- id: rp_001
  en: In 64 CE, Rome caught fire.
  zh: 公元64年，罗马烧了起来。
- id: rp_002
  en: The flames raced from the low streets up the hillsides,
  zh: 大火顺着低处的街巷往山坡上窜，
- id: rp_003
  en: and families ran for their lives.
  zh: 满城的人拖家带口，拼命往外逃。
  see: card:prologue_fire_escape
- id: rp_004
  en: Who would have thought that this city,
  zh: 谁能想到，
- id: rp_005
  en: home to more than 2.7 million people today,
  zh: 这座今天住着270多万人的城市，
- id: rp_006
  en: began as a few clusters of thatched huts by the River Tiber?
  zh: 最早，只是台伯河边的几片茅草屋。
opening: []
nodes:
  founding_price:
  - id: r01_001
    en: The River Tiber runs between a group of hills in central Italy,
    zh: 台伯河穿过意大利中部的几座山丘，
    see: stage:cermalus_first_houses
  - id: r01_002
    en: then on to the Mediterranean Sea.
    zh: 一路流进地中海。
    see:
    - card:founding_geography
  - id: r01_003
    en: By the 8th century BCE, people were living on these slopes.
    zh: 公元前8世纪，这些山坡上已经有了人家。
  - id: r01_004
    en: Their huts stood in small clusters with open ground between them;
    zh: 茅屋三五成群，中间隔着大片荒地；
    with: shot:huts
    see: stage:hillside_villages
  - id: r01_005
    en: even the Palatine Hill, where emperors would
    zh: 就连后来建起皇宫的帕拉蒂尼山，
  - id: r01_006
    en: later build their palaces, had only thatched huts.
    zh: 那时也只有草房。
  - id: r01_007
    en: In the river lay a small island, the easiest place to cross.
    zh: 河心有一座小岛，是渡河最省力的地方。
    with: shot:river
    see: pin:founding_island
  - id: r01_008
    en: Goods brought up from the coast were unloaded here,
    zh: 海边运来的货物在这里卸船，
    see: pin:founding_island
  - id: r01_009
    en: and travellers crossed here on their way north and south.
    zh: 南来北往的行人从这里过河。
    see: pin:founding_island
  - id: r01_010
    en: The first Rome grew up at this crossing,
    zh: 最早的罗马，
    see:
    - pin:founding_island
    - pin:founding_settlement_return
  - id: r01_011
    en: where the river met the road.
    zh: 就长在这个水陆交汇的渡口旁。
    see:
    - pin:founding_island
    - pin:founding_settlement_return
  - id: r01_012
    en: The Romans' own legend says that in 753 BCE Romulus founded
    zh: 按罗马人自己的传说，公元前753年，
    see: pin:romulus_legend
  - id: r01_013
    en: a city here and became its king. The name Rome comes from him.
    zh: 罗慕路斯在这里筑城称王，“罗马”这个名字，就来自他。
    see: pin:romulus_legend
  - pause: 4.5
    why: 'Legendary founding: see the boundary ritual, then return from the living
      moment to the model.'
  republic_won_and_lost:
  - id: r02_001
    en: In 509 BCE the Romans drove out
    zh: 公元前509年，罗马人赶走最后一位国王，
  - id: r02_002
    en: their last king and founded a republic.
    zh: 建立共和国。
  - id: r02_003
    en: Affairs of state were decided by the Senate,
    zh: 国家大事交给元老院、
  - id: r02_004
    en: the citizens' assemblies and elected officials,
    zh: 公民大会和选出来的官员共同决定，
  - id: r02_005
    en: and the officials had to give up their power when their term ended.
    zh: 官员任期一到就得交权。
  - id: r02_006
    en: From then on, no single man ruled Rome.
    zh: 从那以后，罗马不再由一个人说了算。
  republic_middle_city:
  - id: r02_011
    en: Grain, tribute and the spoils of war flowed in from far away; the city
    zh: 远方的粮食、贡赋和战利品运进城里，
    year: -160
    t: 3.9
  - id: r02_012
    en: spread outward ring by ring, and its public squares grew grander.
    zh: 城区一圈圈向外长，广场也越修越大。
    year: -160
  republic_pompey_observation:
  - id: r02_013
    en: But as the wars were fought further and further away,
    zh: 但仗越打越远，
    year: -55
    with: node
    lead: 0
  - id: r02_014
    en: generals came to have armies loyal to them alone,
    zh: 将军们手里有了只听自己号令的军队，
    year: -55
  - id: r02_015
    en: and with those armies, the means to challenge the Senate.
    zh: 也就有了跟元老院较量的本钱。
    year: -55
  republic_late_city:
  - id: r02_020
    en: 'Civil war began:'
    zh: 内战开始了，罗马人打罗马人，
    year: -49
  - id: r02_021
    en: Romans fought Romans over who would rule the state.
    zh: 争的是谁来统治这个国家。
    year: -49
  - id: r02_022
    en: Caesar won, and was made dictator for life,
    zh: 凯撒赢了内战，
    year: -44
  - id: r02_023
    en: with all power in his hands.
    zh: 当上终身独裁官，大权集于一身。
    year: -44
  - id: r02_023a
    en: 'He was already remaking the city: a new square carried his name.'
    zh: 他已经在改造这座城：一座以他命名的新广场落成了。
    with: shot:forum
    lead: 0
  - id: r02_024
    en: A group of senators decided that to save the Republic,
    zh: 一批元老暗下决心：
    year: -44
  - id: r02_025
    en: Caesar had to die.
    zh: 要想保住共和，凯撒必须死。
    year: -44
  - id: r02_026
    en: On 15 March 44 BCE, the Senate met in a hall built by Pompey.
    zh: 公元前44年3月15日，元老院在庞培议事厅开会。
    year: -44
    with: shot:curia
    lead: 0
  republic_caesar:
  - id: r02_027
    en: As soon as Caesar sat down,
    zh: 凯撒刚坐下，刺客就围了上来，
    year: -44
  - id: r02_028
    en: the assassins closed in and stabbed him to death.
    zh: 用刀把他刺死在会场里。
    year: -44
  republic_last_wars:
  - id: r02_029
    en: But killing Caesar did not save the Republic.
    zh: 但刺死凯撒，并没有救回共和国。
    year: -44
  - id: r02_029a
    en: Civil war went on for more than 10 years,
    zh: 罗马又打了10多年内战，
    year: -44
  - id: r02_030
    en: until Caesar's adopted son Octavian came out the winner.
    zh: 最后的赢家是凯撒的养子屋大维。
    year: -44
  - id: r02_031
    en: In 27 BCE the Senate gave him the title Augustus.
    zh: 公元前27年，元老院献给他“奥古斯都”的尊号——
    year: -27
  - id: r02_032
    en: The Republic was over, and Rome had its first emperor.
    zh: 罗马告别了共和，有了第一位皇帝。
    year: -27
  republic_civic_dedications:
  - id: r03_001
    en: 'After the civil wars, Augustus set about rebuilding the capital:'
    zh: 内战结束后，奥古斯都着手整修首都，
    year: -27
  - id: r03_002
    en: he restored old temples and gave the citizens new public squares.
    zh: 修复旧神庙，给市民建新广场。
    year: -27
    with: shot:apollo
    lead: 0
  imperial_height:
  - id: r03_003
    en: He liked to boast that he had found
    zh: 他曾得意地说，自己接手的是一座砖头城，
    year: 14
  - id: r03_004
    en: a city of brick and left a city of marble.
    zh: 留下的是一座大理石城。
    year: 14
  - id: r03_005
    en: But the marble went into temples and squares; ordinary Romans still
    zh: 可大理石多用在神庙和广场上，
    year: 14
  - id: r03_006
    en: crowded into tall blocks of rented rooms along narrow streets.
    zh: 普通市民仍挤在窄巷里的多层出租楼中。
    year: 14
  - id: r03_007
    en: By then Rome may have held close to 1 million people,
    zh: 那时的罗马，可能已住着近100万人。
    year: 14
  - id: r03_008
    en: far more than the farmland around it could feed.
    zh: 城外的田地养不活这么多人，
    year: 14
  - id: r03_009
    en: Grain was shipped from North Africa and Egypt
    zh: 粮食要从北非和埃及装船，
    year: 14
  - id: r03_010
    en: across the Mediterranean,
    zh: 渡过地中海，
    year: 14
  - id: r03_011
    en: then brought up the Tiber into the city.
    zh: 再沿台伯河运进城。
    year: 14
  - id: r03_012
    en: If the grain ships were a few days late, the city went hungry.
    zh: 粮船晚到几天，城里就要挨饿。
    year: 14
  - id: r03_013
    en: In 51 CE, during a shortage, Rome had only 15 days of food left,
    zh: 公元51年闹粮荒，存粮只够吃15天，
    year: 51
  - id: r03_014
    en: and an angry crowd surrounded the emperor Claudius.
    zh: 愤怒的市民围住了皇帝克劳狄乌斯。
    year: 51
  - id: r03_015
    en: Besides hunger, this city of tall buildings
    zh: 除了饥荒，这座挤满高楼窄巷的城还怕一样东西：
    year: 51
  - id: r03_016
    en: 'and narrow streets feared one more thing: fire.'
    zh: 火。
    year: 51
  - id: r03_017
    en: In 64 CE, under the emperor Nero, a fire broke out in shops
    zh: 公元64年，尼禄在位时，
    year: 64
    with: shot:fire
    lead: 0
  - id: r03_018
    en: beside the Circus Maximus, the great chariot-racing track.
    zh: 大赛车场边的店铺起了火。
    year: 64
  - id: r03_019
    en: Driven by the wind, it swept along the narrow streets of the valley
    zh: 火借着风，顺着低处的窄街一路烧上山坡。
    year: 64
    with: shot:firebreak
    lead: 18.117583333333332
  - id: r03_020
    en: and up the hills. People fled, helping the old and carrying the young;
    zh: 逃难的人扶老携幼，
    year: 64
  - id: r03_021
    en: those in front were still looking for a way out while those
    zh: 前面的还没找到出路，后面的又涌了上来。
    year: 64
  - id: r03_022
    en: behind pushed forward. On the 6th day, people tore down a whole
    zh: 烧到第6天，人们拆掉一大片房子，
    year: 64
  - id: r03_023
    en: stretch of houses to make a firebreak, and the fire was stopped.
    zh: 空出一道隔火带，才把火挡住；
    year: 64
  - id: r03_024
    en: Soon it broke out again and burned still more of the city.
    zh: 没过多久，火又烧起来，烧掉了更多街区。
    year: 64
  - id: r03_025
    en: Legend says that while Rome burned, Nero played his lyre and sang.
    zh: 传说，罗马燃烧时，尼禄在高处弹琴唱歌。
    year: 64
    with: shot:rebuild
    lead: 0
  - id: r03_026
    en: No one knows for certain how the fire started. What Nero did next
    zh: 火到底是怎么烧起来的，至今没人说得清；
    year: 64
    see:
    - stage:postfire_housing
    - pin:postfire_homes
  - id: r03_027
    en: 'showed whose interests came first: in the burned-out heart of the city'
    zh: 尼禄接下来做的事，却让人看清了他的私心：
    year: 64
  - id: r03_028
    en: he took a huge stretch of land for his Golden House and its gardens,
    zh: 他在烧光的城中心圈下一大片地，
    year: 64
  - id: r03_029
    en: and dug an artificial lake in the valley.
    zh: 修起他的金宫和园林，还在谷底挖了一个人工湖。
    year: 68
  - id: r03_030
    en: Streets where families had lived became one man's private park.
    zh: 原来住满人家的街坊，成了皇帝一个人的园子。
    year: 68
  - id: r03_031
    en: After Nero's death,
    zh: 尼禄死后，
    year: 70
  - id: r03_031a
    en: the emperor Vespasian gave the land back to the people of Rome.
    zh: 皇帝维斯帕先把这片地还给了罗马市民：
    year: 70
  - id: r03_032
    en: He drained the lake
    zh: 排干湖水，
    year: 70
    with: shot:drain
    lead: 0
  - id: r03_032a
    en: and began building a great arena on the spot.
    zh: 在原地建一座大竞技场。
  - pause: 7
    why: A breath while the arena rises on the drained lake.
  - id: r03_033
    en: In 80 CE his son, the emperor Titus, opened it.
    zh: 公元80年，他的儿子提图斯皇帝为它揭幕。
    year: 80
    with: shot:arena_plate
    lead: 0
  - id: r03_034
    en: Where an emperor had kept a private lake,
    zh: 皇帝独享的湖面，
    year: 80
  - id: r03_035
    en: there were now seats for about 50,000 people.
    zh: 变成了约5万人的看台。
    year: 80
  - id: r03_035a
    en: This is the Colosseum.
    zh: 这就是罗马斗兽场。
    year: 80
  - id: r03_036
    en: By the early 2nd century, under the emperor Trajan,
    zh: 到了2世纪初的图拉真皇帝时，
  - id: r03_037
    en: the empire reached its greatest size.
    zh: 帝国的疆域达到最大。
  - pause: 4.5
    why: A short breath between the sentences of the building montage.
  - id: r03_038
    en: In the capital, the wealth of generations of conquest was turned
    zh: 一代代征服带回的财富，
    year: 109
  - id: r03_039
    en: into temples, baths and public squares, one after another.
    zh: 在首都变成了一座又一座神庙、浴场和广场。
    year: 113
  - pause: 8
    why: The column completes the city before the next chapter.
  another_centre:
  - id: r04_001
    en: Yet the empire's golden age could not last forever.
    zh: 然而，帝国的黄金时代终有落幕的时候。
    year: 271
  - id: r04_002
    en: By 271, invaders from the north were closing in on Italy.
    zh: 公元271年，北方的入侵者已经逼近意大利。
    year: 271
  - id: r04_003
    en: Rome had long since spread beyond its old walls,
    zh: 罗马城区早就漫出了几百年前的旧城墙，
    year: 271
  - id: r04_004
    en: built centuries before, and the emperor Aurelian ordered
    zh: 皇帝奥勒良下令，
    year: 271
  - id: r04_005
    en: a new wall to be raised around the whole city in haste.
    zh: 绕着整座城抢修一道新墙。
    year: 271
  - id: r04_006
    en: In 275 the Aurelian Wall, about 19 km long, was complete.
    zh: 4年后，约19公里长的奥勒良城墙合拢。
    year: 275
    with: shot:round9_wall_circuit
    lead: 5
  - id: r04_007
    en: By now the emperors rarely lived in Rome.
    zh: 可这时的皇帝，已经很少住在罗马。
    year: 330
    see:
    - stage:constantinian_city_350
    - pin:constantinian_rome
  - id: r04_008
    en: In 330 Constantine the Great founded a new capital in the east,
    zh: 330年，君士坦丁大帝在东方建立新都君士坦丁堡，
    year: 330
  - id: r04_009
    en: Constantinople, today's Istanbul.
    zh: 也就是今天的伊斯坦布尔。
    year: 330
  - id: r04_010
    en: Also in Constantine's time,
    zh: 也是在君士坦丁的时代，台伯河西岸、
    year: 330
  - id: r04_011
    en: the first St Peter's Basilica was built across the Tiber,
    zh: 相传安葬着耶稣门徒彼得的地方，
    year: 330
  - id: r04_012
    en: on the spot where Jesus's disciple Peter was said to be buried.
    zh: 建起了最早的圣彼得大教堂。
    year: 330
  - id: r04_013
    en: From then on,
    zh: 此后，
    year: 330
  - id: r04_014
    en: pilgrims came to Rome from every direction to visit this tomb.
    zh: 四面八方的朝圣者为这座墓来到罗马。
    year: 330
  - id: r04_015
    en: Later the empire split into an eastern and a western half,
    zh: 后来，帝国分成东西两半，
    year: 395
  - id: r04_016
    en: each with its own emperor.
    zh: 各有一位皇帝。
    year: 395
  - id: r04_017
    en: In 402 the western emperor moved his court to Ravenna,
    zh: 402年，
    year: 402
  - id: r04_018
    en: which was easier to defend.
    zh: 西罗马皇帝把朝廷搬到了更易防守的拉文纳。
    year: 402
  - id: r04_019
    en: Rome's walls were raised higher.
    zh: 罗马的城墙又加高了一截。
    year: 403
    see:
    - stage:honorian_city_403
    - pin:raised_wall_section
  - pause: 6
    why: Two extra seconds to see the higher wall before the siege; the next line
      accompanies the pull-back.
  the_city_taken:
  - id: r04_020
    en: Only 6 years later, in 408, the Visigothic king Alaric cut
    zh: 仅仅6年后，408年，西哥特国王阿拉里克
    year: 408
  - id: r04_021
    en: off the route that brought grain from the port into the city.
    zh: 带兵截断了从海港运粮进城的路。
    year: 408
  - id: r04_022
    en: Rations were cut again and again,
    zh: 城里的口粮一减再减，
    year: 408
  - id: r04_023
    en: and Rome had to pay a ransom to make him withdraw.
    zh: 罗马只好交出赎金，换他退兵。
    year: 408
  - id: r04_024
    en: In the summer of 410 he came back,
    zh: 410年夏天，他又带兵回来，
    year: 410
  - id: r04_025
    en: and this time his army broke through the gates and sacked the city.
    zh: 这一次攻进了城门，洗劫了罗马。
    year: 410
    see:
    - arrow:alaric410_entry
  - id: r04_026
    en: It was the first time in 800 years
    zh: 这是800年来，
    year: 410
  - id: r04_027
    en: that a foreign enemy had taken Rome.
    zh: 罗马第一次被外敌攻破。
    year: 410
  - id: r04_028
    en: 'Far away, the Christian scholar Jerome heard the news and wrote:'
    zh: 消息传到远方，基督教学者哲罗姆在信中写道：
    year: 412
  - id: r04_029
    en: '"The city which had taken the whole world was itself taken."'
    zh: “那座征服了整个世界的城，自己竟被征服了。”
    year: 412
  - id: r04_030
    en: The Western Roman Empire held on for a few more decades.
    zh: 西罗马帝国又勉强撑了几十年。
    year: 412
  - id: r04_031
    en: In 476 the army commander Odoacer deposed the last
    zh: 476年，军队统帅奥多亚塞废黜了西罗马的末代皇帝，
    year: 476
    with: shot:empire476
    lead: 0
  - id: r04_032
    en: western emperor and took Italy for himself.
    zh: 自己掌握了意大利。
    year: 476
  - id: r04_033
    en: 'As it happened, the young emperor was named Romulus Augustus:'
    zh: 巧的是，这位年轻皇帝的名字叫“罗慕路斯·奥古斯都”
    year: 476
  - id: r04_034
    en: Romulus, the city's founder, and Augustus, its first emperor.
    zh: ——前半截是建城的始祖，后半截是第一位皇帝。
    year: 476
  - id: r04_035
    en: The Western Empire ended with that name.
    zh: 西罗马帝国，就结束在这个名字上。
    year: 476
  - id: r04_036
    en: In the east, the Roman Empire lived on,
    zh: 东边的罗马帝国还在，
    year: 476
  - id: r04_037
    en: with its capital at Constantinople.
    zh: 都城是君士坦丁堡。
    year: 476
  - id: r04_038
    en: In 493 the king of the Ostrogoths took Italy from Odoacer,
    zh: 493年，东哥特国王从奥多亚塞手里夺下意大利，
    year: 493
  - id: r04_039
    en: and Rome became a city of the Ostrogothic kingdom.
    zh: 罗马成了东哥特王国里的一座城。
    year: 493
  - id: r04_040
    en: In the 6th century the eastern emperor Justinian set out
    zh: 到了6世纪，东罗马皇帝查士丁尼决心收回意大利，
    year: 535
  - id: r04_041
    en: to win Italy back and sent his general Belisarius west.
    zh: 派大将贝利撒留西征。
