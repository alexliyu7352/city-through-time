  - { id: northeast, at_m: [0, 0, 22], az: 120, el: 38, d_m: 310, fov: 38, name: { zh: 东北面俯瞰, en: Above the north-east } }
  - { id: northwest, at_m: [0, 0, 22], az: 240, el: 22, d_m: 300, fov: 38, name: { zh: 从西北面看, en: From the north-west } }

sources:
  S06:
    short: { zh: 伦敦国王学院, en: King's College London }
    zh: 伦敦国王学院《Art of Making》，Colosseum条目：80年启用、观众容量、材料和外廊构成；所列考古书目未另行核读
    en: "King's College London, Art of Making, Colosseum entry: inauguration, capacity, materials and exterior; its archaeological bibliography was not separately read"
    url: https://aofm-os.kdl.kcl.ac.uk/explore/monuments/113/
  S86:
    short: { zh: 罗马市府, en: Roma Capitale }
    zh: 罗马市府旅游局《L'Anfiteatro Flavio (Colosseo)》：整体尺寸、外廊、座席和覆沙木地板；不作为80年各部分完工的逐项证明
    en: "Roma Capitale, L'Anfiteatro Flavio (Colosseo): overall dimensions, arcades, seating and the sand-covered timber floor; not a part-by-part completion record for 80 CE"
    url: https://www.turismoroma.it/it/node/1155
  S86V:
    short: { zh: 博洛尼亚遮阳篷研究，第22页, en: Bologna awning study, p. 22 }
    zh: Eugenio D'Anna与Pier Gabriele Molari《Il velarium del Colosseo：una nuova interpretazione》，第22页：三层拱廊、每层80券及上方实墙；不采用其遮阳篷复原和不同的场地尺寸
    en: "Eugenio D'Anna and Pier Gabriele Molari, Il velarium del Colosseo: una nuova interpretazione, p. 22: three arcaded levels, 80 bays and the wall above; its awning reconstruction and differing arena dimensions are not adopted"
    url: https://amsacta.unibo.it/6307/1/Velarium%2007-01-2020%2B.pdf
  E07:
    short: { zh: 考古公园地下设施介绍, en: Archaeological park, substructures }
    zh: 罗马斗兽场考古公园《I sotterranei del Colosseo》：开幕时木构技术空间，多米提安时期改为永久砌体；本轮核读项目留存的正文
    en: "Parco archeologico del Colosseo, I sotterranei del Colosseo: timber technical spaces at the inauguration and permanent masonry under Domitian; read in the project's archived text"
    url: https://colosseo.it/mirabilia/i-sotterranei-del-colosseo/
  E08:
    short: { zh: Taylor等，2016，注29, en: Taylor et al., 2016, note 29 }
    zh: Rabun Taylor等《New Wine for Old Bottles》，The Waters of Rome 9（2016），第26页注29：引用晚期编年史讨论多米提安完成顶层；未核读所引古代原文
    en: "Rabun Taylor et al., New Wine for Old Bottles, The Waters of Rome 9 (2016), p. 26, note 29: cites a late chronicle for Domitian's completion of the attic; the cited ancient text was not separately read"
    url: https://waters.iath.virginia.edu/Journal9Taylor_et_al.pdf
