# Detailed exterior from the completed film landmark; no colonnade of 1656–1667.
id: new_st_peters
node: made_again
landmark: {kind: parts, id: rome07_renaissance_newstpeter}
detailed: {kind: domed_church, spec: {}}
exaggeration: 1
stage_m: [40000, 40000]
name: {zh: 新圣彼得大教堂, en: New St Peter's Basilica}
era: {zh: 1506–1626年建成；不含1656–1667年的广场柱廊, en: "Built 1506–1626; without the colonnade of 1656–1667"}
where: {zh: 梵蒂冈，旧圣彼得大教堂所在的同一片土地, en: "The Vatican, on the site of Old St Peter's Basilica"}
label:
  - head: {zh: 一百多年，重建同一座圣地, en: Rebuilding the same sacred site}
    text:
      zh: >-
        1506年，教宗儒略二世为新大殿奠基；到1626年，建筑才完成。新旧两座教堂都以传为彼得墓的地点为中心。另一页「旧圣彼得大教堂」展示它的前身：旧殿不是1506年一下子全部拆掉，一部分中殿仍与新工地并存到17世纪初。
      en: >-
        Pope Julius II laid the foundation of the new basilica in 1506; the building was completed in 1626. Both old and new churches centred on the place venerated as Peter's tomb. The companion page, Old St Peter's Basilica, shows its predecessor. The old church did not disappear at once in 1506: part of its nave remained beside the new building site into the early seventeenth century.
    cite: [V1, V2, A1]
  - head: {zh: 谁完成了这座穹顶, en: Who completed the dome}
    text:
      zh: >-
        米开朗基罗设计穹顶，1564年去世时只建到鼓座。Giacomo della Porta与Domenico Fontana在1588–1590年完成穹顶主体，顶端的球和十字架在1593年安置。后来，Carlo Maderno延长东侧中殿，建起宽大的入口立面。1626年的建筑包含这些不同年代的工作。
      en: >-
        Michelangelo designed the dome, but construction had reached only its drum when he died in 1564. Giacomo della Porta and Domenico Fontana completed the main vault in 1588–1590, and the ball and cross were placed in 1593. Carlo Maderno later extended the eastern nave and built its broad entrance façade. The building of 1626 brings together work from these different stages.
    cite: [V1, V3, V4]
  - head: {zh: 还没有柱廊的广场, en: Before the colonnade}
    text:
      zh: >-
        今天环抱广场的Bernini柱廊属于1656–1667年，不在这座1626年的模型里。但教堂外不是空旷乡野：北面已有教宗宫殿群，东面通向Borgo街区，西面是梵蒂冈丘地和园地。页面只抽出教堂，空白底板没有复原这些周边，也不是当年广场的边界测绘。
      en: >-
        Bernini's colonnade, which now embraces the square, belongs to 1656–1667 and is absent from this model of 1626. The setting was already inhabited: papal buildings stood to the north, Borgo lay to the east, and Vatican hills and gardens extended westward. This page isolates the church; its blank stand neither reconstructs those surroundings nor surveys the limits of the square.
    cite: [V5, V6, F1]
  - head: {zh: 有尺寸依据，也有量体估值, en: Dimensions and interpretation}
    text:
      zh: >-
        立面采用梵蒂冈公布的116米宽、45.5米高（不含顶像）；穹顶沿用同一来源从街面到十字顶133.3米的名义总高。白模按原高度展示。堂身壁柱、窗框与山花、鼓座扶壁和檐口、穹顶三层老虎窗、阳台与栏杆都已画出，但多数细尺寸与剖面是依现存外观估配，未逐一证实为1626年的形制。雕像、铭文和室内未复原。
      en: >-
        The façade follows the Vatican's published width of 116 m and height of 45.5 m excluding statues; the dome follows its nominal 133.3 m street-to-cross height. The white model uses unstretched heights. Body pilasters, window frames and pediments, drum buttresses and cornices, three rows of dome dormers, balconies and balustrades are modelled. Most smaller dimensions and profiles are estimated from the standing building and are not individually verified for 1626. Statues, inscriptions and the interior are not reconstructed.
    cite: [V3, V4, A1, F1]
life:
  text:
    zh: >-
      重建延续了一百多年，朝圣和礼拜仍围绕彼得纪念地进行。这里的三幅生活想象让少量朝圣者经过1626年的教堂外部，以人物说明大殿的尺度；衣着、材料风化和未测的地面细节是想象。图中没有后来的椭圆柱廊，也没有20世纪拆出、直通教堂的和解大道。
    en: >-
      Through more than a century of rebuilding, pilgrimage and worship continued around Peter's memorial. The three imagined views place a few pilgrims outside the basilica in 1626 to convey its scale. Clothing, weathering and unmeasured ground detail remain interpretation. The later oval colonnade and the twentieth-century Via della Conciliazione are absent.
  cite: [A1, V2, V5, F1]
parts:
  - id: facade
    labels: [facade, facade_pediment, facade_giant_columns*]
    status: estimated
    name: {zh: Maderno立面与巨柱, en: Maderno's façade and giant columns}
    note:
      zh: >-
        官方记立面116×45.50米、巨柱高27.48米、直径2.77米、中央山墙30×7.50米。模型保留这些主要尺寸，画八根圆柱、端部壁柱及带线脚的中央山墙；柱脚、收分柱身和柱头分开表现。柱位、分段比例、卷涡和檐线剖面仍是估配，未逐叶雕刻科林斯柱头，也未复原顶像。
      en: >-
        The official dimensions are 116 by 45.50 m for the façade, columns 27.48 m high and 2.77 m across, and a central pediment 30 by 7.50 m. The model retains these principal values, with eight round columns, end pilasters and a moulded central pediment. Bases, tapering shafts and capitals are articulated. Positions, member proportions, scrolls and moulding profiles are estimated; individual Corinthian leaves and rooftop figures are not reconstructed.
    cite: [V4]
  - id: facade_detail
    labels: [facade_*]
    status: estimated
    name: {zh: 立面细部, en: Façade details}
    note:
      zh: >-
        官方记五个下层入口、五个上层阳台及四个较小壁龛。模型画平顶门洞、拱顶上层开口、中央祝福阳台、壁龛凹部、端部通道、窗框与山花，以及阳台和顶层的瓶形栏杆。开口比例、位置、进深、层高及栏杆形状和间距都是规则化估值，未逐项核定为1626年的细部；雕像、浮雕、纹章和铭文未画。
      en: >-
        The official description records five lower entrances, five upper balconies and four smaller niches. The model shows lintelled portals, arched upper openings, the central Loggia, niche recesses, end passages, framed and pedimented windows, and turned balusters on balconies and the attic. Opening proportions, positions, depths, levels and baluster shapes and spacing are regularised estimates, not individually verified details of 1626. Statues, reliefs, coats of arms and inscriptions are omitted.
    cite: [V4]
  - id: drum
    labels: [drum, drum_columns, drum_columns_pair, drum_cornice]
    status: estimated
    name: {zh: 鼓座与成对柱, en: Drum and paired columns}
    note:
      zh: 鼓座的成对柱与扶壁关系有官方说明。模型画16组成对柱、扶壁、带交替山花的窗、柱基、檐口和上下基座分层。50米鼓座外径、20米高度及柱位、窗洞、扶壁和线脚细尺寸均是估配。官方41.50米是穹顶内径，不能当作鼓座实测壁厚；本页没有复原鼓座内壁或内部双壳。
      en: >-
        The official account describes paired columns associated with the buttresses. The model shows sixteen pairs, buttresses, windows with alternating pediments, pedestals, cornices and layered bases above and below the drum. Its 50 m outer diameter, 20 m height, positions and smaller dimensions are estimated. The published 41.50 m dimension is the dome's interior diameter, not a measured drum wall thickness; the drum's inner wall and the double shell are not reconstructed.
    cite: [V3]
  - id: dome
    labels: [shell, lantern, lantern_columns, lantern_columns_pair]
    status: estimated
    name: {zh: 穹顶与灯亭, en: Dome and lantern}
    note:
      zh: >-
        官方给出133.30米外部总高，并说明砖砌双壳、铅覆面、三层带山花的老虎窗及灯亭成对柱。模型画外部主壳、16条肋、三层老虎窗和带窗灯亭。主壳曲线与35米升高、肋的尺寸、老虎窗位置和形状、灯亭柱列与各段比例都是估配；内部双壳和登顶通道未画。
      en: >-
        The Vatican gives an overall exterior height of 133.30 m and describes a brick double shell, lead covering, three rows of pedimented dormers and paired lantern columns. The model shows the outer shell, sixteen ribs, three dormer rows and a windowed lantern. The shell curve and 35 m rise, rib dimensions, dormer positions and forms, lantern columns and member proportions are estimated; the internal shells and ascent passage are omitted.
    cite: [V3]
  - id: finial
    labels: [ball, cross, cross_bar]
    status: estimated
    name: {zh: 顶球与十字架, en: Ball and cross}
    note:
      zh: >-
        顶球与十字架在1593年安置；官方列球径2.50米、十字高3.33米、横臂宽2.40米。模型保留这些主要尺寸；球下颈部、杆件厚度、端部小块与连接形状是估配。它们不属于米开朗基罗1564年去世时已完成的部分。
      en: >-
        The ball and cross were installed in 1593; the official figures give a ball 2.50 m across and a cross 3.33 m high with a 2.40 m crossbar. The model retains these principal dimensions. The neck beneath the ball, member thicknesses, terminal blocks and connections are estimated. They were not complete at Michelangelo's death in 1564.
    cite: [V3]
  - id: small_domes
    labels: [small_dome_north, small_dome_south]
    status: estimated
    name: {zh: 两侧小穹顶, en: The smaller domes}
    note:
      zh: >-
        两侧小穹顶帮助辨认大殿的轮廓。模型还画基座壁柱与窗框、鼓座窗、壳上肋条和带窗灯亭；20米直径、位置、各段高度、屋面曲线和这些细部均为图像约束的估值，没有逐件的1626年测绘。后期图像只作形制比较，不把图上所有广场设施提前。
      en: >-
        The smaller domes help define the basilica's outline. The model also shows pilasters and framed windows on their bases, drum windows, ribs and windowed lanterns. Their 20 m diameter, positions, heights, roof curves and smaller details are image-constrained estimates without an individual survey of their state in 1626. Later images serve as formal comparisons without carrying their complete square arrangements back in time.
    cite: [A1, F1]
  - id: main
    labels: [western_body, cross_arm, western_apse, attic, long_nave]
    status: estimated
    name: {zh: 十字堂身与东侧长殿, en: Crossing body and eastern nave}
    note:
      zh: >-
        西部中央体、横向两翼、后殿和Maderno延长的东中殿有据。模型在堂身与后殿外墙画巨壁柱、分层檐线、带三角或弧形山花的窗，以及侧廊上方的高侧窗。房体尺度、42米堂身檐高、屋面、柱跨与这些细部都是估配；1590年旧新叠图不是1626年竣工图，细部也未逐一确认为当时形制。内部礼拜堂与祭坛未画。
      en: >-
        The western core, transverse arms, apse and Maderno's eastern nave extension are documented. Their exteriors carry giant pilasters, layered cornices, windows with triangular or segmental pediments, and clerestories above the aisles. Body dimensions, 42 m eaves, roofs, bays and smaller details are estimated. The 1590 overlay is not an as-built plan of 1626, and these details are not individually verified for that date. Internal chapels and altars are omitted.
    cite: [V1, V4, A1, F1]
viewpoints:
  - {id: front, main: true, name: {zh: 从东面看立面, en: Façade from the east}, az: 90, el: 25, d_m: 480, fov: 36, at_m: [17.29, -0.3, 40]}
  - {id: side, name: {zh: 从西南面看穹顶, en: Dome from the southwest}, az: 210, el: 25, d_m: 480, fov: 36, at_m: [17.29, -0.3, 40]}
  - {id: rear, name: {zh: 从西北面看后殿, en: Apse from the northwest}, az: 330, el: 25, d_m: 480, fov: 36, at_m: [17.29, -0.3, 40]}
sources:
  V1:
    short: {zh: 圣彼得营造处，建筑史, en: Fabbrica, building history}
    zh: Pietro Zander，圣彼得营造处《The Basilica》：1506年奠基、彼得墓中心及Maderno延长大殿。正文已核读。
    en: >-
      Pietro Zander, Fabbrica di San Pietro, The Basilica: foundation in 1506, the tomb as centre, and Maderno's extension. The text was consulted.
    url: https://www.basilicasanpietro.va/en/san-pietro/the-basilica
  V2:
    short: {zh: 圣彼得营造处，1506–1626, en: Fabbrica on 1506–1626}
    zh: >-
      圣彼得营造处《Quando è stata costruita la Basilica di San Pietro?》：1506年开建、1626年完成，替代4世纪旧殿。正文已核读。
    en: >-
      Fabbrica di San Pietro, Quando è stata costruita la Basilica di San Pietro?: construction from 1506 to 1626, replacing the fourth-century church. The text was consulted.
    url: https://www.basilicasanpietro.va/it/faq/quando-e-stata-costruita-la-basilica-di-san-pietro
  V3:
    short: {zh: 梵蒂冈，穹顶与灯亭, en: Vatican, dome and lantern}
    zh: >-
      梵蒂冈《Cupolone e Lanterna》：1564／1590／1593分期、133.30米外高、58.90米外径与41.50米内径、顶球和十字尺寸、三层老虎窗及灯亭成对柱。本文已核读；营造处另有136.57米口径，基准未解，不平均。
    en: >-
      Vatican, Cupolone e Lanterna: stages in 1564, 1590 and 1593; exterior height 133.30 m, exterior diameter 58.90 m, interior diameter 41.50 m, finial dimensions, three dormer rows and paired lantern columns. The text was consulted. A separate Fabbrica figure of 136.57 m has an unresolved datum and is not averaged with it.
    url: https://www.vatican.va/content/vatican/it/ra/cupolone-lanterna.html
  V4:
    short: {zh: 梵蒂冈，Maderno立面, en: Vatican, Maderno's façade}
    zh: >-
      梵蒂冈《Facciata Basilica》：立面1607–1614、116×45.50米、巨柱及中央山墙尺寸、五入口／五阳台。本文已核读；营造处概述1608–1612，作主施工阶段比较，不抹平差异。
    en: >-
      Vatican, Facciata Basilica: façade dated 1607–1614, dimensions 116 by 45.50 m, giant columns, pediment, five entrances and five balconies. The text was consulted. The Fabbrica's summary gives 1608–1612, retained as a different account of the main building stage.
    url: https://www.vatican.va/content/vatican/it/ra/facciata-basilica.html
  V5:
    short: {zh: 梵蒂冈，1656–1667年柱廊, en: Vatican, colonnade of 1656–1667}
    zh: 梵蒂冈《Colonnato》：1656年委托、1657年起工、1667年结束；不用于补画1626年广场。正文已核读。
    en: >-
      Vatican, Colonnato: commissioned in 1656, building begun in 1657 and concluded in 1667; excluded from the model of 1626. The text was consulted.
    url: https://www.vatican.va/content/vatican/it/ra/colonnato-statue-santi.html
  V6:
    short: {zh: 梵蒂冈城国宫史, en: Vatican State history}
    zh: 梵蒂冈城国《Storia》：中世纪宫殿、西斯廷礼拜堂与Belvedere的分期。用作周边存在性约束，不冒称1626年每个宫翼都有测绘。
    en: >-
      Vatican State, Storia: medieval palaces, the Sistine Chapel and the Belvedere. Used to establish the surrounding complex, without claiming a surveyed plan of every wing in 1626.
    url: https://www.vaticanstate.va/it/stato-e-governo/storia.html
  A1:
    short: {zh: 意大利参议院，旧新大殿图记, en: Italian Senate, old and new basilicas}
    zh: >-
      意大利参议院《San Pietro in Vaticano》：Alfarano／Bonifacio1590年平面、旧殿余部使用到1609年及后期版画。所读为展览说明，不是Alfarano全部原稿。
    en: >-
      Italian Senate, San Pietro in Vaticano: Alfarano and Bonifacio's 1590 plan, the old nave's use until 1609 and later prints. The exhibition commentary was consulted, not Alfarano's complete manuscript.
    url: https://antiquorum-habet.senato.it/index.php/section/section_61_it/
  F1:
    short: {zh: Falda，1667年罗马图, en: Falda's map of Rome, 1667}
    zh: >-
      Giovanni Battista Falda，1667年罗马图，Emory／Pitts馆藏。既有研究用它约束堂身与Borgo、园地的形制关系；它是后期鸟瞰图，不是1626年的实测竣工图。
    en: >-
      Giovanni Battista Falda, map of Rome, 1667, Emory/Pitts collection. Existing research uses its views of the basilica, Borgo and gardens as formal comparisons; this later bird's-eye map is not a measured as-built plan of 1626.
    url: https://digital.pitts.emory.edu/s/digital-collections/item/6418
