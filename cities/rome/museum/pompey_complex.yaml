sources:
  M01:
    short: { zh: 罗马市文物局：庞培议事厅, en: "Rome heritage authority: Curia of Pompey" }
    zh: 罗马市文物局《La Curia di Pompeo》。记述前44年3月15日的元老院会议、凯撒遇刺、B/C神庙后的遗址及其与剧场、柱廊的关系；不是共和立面图。
    en: "Sovrintendenza Capitolina, La Curia di Pompeo: the Senate meeting and assassination on 15 March 44 BCE, remains behind Temples B and C, and the theatre-portico relationship; not a Republican elevation drawing."
    url: https://www.sovraintendenzaroma.it/content/la-curia-di-pompeo/
  M02:
    short: { zh: Marra等，2021：议事厅材料与分期, en: "Marra et al., 2021: materials and building phases" }
    zh: Marra、D'Ambrosio、Gaeta与Monterroso-Checa，《Petrographical and geochemical criteria for a chronology of Roman mortars…》，作者稿第4–5页。记24×27米独立厅、前55年建筑群及原期与奥古斯都封堵的区别；公开作者稿未附图像。
    en: "Marra, D'Ambrosio, Gaeta and Monterroso-Checa, Petrographical and geochemical criteria for a chronology of Roman mortars…, 2021, author manuscript pp. 4–5: separate hall of 24 by 27 metres, the 55 BCE complex, and the distinction between its original phase and Augustan blocking. Figures are absent from this manuscript."
    url: https://www.earth-prints.org/server/api/core/bitstreams/360b9464-fa88-42e6-8306-22f1e37bc193/content
  M03:
    short: { zh: Monterroso Checa，2022：考古平面与争论, en: "Monterroso Checa, 2022: archaeology and disputed reconstructions" }
    zh: Antonio Monterroso Checa，《Il complesso pompeiano del Campo Marzio. Forma e dibattito》，第292–301页，尤第300–301页、图17与18。考古研究区分独立厅、庞培原期、奥古斯都封堵及后加厕所；不提供完整共和立面或实测原高。
    en: "Antonio Monterroso Checa, Il complesso pompeiano del Campo Marzio. Forma e dibattito, 2022, pp. 292–301, especially pp. 300–301 and figs. 17–18. Distinguishes the independent hall, its Pompeian phase, Augustan blocking and later latrines; does not provide a complete Republican elevation or measured original height."
    url: https://helvia.uco.es/bitstream/handle/10396/24612/17_Monterroso_Checa.pdf?isAllowed=y&sequence=1
  M04:
    short: { zh: 维特鲁威5.9：剧场后廊与步行空间, en: "Vitruvius 5.9: porticoes and walks" }
    zh: 维特鲁威《建筑十书》5.9.1、5、7，Morgan英译。庞培柱廊是剧场后避雨及准备舞台用具的具名例；绿植、步行与排水是一般设计原则，不是前44年的逐项清单。
    en: "Vitruvius, On Architecture 5.9.1, 5 and 7, Morgan translation. Names Pompey's porticoes as shelter and a place to prepare stage equipment. Greenery, walks and drainage are general design principles, not a site inventory for 44 BCE."
    url: https://lexundria.com/vitr/5.9/mg
  M05:
    short: { zh: 维特鲁威5.1：法诺会堂的有限比较, en: "Vitruvius 5.1: a limited comparison with Fano" }
    zh: 维特鲁威《建筑十书》5.1.6–9，Morgan英译。法诺会堂50罗马尺整柱与20尺支承被模型换算为14.8及5.92米作比较；这些不是庞培议事厅或其廊柱的考古测量。
    en: "Vitruvius, On Architecture 5.1.6–9, Morgan translation. Fano's 50-Roman-foot columns and 20-foot supports are converted to 14.8 and 5.92 metres as model comparisons, not archaeological measurements of Pompey's hall or porticoes."
    url: https://lexundria.com/vitr/5.1/mg
  M06:
    short: { zh: Stanford《大理石平面图》39ac编目, en: "Stanford Marble Plan catalogue, fragment 39ac" }
    zh: Stanford Digital Forma Urbis Romae Project，39ac，Description、Identification与Significance。记录较晚柱廊及长方形、点方块的不同解释；编目明确指出图上长度与遗存不尽相符，不能当成前44年精确园池或植树图。
    en: "Stanford Digital Forma Urbis Romae Project, fragment 39ac, Description, Identification and Significance. Catalogues a later portico and competing readings of its rectangles and dotted squares. Notes discrepancies in its represented length; it cannot be treated as an exact garden or planting plan for 44 BCE."
    url: https://formaurbis.stanford.edu/fragment_39ac.html
  M07:
    short: { zh: Digital Augustan Rome：庞培剧场, en: "Digital Augustan Rome: Theatre of Pompey" }
    zh: 《Theatrum Pompeium / Pompeianum》。既有学术综述支持前55年启用、朝东的半圆座席，并区分早期平直舞台的比较复原与公元80年火灾后的曲折立面；所引更早考古出版物本页未逐一核读。
    en: "Theatrum Pompeium / Pompeianum. An existing scholarly synthesis supporting dedication in 55 BCE and east-facing seating, and distinguishing a comparative early straight stage from the recessed facade after the fire of AD 80. Earlier archaeological publications cited by the entry were not individually read for this page."
    url: https://www.digitalaugustanrome.org/records/theatrum-pompeium-pompeianum/
  M08:
    short: { zh: Digital Augustan Rome：庞培柱廊, en: "Digital Augustan Rome: Porticoes of Pompey" }
    zh: 《Porticus Pompeianae》。既有学术综述记剧场后方园廊、东端议事厅及约180×135米中央空间；主要平面证据属于塞维鲁时代，不逐项倒用到前44年。
    en: "Porticus Pompeianae. An existing scholarly synthesis describing the garden portico behind the theatre, the hall at its eastern end and a central space of about 180 by 135 metres. Its principal plan evidence is Severan and is not transferred detail by detail to 44 BCE."
    url: https://www.digitalaugustanrome.org/records/porticus-pompeianae/
