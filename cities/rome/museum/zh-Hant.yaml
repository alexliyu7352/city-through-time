- zh: 公元80年启用时的概括形制
  zh-Hant: 西元80年啟用時的概括形制
- zh: 罗马帕拉蒂尼、埃斯奎林和凯利乌斯山之间，原尼禄金宫人工湖的位置
  zh-Hant: 羅馬帕拉蒂尼、埃斯奎林和凱利烏斯山之間，原尼祿金宮人工湖的位置
- zh: 围着场地坐下
  zh-Hant: 圍著場地坐下
- zh: 这座椭圆形的大建筑原名弗拉维圆形竞技场，由提图斯在公元80年启用。它建在尼禄金宫人工湖的原址，观众席围着中央场地，可以容纳约五万人。这里举行角斗和猎兽表演。
  zh-Hant: 這座橢圓形的大建築原名弗拉維圓形競技場，由提圖斯在西元80年啟用。它建在尼祿金宮人工湖的原址，觀眾席圍著中央場地，可以容納約五萬人。這裡舉行角鬥和獵獸表演。
- zh: 尺寸有据，细节有别
  zh-Hant: 尺寸有據，細節有別
- zh: 罗马市府列出的外部尺寸约为189×156米，高逾48米，中央场地约76×46米；外立面有三层拱廊，每层80个券，其上还有实墙层。这些是整座建筑的概括资料，不能证明公元80年启用时所有顶层工程已经完成。模型保留48米的概括高度，没有另画顶层实墙和其装饰。
  zh-Hant: 羅馬市府列出的外部尺寸約為189×156米，高逾48米，中央場地約76×46米；外立面有三層拱廊，每層80個券，其上還有實牆層。這些是整座建築的概括資料，不能證明西元80年啟用時所有頂層工程已經完成。模型保留48米的概括高度，沒有另畫頂層實牆和其裝飾。
- zh: 这座模型画到哪里
  zh-Hant: 這座模型畫到哪裡
- zh: 模型采用影片中的同一座椭圆座席环，高度恢复为原比例。它的座席断面经过简化，中央场地成为79×46米，长轴比市府数字多3米；场边4米矮墙也是估值。三排深色矩形只标示外廊开口，没有复原真正的圆拱、柱式、雕刻、屋顶或遮阳篷。这些部分因此标为推测。模型没有表现地下设施；开幕时已有木构技术空间，多米提安时期才改为永久砌体，不能把今天露出的地下走廊搬到80年。
  zh-Hant: 模型採用影片中的同一座橢圓座席環，高度恢復為原比例。它的座席斷面經過簡化，中央場地成為79×46米，長軸比市府數字多3米；場邊4米矮牆也是估值。三排深色矩形只標示外廊開口，沒有復原真正的圓拱、柱式、雕刻、屋頂或遮陽篷。這些部分因此標為推測。模型沒有表現地下設施；開幕時已有木構技術空間，多米提安時期才改為永久砌體，不能把今天露出的地下走廊搬到80年。
- zh: 观众席围着一片覆沙的木地板，表演在沙面上进行，准备工作则在下面完成。考古公园把开幕时的木构设施与后来永久砌筑的地下空间分开介绍。这座模型只让人看清观众席和场地的关系，没有复原木地板下的房间、升降机械或某一天的节目。
  zh-Hant: 觀眾席圍著一片覆沙的木地板，表演在沙面上進行，準備工作則在下面完成。考古公園把開幕時的木構設施與後來永久砌築的地下空間分開介紹。這座模型只讓人看清觀眾席和場地的關係，沒有復原木地板下的房間、升降機械或某一天的節目。
- zh: 三排外廊开口的示意
  zh-Hant: 三排外廊開口的示意
- zh: 三层拱廊、每层80个券有文献依据；模型只以240个深色矩形代替。开口高度、宽度、间距和三层等分的办法都是简化估配，矩形没有凿穿主体，也没有圆拱顶、半柱或柱头。它们不代表已测得的80年立面。
  zh-Hant: 三層拱廊、每層80個券有文獻依據；模型只以240個深色矩形代替。開口高度、寬度、間距和三層等分的辦法都是簡化估配，矩形沒有鑿穿主體，也沒有圓拱頂、半柱或柱頭。它們不代表已測得的80年立面。
- zh: 椭圆主体和座席的简化复原
  zh-Hant: 橢圓主體和座席的簡化復原
- zh: 外框189×156米和高约48米依整座建筑的公开尺寸取值；座席坡度、分带和4米场边墙为估配。等厚座席环使中央场地成为79×46米，长轴比市府的76米多3米。主体是一整件，无法把有据外框与推测断面分开着色，因此整体标为推测。上缘没有另分顶层实墙、屋顶、雕刻或遮阳篷，也不证明80年全部顶层完工；地下木构和后来永久砌体都没有建模。
  zh-Hant: 外框189×156米和高約48米依整座建築的公開尺寸取值；座席坡度、分帶和4米場邊牆為估配。等厚座席環使中央場地成為79×46米，長軸比市府的76米多3米。主體是一整件，無法把有據外框與推測斷面分開著色，因此整體標為推測。上緣沒有另分頂層實牆、屋頂、雕刻或遮陽篷，也不證明80年全部頂層完工；地下木構和後來永久砌體都沒有建模。
