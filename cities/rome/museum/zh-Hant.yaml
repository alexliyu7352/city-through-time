  zh-Hant: Stanford Digital Forma Urbis Romae Project，39ac，Description、Identification與Significance。記錄較晚柱廊及長方形、點方塊的不同解釋；編目明確指出圖上長度與遺存不盡相符，不能當成前44年精確園池或植樹圖。
