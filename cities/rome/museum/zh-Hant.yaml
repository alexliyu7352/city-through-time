  zh-Hant: Nathan T. Elkins《The Flavian Colosseum Sestertii：Currency or Largess?》，Numismatic Chronicle 166（2006），第212頁：80—81年錢幣已畫頂層圓盾，但影像不證明工程完成；實讀作者上傳的原論文正文
- zh: Elkins，2006，第212页
  zh-Hant: Elkins，2006，第212頁
