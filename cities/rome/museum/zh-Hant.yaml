- zh: 《Theatrum Pompeium / Pompeianum》。既有学术综述支持前55年启用、朝东的半圆座席，并区分早期平直舞台的比较复原与公元80年火灾后的曲折立面；该条亦记看台顶端的胜利维纳斯神庙，并明确其大小、外伸与后殿重建仍有争论；不能据此证四柱山墙形制。所引更早考古出版物本页未逐一核读。
  zh-Hant: 《Theatrum Pompeium / Pompeianum》。既有學術綜述支持前55年啟用、朝東的半圓座席，並區分早期平直舞臺的比較復原與西元80年火災後的曲折立面；該條亦記看臺頂端的勝利維納斯神廟，並明確其大小、外伸與後殿重建仍有爭論；不能據此證四柱山牆形制。所引更早考古出版物本頁未逐一核讀。
