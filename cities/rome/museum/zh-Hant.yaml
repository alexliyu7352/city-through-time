  zh-Hant: 西元80年啟用時的概括形制
- zh: 罗马帕拉蒂尼、埃斯奎林和凯利乌斯山之间，原尼禄金宫人工湖的位置
  zh-Hant: 羅馬帕拉蒂尼、埃斯奎林和凱利烏斯山之間，原尼祿金宮人工湖的位置
- zh: 围着场地坐下
  zh-Hant: 圍著場地坐下
- zh: 这座椭圆形的大建筑原名弗拉维圆形竞技场，由提图斯在公元80年启用。它建在尼禄金宫人工湖的原址，观众席围着中央场地，可以容纳约五万人。这里举行角斗和猎兽表演。
  zh-Hant: 這座橢圓形的大建築原名弗拉維圓形競技場，由提圖斯在西元80年啟用。它建在尼祿金宮人工湖的原址，觀眾席圍著中央場地，可以容納約五萬人。這裡舉行角鬥和獵獸表演。
- zh: 尺寸有据，细节有别
  zh-Hant: 尺寸有據，細節有別
- zh: 罗马市府列出的外部尺寸约为189×156米，高逾48米，中央场地约76×46米；外立面有三层拱廊，每层80个券，其上还有实墙层。模型画出这些层次，保留48米的概括高度。80—81年的提图斯钱币也画出顶层与圆盾，但钱币可以提前表现尚未完工的建筑，不能据此认定开幕时每项工程均已完成。
  zh-Hant: 羅馬市府列出的外部尺寸約為189×156米，高逾48米，中央場地約76×46米；外立面有三層拱廊，每層80個券，其上還有實牆層。模型畫出這些層次，保留48米的概括高度。80—81年的提圖斯錢幣也畫出頂層與圓盾，但錢幣可以提前表現尚未完工的建築，不能據此認定開幕時每項工程均已完成。
- zh: 这座模型画到哪里
  zh-Hant: 這座模型畫到哪裡
- zh: 这座详细模型沿用影片的椭圆外框，高度不作垂直放大，画出圆拱、半柱、檐部、顶层小窗，以及分段座席、阶梯和座席上方的有顶柱廊。三层高度与券宽参考Colagrossi于1913年所记建筑尺寸，并非80年完工清单；柱式顺序另有资料核实。起拱、柱座、座席分配和顶层细部仍为估配，全部分件标为推测。等宽座席环使场地成为约79×46米，比市府数字长3米。模型未画雕像、圆盾、遮阳篷及其桅杆、轴线入口门廊，也未画地下设施；开幕时的木构技术空间不能混同于多米提安时期的永久砌体。
  zh-Hant: 這座詳細模型沿用影片的橢圓外框，高度不作垂直放大，畫出圓拱、半柱、簷部、頂層小窗，以及分段座席、階梯和座席上方的有頂柱廊。三層高度與券寬參考Colagrossi於1913年所記建築尺寸，並非80年完工清單；柱式順序另有資料核實。起拱、柱座、座席分配和頂層細部仍為估配，全部分件標為推測。等寬座席環使場地成為約79×46米，比市府數字長3米。模型未畫雕像、圓盾、遮陽篷及其桅杆、軸線入口門廊，也未畫地下設施；開幕時的木構技術空間不能混同於多米提安時期的永久砌體。
- zh: 观众席围着一片覆沙的木地板，表演在沙面上进行，准备工作则在下面完成。考古公园把开幕时的木构设施与后来永久砌筑的地下空间分开介绍。这座模型只让人看清观众席和场地的关系，没有复原木地板下的房间、升降机械或某一天的节目。
  zh-Hant: 觀眾席圍著一片覆沙的木地板，表演在沙面上進行，準備工作則在下面完成。考古公園把開幕時的木構設施與後來永久砌築的地下空間分開介紹。這座模型只讓人看清觀眾席和場地的關係，沒有復原木地板下的房間、升降機械或某一天的節目。
- zh: 外墙三层拱廊和第二圈拱
  zh-Hant: 外牆三層拱廊和第二圈拱
- zh: 外墙三层、每层80券有据。模型各层高10.5、11.85、11.6米，外券宽均4.3米，采用Colagrossi所记建筑尺寸；他未在这段逐项区分原构与后修，不能把这些数值称作80年精密测绘。起拱沿用默认值，在本层地面上4.95、6.5、6.5米，后两数含估定的1.6米柱座。内圈券宽取外券九成，廊道进深4.5米、墙厚、券边线脚和筒拱也为估配。
  zh-Hant: 外牆三層、每層80券有據。模型各層高10.5、11.85、11.6米，外券寬均4.3米，採用Colagrossi所記建築尺寸；他未在這段逐項區分原構與後修，不能把這些數值稱作80年精密測繪。起拱沿用預設值，在本層地面上4.95、6.5、6.5米，後兩數含估定的1.6米柱座。內圈券寬取外券九成，廊道進深4.5米、牆厚、券邊線腳和筒拱也為估配。
- zh: 半柱、檐部和栏墙
  zh-Hant: 半柱、簷部和欄牆
- zh: 国王学院的建筑条目逐层列明托斯卡纳、爱奥尼、科林斯式半柱，与模型一致。模型半柱半径0.5米，上两层柱座和栏墙高1.6米，三层统一采用高1.7米的简化檐部；这些尺寸、脚部台阶和柱础柱头轮廓均为默认估值，不能当作80年实测。柱头没有雕刻细节。
  zh-Hant: 國王學院的建築條目逐層列明托斯卡納、愛奧尼、科林斯式半柱，與模型一致。模型半柱半徑0.5米，上兩層柱座和欄牆高1.6米，三層統一採用高1.7米的簡化簷部；這些尺寸、腳部臺階和柱礎柱頭輪廓均為預設估值，不能當作80年實測。柱頭沒有雕刻細節。
- zh: 顶层实墙
  zh-Hant: 頂層實牆
- zh: 实墙层画出壁柱、隔券一窗、外托架和檐口桅杆孔，但没有桅杆。0.6米估定台基与三层拱廊之和使其从34.55米升至48米，高13.45米；这只是模型分配，不是80年顶层实测。窗、壁柱柱头和托架尺寸为估值。同期钱币画出完整顶层，晚期编年史又把完成工程归于多米提安，因此开幕时状态仍有保留。
  zh-Hant: 實牆層畫出壁柱、隔券一窗、外托架和簷口桅杆孔，但沒有桅杆。0.6米估定臺基與三層拱廊之和使其從34.55米升至48米，高13.45米；這只是模型分配，不是80年頂層實測。窗、壁柱柱頭和托架尺寸為估值。同期錢幣畫出完整頂層，晚期編年史又把完成工程歸於多米提安，因此開幕時狀態仍有保留。
- zh: 座席和顶上柱廊
  zh-Hant: 座席和頂上柱廊
- zh: 模型座席分三段，由上向下为10、24、4排，段间有通道、矮墙和暗色出口，64条阶梯分开座席。顶上柱廊有160柱，高7米，带一圈平顶。排数、坡度、阶梯和出口数量、40米平台高度及柱廊细部均为默认估配；尤其不能把这套完整顶层安排认定为80年开幕实况。
  zh-Hant: 模型座席分三段，由上向下為10、24、4排，段間有通道、矮牆和暗色出口，64條階梯分開座席。頂上柱廊有160柱，高7米，帶一圈平頂。排數、坡度、階梯和出口數量、40米平臺高度及柱廊細部均為預設估配；尤其不能把這套完整頂層安排認定為80年開幕實況。
- zh: 场边矮墙和中央场地
  zh-Hant: 場邊矮牆和中央場地
- zh: 中央场地由55米等宽环算成约79×46米，比市府所列长3米。场边平台面约4.9米、栏墙顶约5.8米；这些高度都是模型估值。沙面有文献依据，木地板厚度、下部房间和机械没有建模，不能画成今天的露天地下遗址。
  zh-Hant: 中央場地由55米等寬環算成約79×46米，比市府所列長3米。場邊平臺面約4.9米、欄牆頂約5.8米；這些高度都是模型估值。沙面有文獻依據，木地板厚度、下部房間和機械沒有建模，不能畫成今天的露天地下遺址。
