- zh: 伦敦国王学院《Art of Making》，Colosseum条目：80年启用、观众容量、材料和外廊构成；所列考古书目未另行核读
  zh-Hant: 倫敦國王學院《Art of Making》，Colosseum條目：80年啟用、觀眾容量、材料和外廊構成；所列考古書目未另行核讀
- zh: 伦敦国王学院
  zh-Hant: 倫敦國王學院
- zh: 罗马市府旅游局《L'Anfiteatro Flavio (Colosseo)》：整体尺寸、外廊、座席和覆沙木地板；不作为80年各部分完工的逐项证明
  zh-Hant: 羅馬市府旅遊局《L'Anfiteatro Flavio (Colosseo)》：整體尺寸、外廊、座席和覆沙木地板；不作為80年各部分完工的逐項證明
- zh: 罗马市府
  zh-Hant: 羅馬市府
- zh: Eugenio D'Anna与Pier Gabriele Molari《Il velarium del Colosseo：una nuova interpretazione》，第22页：三层拱廊、每层80券及上方实墙；不采用其遮阳篷复原和不同的场地尺寸
  zh-Hant: Eugenio D'Anna與Pier Gabriele Molari《Il velarium del Colosseo：una nuova interpretazione》，第22頁：三層拱廊、每層80券及上方實牆；不採用其遮陽篷復原和不同的場地尺寸
- zh: 博洛尼亚遮阳篷研究，第22页
  zh-Hant: 博洛尼亞遮陽篷研究，第22頁
- zh: 罗马斗兽场考古公园《I sotterranei del Colosseo》：开幕时木构技术空间，多米提安时期改为永久砌体；本轮核读项目留存的正文
  zh-Hant: 羅馬鬥獸場考古公園《I sotterranei del Colosseo》：開幕時木構技術空間，多米提安時期改為永久砌體；本輪核讀專案留存的正文
- zh: 考古公园地下设施介绍
  zh-Hant: 考古公園地下設施介紹
- zh: Rabun Taylor等《New Wine for Old Bottles》，The Waters of Rome 9（2016），第26页注29：引用晚期编年史讨论多米提安完成顶层；未核读所引古代原文
  zh-Hant: Rabun Taylor等《New Wine for Old Bottles》，The Waters of Rome 9（2016），第26頁注29：引用晚期編年史討論多米提安完成頂層；未核讀所引古代原文
- zh: Taylor等，2016，注29
  zh-Hant: Taylor等，2016，注29
- zh: 新圣彼得大教堂
  zh-Hant: 新聖彼得大教堂
- zh: 1506–1626年建成；不含1656–1667年的广场柱廊
  zh-Hant: 1506–1626年建成；不含1656–1667年的廣場柱廊
- zh: 梵蒂冈，旧圣彼得大教堂所在的同一片土地
  zh-Hant: 梵蒂岡，舊聖彼得大教堂所在的同一片土地
- zh: 一百多年，重建同一座圣地
  zh-Hant: 一百多年，重建同一座聖地
- zh: 1506年，教宗儒略二世为新大殿奠基；到1626年，建筑才完成。新旧两座教堂都以传为彼得墓的地点为中心。另一页「旧圣彼得大教堂」展示它的前身：旧殿不是1506年一下子全部拆掉，一部分中殿仍与新工地并存到17世纪初。
  zh-Hant: 1506年，教宗儒略二世為新大殿奠基；到1626年，建築才完成。新舊兩座教堂都以傳為彼得墓的地點為中心。另一頁「舊聖彼得大教堂」展示它的前身：舊殿不是1506年一下子全部拆掉，一部分中殿仍與新工地並存到17世紀初。
- zh: 谁完成了这座穹顶
  zh-Hant: 誰完成了這座穹頂
- zh: 米开朗基罗设计穹顶，1564年去世时只建到鼓座。Giacomo della Porta与Domenico Fontana在1588–1590年完成穹顶主体，顶端的球和十字架在1593年安置。后来，Carlo Maderno延长东侧中殿，建起宽大的入口立面。1626年的建筑包含这些不同年代的工作。
  zh-Hant: 米開朗基羅設計穹頂，1564年去世時只建到鼓座。Giacomo della Porta與Domenico Fontana在1588–1590年完成穹頂主體，頂端的球和十字架在1593年安置。後來，Carlo Maderno延長東側中殿，建起寬大的入口立面。1626年的建築包含這些不同年代的工作。
- zh: 还没有柱廊的广场
  zh-Hant: 還沒有柱廊的廣場
- zh: 今天环抱广场的Bernini柱廊属于1656–1667年，不在这座1626年的模型里。但教堂外不是空旷乡野：北面已有教宗宫殿群，东面通向Borgo街区，西面是梵蒂冈丘地和园地。页面只抽出教堂，空白底板没有复原这些周边，也不是当年广场的边界测绘。
  zh-Hant: 今天環抱廣場的Bernini柱廊屬於1656–1667年，不在這座1626年的模型裡。但教堂外不是空曠鄉野：北面已有教宗宮殿群，東面通向Borgo街區，西面是梵蒂岡丘地和園地。頁面只抽出教堂，空白底板沒有復原這些周邊，也不是當年廣場的邊界測繪。
- zh: 有尺寸依据，也有量体估值
  zh-Hant: 有尺寸依據，也有量體估值
- zh: 立面采用梵蒂冈公布的116米宽、45.5米高（不含顶像）；穹顶沿用同一来源从街面到十字顶133.3米的口径。白模按原高度展示，堂身、侧翼、鼓座分层和小穹顶的许多细尺寸仍是图像约束的估值。模型简化了窗饰、雕像与室内，没有把今天的全部装饰当作1626年的完成状态。
  zh-Hant: 立面採用梵蒂岡公佈的116米寬、45.5米高（不含頂像）；穹頂沿用同一來源從街面到十字頂133.3米的口徑。白模按原高度展示，堂身、側翼、鼓座分層和小穹頂的許多細尺寸仍是影像約束的估值。模型簡化了窗飾、雕像與室內，沒有把今天的全部裝飾當作1626年的完成狀態。
- zh: 重建延续了一百多年，朝圣和礼拜仍围绕彼得纪念地进行。这里的三幅生活想象让少量朝圣者经过1626年的教堂外部，以人物说明大殿的尺度；衣着、材料风化和未测的地面细节是想象。图中没有后来的椭圆柱廊，也没有20世纪拆出、直通教堂的和解大道。
  zh-Hant: 重建延續了一百多年，朝聖和禮拜仍圍繞彼得紀念地進行。這裡的三幅生活想像讓少量朝聖者經過1626年的教堂外部，以人物說明大殿的尺度；衣著、材料風化和未測的地面細節是想像。圖中沒有後來的橢圓柱廊，也沒有20世紀拆出、直通教堂的和解大道。
- zh: Maderno立面与巨柱
  zh-Hant: Maderno立面與巨柱
- zh: 官方记立面116×45.50米、巨柱高27.48米、直径2.77米、中央山墙30×7.50米。模型保留这些尺寸，八根柱子分段表示柱脚、柱身和简化柱头；柱位、洞口细形及进深为图像估值，科林斯叶饰和顶像未复原。
  zh-Hant: 官方記立面116×45.50米、巨柱高27.48米、直徑2.77米、中央山牆30×7.50米。模型保留這些尺寸，八根柱子分段表示柱腳、柱身和簡化柱頭；柱位、洞口細形及進深為影像估值，科林斯葉飾和頂像未復原。
- zh: 立面细部
  zh-Hant: 立面細部
- zh: 入口、上层阳台和中央祝福阳台的存在有官方说明。模型使用规则化拱口、薄凸段、檐口、阁楼窗和低栏墙表示它们；开口比例、位置、层高与进深是图像估值，没有完整复原四壁龛、雕塑和栏杆。
  zh-Hant: 入口、上層陽臺和中央祝福陽臺的存在有官方說明。模型使用規則化拱口、薄凸段、簷口、閣樓窗和低欄牆表示它們；開口比例、位置、層高與進深是影像估值，沒有完整復原四壁龕、雕塑和欄杆。
- zh: 鼓座与成对柱
  zh-Hant: 鼓座與成對柱
- zh: 鼓座和成对柱形制有据，但模型的50米鼓座、20米分层高度、柱位和檐口剖面是量体估值。41.50米内口借官方穹顶内径作比较，不是鼓座壁厚的实测；内部双壳未复原。
  zh-Hant: 鼓座和成對柱形制有據，但模型的50米鼓座、20米分層高度、柱位和簷口剖面是量體估值。41.50米內口借官方穹頂內徑作比較，不是鼓座壁厚的實測；內部雙殼未復原。
- zh: 穹顶与灯亭
  zh-Hant: 穹頂與燈亭
- zh: 官方给出外部总高133.30米，并说明砖砌双壳和铅覆面。模型只画外形；主壳曲线、35米升高、肋的宽与凸出量、灯亭各段比例是估值。可见的16条肋和灯亭成对柱表示结构节奏，不能当逐件测绘。
  zh-Hant: 官方給出外部總高133.30米，並說明磚砌雙殼和鉛覆面。模型只畫外形；主殼曲線、35米升高、肋的寬與凸出量、燈亭各段比例是估值。可見的16條肋和燈亭成對柱表示結構節奏，不能當逐件測繪。
- zh: 顶球与十字架
  zh-Hant: 頂球與十字架
- zh: 顶球与十字架在1593年安置；官方列球径2.50米、十字高3.33米。模型保留这一尺寸分支，细部剖面和结构连接经过简化。它们不属于米开朗基罗1564年去世时已完成的部分。
  zh-Hant: 頂球與十字架在1593年安置；官方列球徑2.50米、十字高3.33米。模型保留這一尺寸分支，細部剖面和結構連接經過簡化。它們不屬於米開朗基羅1564年去世時已完成的部分。
- zh: 两侧小穹顶
  zh-Hant: 兩側小穹頂
- zh: 两侧小穹顶帮助辨认大殿的轮廓；模型的20米直径、位置、基座高度、壳形及灯亭均为图像约束的估值，不是有尺测绘。后期图像只作形制比较，不把图上所有广场设施提前到1626年。
  zh-Hant: 兩側小穹頂幫助辨認大殿的輪廓；模型的20米直徑、位置、基座高度、殼形及燈亭均為影像約束的估值，不是有尺測繪。後期影像只作形制比較，不把圖上所有廣場設施提前到1626年。
- zh: 十字堂身与东侧长殿
  zh-Hant: 十字堂身與東側長殿
- zh: 西部中央体、横向两翼、后殿和Maderno延长的东中殿有据。模型的具体房体尺度、42米堂身檐高、屋面和窗列是量体估配；不是把一张1590年旧新叠图当作1626年完整竣工图。内部礼拜堂与祭坛未画。
  zh-Hant: 西部中央體、橫向兩翼、後殿和Maderno延長的東中殿有據。模型的具體房體尺度、42米堂身簷高、屋面和窗列是量體估配；不是把一張1590年舊新疊圖當作1626年完整竣工圖。內部禮拜堂與祭壇未畫。
