  zh-Hant: Pietro Zander，聖彼得營造處《The Basilica》：1506年奠基、彼得墓中心及Maderno延長大殿。正文已核讀。
- zh: 圣彼得营造处，建筑史
  zh-Hant: 聖彼得營造處，建築史
- zh: 圣彼得营造处《Quando è stata costruita la Basilica di San Pietro?》：1506年开建、1626年完成，替代4世纪旧殿。正文已核读。
  zh-Hant: 聖彼得營造處《Quando è stata costruita la Basilica di San Pietro?》：1506年開建、1626年完成，替代4世紀舊殿。正文已核讀。
- zh: 圣彼得营造处，1506–1626
  zh-Hant: 聖彼得營造處，1506–1626
- zh: 梵蒂冈《Cupolone e Lanterna》：1564／1590／1593分期、133.30米外高、58.90米外径与41.50米内径、顶球和十字尺寸。本文已核读；营造处另有136.57米口径，基准未解，不平均。
  zh-Hant: 梵蒂岡《Cupolone e Lanterna》：1564／1590／1593分期、133.30米外高、58.90米外徑與41.50米內徑、頂球和十字尺寸。本文已核讀；營造處另有136.57米口徑，基準未解，不平均。
- zh: 梵蒂冈，穹顶与灯亭
  zh-Hant: 梵蒂岡，穹頂與燈亭
- zh: 梵蒂冈《Facciata Basilica》：立面1607–1614、116×45.50米、巨柱及中央山墙尺寸、五入口／五阳台。本文已核读；营造处概述1608–1612，作主施工阶段比较，不抹平差异。
  zh-Hant: 梵蒂岡《Facciata Basilica》：立面1607–1614、116×45.50米、巨柱及中央山牆尺寸、五入口／五陽臺。本文已核讀；營造處概述1608–1612，作主施工階段比較，不抹平差異。
- zh: 梵蒂冈，Maderno立面
  zh-Hant: 梵蒂岡，Maderno立面
- zh: 梵蒂冈《Colonnato》：1656年委托、1657年起工、1667年结束；不用于补画1626年广场。正文已核读。
  zh-Hant: 梵蒂岡《Colonnato》：1656年委託、1657年起工、1667年結束；不用於補畫1626年廣場。正文已核讀。
- zh: 梵蒂冈，1656–1667年柱廊
  zh-Hant: 梵蒂岡，1656–1667年柱廊
- zh: 梵蒂冈城国《Storia》：中世纪宫殿、西斯廷礼拜堂与Belvedere的分期。用作周边存在性约束，不冒称1626年每个宫翼都有测绘。
  zh-Hant: 梵蒂岡城國《Storia》：中世紀宮殿、西斯廷禮拜堂與Belvedere的分期。用作周邊存在性約束，不冒稱1626年每個宮翼都有測繪。
- zh: 梵蒂冈城国宫史
  zh-Hant: 梵蒂岡城國宮史
- zh: 意大利参议院《San Pietro in Vaticano》：Alfarano／Bonifacio1590年平面、旧殿余部使用到1609年及后期版画。所读为展览说明，不是Alfarano全部原稿。
  zh-Hant: 義大利參議院《San Pietro in Vaticano》：Alfarano／Bonifacio1590年平面、舊殿餘部使用到1609年及後期版畫。所讀為展覽說明，不是Alfarano全部原稿。
- zh: 意大利参议院，旧新大殿图记
  zh-Hant: 義大利參議院，舊新大殿圖記
- zh: Giovanni Battista Falda，1667年罗马图，Emory／Pitts馆藏。既有研究用它约束堂身与Borgo、园地的形制关系；它是后期鸟瞰图，不是1626年的实测竣工图。
  zh-Hant: Giovanni Battista Falda，1667年羅馬圖，Emory／Pitts館藏。既有研究用它約束堂身與Borgo、園地的形制關係；它是後期鳥瞰圖，不是1626年的實測竣工圖。
- zh: Falda，1667年罗马图
  zh-Hant: Falda，1667年羅馬圖
- zh: 旧圣彼得大教堂
  zh-Hant: 舊聖彼得大教堂
- zh: 约330年建成；800年前后的核心形制；1506年开始拆旧建新
  zh-Hant: 約330年建成；800年前後的核心形制；1506年開始拆舊建新
- zh: 台伯河西岸的梵蒂冈，今天圣彼得大教堂的同一片土地
  zh-Hant: 台伯河西岸的梵蒂岡，今天聖彼得大教堂的同一片土地
- zh: 围着一座墓建起的大殿
  zh-Hant: 圍著一座墓建起的大殿
- zh: 君士坦丁在4世纪兴建这座教堂，把传为使徒彼得墓的地点留在建筑的中心。高大的中殿两边各有两条低侧廊，西端以横厅和半圆后殿收尾。它在罗马城墙之外，逐渐成为朝圣的目的地。这里展示沿用到800年前后的核心量体和示意前院，不是1506年拆建前每座附属建筑的完整复原。
  zh-Hant: 君士坦丁在4世紀興建這座教堂，把傳為使徒彼得墓的地點留在建築的中心。高大的中殿兩邊各有兩條低側廊，西端以橫廳和半圓後殿收尾。它在羅馬城牆之外，逐漸成為朝聖的目的地。這裡展示沿用到800年前後的核心量體和示意前院，不是1506年拆建前每座附屬建築的完整復原。
- zh: 怎样认识已经消失的建筑
  zh-Hant: 怎樣認識已經消失的建築
- zh: 旧殿的形状来自拆建时期留下的图记，以及20世纪在新殿下面进行的考古。Alfarano绘制、1590年刊行的平面把旧殿与新殿放在一起比较；Grimaldi也留下拆除前后的记录。这里通过近代研究阅读这些材料，没有直接读过他们的全部原稿。Krautheimer等人的复原也经论文转述采用；不同研究的尺寸口径并不完全相同。
  zh-Hant: 舊殿的形狀來自拆建時期留下的圖記，以及20世紀在新殿下面進行的考古。Alfarano繪製、1590年刊行的平面把舊殿與新殿放在一起比較；Grimaldi也留下拆除前後的記錄。這裡通過近代研究閱讀這些材料，沒有直接讀過他們的全部原稿。Krautheimer等人的復原也經論文轉述採用；不同研究的尺寸口徑並不完全相同。
- zh: 前院不是一块没有历史的空地
  zh-Hant: 前院不是一塊沒有歷史的空地
- zh: 800年以前已有铺地的前院和有顶廊道，通向教堂；它们在后来的岁月中不断维修、改建。模型用三条简化廊体表示前院，大小和高度都是图式估值，没有完整复原门廊、阶梯、钟楼和旁殿。大殿入口墙面也未画门洞，不能当作当年没有入口。更不能把1590年图上的全部附件倒放到君士坦丁或查理曼的时代。
  zh-Hant: 800年以前已有鋪地的前院和有頂廊道，通向教堂；它們在後來的歲月中不斷維修、改建。模型用三條簡化廊體表示前院，大小和高度都是圖式估值，沒有完整復原門廊、階梯、鐘樓和旁殿。大殿入口牆面也未畫門洞，不能當作當年沒有入口。更不能把1590年圖上的全部附件倒放到君士坦丁或查理曼的時代。
- zh: 同一片土地上的新圣彼得
  zh-Hant: 同一片土地上的新聖彼得
- zh: 1506年，新大殿开始兴建，旧殿分段拆除；东侧一部分中殿仍使用到17世纪初，并非当年整座消失。另一页「新圣彼得大教堂」展示1626年完成的建筑。两座教堂在同一地点延续对彼得墓的敬奉，体量和空间却改变了。
  zh-Hant: 1506年，新大殿開始興建，舊殿分段拆除；東側一部分中殿仍使用到17世紀初，並非當年整座消失。另一頁「新聖彼得大教堂」展示1626年完成的建築。兩座教堂在同一地點延續對彼得墓的敬奉，體量和空間卻改變了。
- zh: 朝圣者穿过前院进入教堂，来到与彼得相联系的纪念地。800年圣诞节，教宗在这座旧大殿为查理曼加冕。这里的生活想象只以少量行人说明建筑的尺度；衣着、铺地纹理和未测定的周边细节是有标示的想象，不是那个加冕场面的纪实复原。
  zh-Hant: 朝聖者穿過前院進入教堂，來到與彼得相聯繫的紀念地。800年聖誕節，教宗在這座舊大殿為查理曼加冕。這裡的生活想像只以少量行人說明建築的尺度；衣著、鋪地紋理和未測定的周邊細節是有標示的想像，不是那個加冕場面的紀實復原。
- zh: 屋面
  zh-Hant: 屋面
- zh: 高中殿和低侧廊有文献与复原研究支持；模型采用25度坡屋顶及简化的后殿半锥顶。坡度、檐高、出檐和覆面细节是估值，不是800年的屋顶测绘。
  zh-Hant: 高中殿和低側廊有文獻與復原研究支持；模型採用25度坡屋頂及簡化的後殿半錐頂。坡度、簷高、出簷和覆面細節是估值，不是800年的屋頂測繪。
- zh: 简化窗列
  zh-Hant: 簡化窗列
- zh: 研究记有高侧窗，但模型的小暗窗仅表示采光节奏，位置、数量和大小不能逐个当作古窗证据。长殿分成两段是影片表现后来拆建的接口，不是800年中殿有一道横向分隔。
  zh-Hant: 研究記有高側窗，但模型的小暗窗僅表示採光節奏，位置、數量和大小不能逐個當作古窗證據。長殿分成兩段是影片表現後來拆建的介面，不是800年中殿有一道橫向分隔。
- zh: 中殿与四条侧廊
  zh-Hant: 中殿與四條側廊
- zh: 五廊布局有据。模型沿用约91米长殿、约64米内宽及约23米中殿宽这一研究分支；以66米外宽表示墙厚。墙高和分廊细尺寸仍含估配，未复原内部柱列、墓葬和装饰。
  zh-Hant: 五廊佈局有據。模型沿用約91米長殿、約64米內寬及約23米中殿寬這一研究分支；以66米外寬表示牆厚。牆高和分廊細尺寸仍含估配，未復原內部柱列、墓葬和裝飾。
- zh: 西端横厅
  zh-Hant: 西端橫廳
- zh: 突出两侧的横厅有据。模型采用约90米横跨、18米进深；另一研究记17米，属于不同口径，未将两数平均。立面高度和构造仍是量体估值。
  zh-Hant: 突出兩側的橫廳有據。模型採用約90米橫跨、18米進深；另一研究記17米，屬於不同口徑，未將兩數平均。立面高度和構造仍是量體估值。
- zh: 半圆后殿
  zh-Hant: 半圓後殿
- zh: 西端半圆后殿及其与彼得纪念地的关系有据。模型约23米宽的外轮廓、墙高和表面是简化估配，没有画地下墓室、内部祭坛或历次改建。
  zh-Hant: 西端半圓後殿及其與彼得紀念地的關係有據。模型約23米寬的外輪廓、牆高和表面是簡化估配，沒有畫地下墓室、內部祭壇或歷次改建。
- zh: 前院与三面廊体
  zh-Hant: 前院與三面廊體
- zh: 800年以前已有铺地前院及有顶廊道，后世仍多次改建。模型沿用影片中的三条低廊体，约66米宽、70米深、6米高及规则柱跨均是图式估值，不是800年院落测绘。它表示进入大殿前的空间，没有完整复原门廊、屋架、阶梯、钟楼和附属建筑，也没有给空白的入口墙补上未经模型记录的门。
  zh-Hant: 800年以前已有鋪地前院及有頂廊道，後世仍多次改建。模型沿用影片中的三條低廊體，約66米寬、70米深、6米高及規則柱跨均是圖式估值，不是800年院落測繪。它表示進入大殿前的空間，沒有完整復原門廊、屋架、階梯、鐘樓和附屬建築，也沒有給空白的入口牆補上未經模型記錄的門。
- zh: 从东南面看前院与长殿
  zh-Hant: 從東南面看前院與長殿
- zh: 从西南面看横厅
  zh-Hant: 從西南面看橫廳
- zh: 梵蒂冈城国《Storia》：4世纪教堂、五廊、横厅、后殿及前院；官方概述不能替代各次院落改建的分期研究。
  zh-Hant: 梵蒂岡城國《Storia》：4世紀教堂、五廊、橫廳、後殿及前院；官方概述不能替代各次院落改建的分期研究。
- zh: Federico Guidobaldi，2013，《Leggere l'architettura costantiniana》，梵蒂冈大殿段及注21；本文转引Krautheimer的尺寸，未直接核读其原书。
  zh-Hant: Federico Guidobaldi，2013，《Leggere l'architettura costantiniana》，梵蒂岡大殿段及注21；本文轉引Krautheimer的尺寸，未直接核讀其原書。
- zh: Guidobaldi，君士坦丁建筑
  zh-Hant: Guidobaldi，君士坦丁建築
- zh: Silvia Donadei，2021，博洛尼亚大学博士论文《Sinodi ecclesiastici dell'impero romano d'Oriente (IV–VIII secolo)》，第171–174页；转述考古及Brandenburg、Krautheimer复原。只核读相关段落，未直接读这些原著。
  zh-Hant: Silvia Donadei，2021，博洛尼亞大學博士論文《Sinodi ecclesiastici dell'impero romano d'Oriente (IV–VIII secolo)》，第171–174頁；轉述考古及Brandenburg、Krautheimer復原。只核讀相關段落，未直接讀這些原著。
- zh: Donadei，2021，第171–174页
  zh-Hant: Donadei，2021，第171–174頁
- zh: 意大利参议院《San Pietro in Vaticano》：Alfarano／Bonifacio的1590年平面及旧殿逐段拆除。所读为展览说明，未读Alfarano全部原稿。
  zh-Hant: 義大利參議院《San Pietro in Vaticano》：Alfarano／Bonifacio的1590年平面及舊殿逐段拆除。所讀為展覽說明，未讀Alfarano全部原稿。
- zh: 意大利参议院，Alfarano平面
  zh-Hant: 義大利參議院，Alfarano平面
- zh: Federica Goffi，2010，博士论文《The Sempiternal Nature of Architectural Conservation and the Unfinished Building and Drawing》；所核为Alfarano与Grimaldi相关摘段及图录，不是Grimaldi手稿或1972年版全文。
  zh-Hant: Federica Goffi，2010，博士論文《The Sempiternal Nature of Architectural Conservation and the Unfinished Building and Drawing》；所核為Alfarano與Grimaldi相關摘段及圖錄，不是Grimaldi手稿或1972年版全文。
- zh: Goffi，2010，图记研究
  zh-Hant: Goffi，2010，圖記研究
- zh: Robert Coates-Stephens，1995，《Building in Early Medieval Rome, 500–1000 AD》，前院铺地和屋顶维修段；相关文字不提供800年完整院落测绘。
  zh-Hant: Robert Coates-Stephens，1995，《Building in Early Medieval Rome, 500–1000 AD》，前院鋪地和屋頂維修段；相關文字不提供800年完整院落測繪。
- zh: Coates-Stephens，早期中世纪营建
  zh-Hant: Coates-Stephens，早期中世紀營建
- zh: 梵蒂冈《Braccio di Carlo Magno》：800年圣诞节在圣彼得加冕；不将后世骑马像放入当时场景。
  zh-Hant: 梵蒂岡《Braccio di Carlo Magno》：800年聖誕節在聖彼得加冕；不將後世騎馬像放入當時場景。
- zh: 梵蒂冈，查理曼加冕
  zh-Hant: 梵蒂岡，查理曼加冕
- zh: Pietro Zander，圣彼得营造处《The Basilica》：1506年奠基及两座大殿共同的彼得墓中心。
  zh-Hant: Pietro Zander，聖彼得營造處《The Basilica》：1506年奠基及兩座大殿共同的彼得墓中心。
- zh: 圣彼得营造处，新殿开工
  zh-Hant: 聖彼得營造處，新殿開工
- zh: 圣彼得营造处《Quando è stata costruita la Basilica di San Pietro?》：新殿1506年开建、1626年完成，替代4世纪旧殿。
  zh-Hant: 聖彼得營造處《Quando è stata costruita la Basilica di San Pietro?》：新殿1506年開建、1626年完成，替代4世紀舊殿。
- zh: 庞培剧场、柱廊与议事厅
  zh-Hant: 龐培劇場、柱廊與議事廳
- zh: 前55年启用；展示前44年遇刺前的示意形态
  zh-Hant: 前55年啟用；展示前44年遇刺前的示意形態
- zh: 罗马战神广场南部；议事厅遗址今在银塔广场考古区西侧
  zh-Hant: 羅馬戰神廣場南部；議事廳遺址今在銀塔廣場考古區西側
- zh: 一组相连的公共建筑
  zh-Hant: 一組相連的公共建築
- zh: 庞培在前55年启用的建筑群，把剧场、舞台后方的柱廊与露天园庭连在一起。剧场的半圆形观众席朝东；园庭的另一端是庞培议事厅，一座供元老院不时开会的近方形大厅。这里展示的是整组建筑在前44年遇刺以前的示意形态，并非三个互不相干的地点。
  zh-Hant: 龐培在前55年啟用的建築群，把劇場、舞臺後方的柱廊與露天園庭連在一起。劇場的半圓形觀眾席朝東；園庭的另一端是龐培議事廳，一座供元老院不時開會的近方形大廳。這裡展示的是整組建築在前44年遇刺以前的示意形態，並非三個互不相干的地點。
- zh: 凯撒在这里遇刺
  zh-Hant: 凱撒在這裡遇刺
- zh: 前44年3月15日，尤利乌斯·凯撒在庞培议事厅参加元老院会议时被杀。地点是园庭东端的大厅，今天遗址位于银塔广场的B、C两座神庙后方。它不是罗马广场上的尤利乌斯议事堂，也不是剧场的舞台。模型保留遇刺以前的大厅，不加入后来封闭它的构筑物。
  zh-Hant: 前44年3月15日，尤利烏斯·凱撒在龐培議事廳參加元老院會議時被殺。地點是園庭東端的大廳，今天遺址位於銀塔廣場的B、C兩座神廟後方。它不是羅馬廣場上的尤利烏斯議事堂，也不是劇場的舞臺。模型保留遇刺以前的大廳，不加入後來封閉它的構築物。
- zh: 平面有依据，上部仍需推测
  zh-Hant: 平面有依據，上部仍需推測
- zh: 银塔广场的遗构和分期研究支持一座约24×27米的独立议事厅。三世纪的《罗马城大理石平面图》保存了较晚柱廊的部分布局；其图形与文献能帮助辨认建筑关系，却不能直接当成前44年的完整平面。图上长方形区域和点状方块究竟表示园地、水池或柱子，仍有不同解释。剧场舞台、廊柱和大厅的高度、屋顶、门窗与装饰都没有完整留下来。
  zh-Hant: 銀塔廣場的遺構和分期研究支持一座約24×27米的獨立議事廳。三世紀的《羅馬城大理石平面圖》保存了較晚柱廊的部分佈局；其圖形與文獻能幫助辨認建築關係，卻不能直接當成前44年的完整平面。圖上長方形區域和點狀方塊究竟表示園地、水池或柱子，仍有不同解釋。劇場舞臺、廊柱和大廳的高度、屋頂、門窗與裝飾都沒有完整留下來。
- zh: 怎样阅读这座模型
  zh-Hant: 怎樣閱讀這座模型
- zh: 模型沿用影片中的建筑位置和形体，垂直方向不放大。这不表示原高已经测定：剧场以约36米、大厅以约14.8米檐高、廊柱以约5.92米作示意。后两项借用维特鲁威所述法诺公共会堂作有限比较，不是庞培建筑的实测值。剧场外圈开口、座席分级和舞台立面均作简化，没有复原全部门窗、柱式与雕饰。各段柱廊的衔接和剧场与庭院的对位保留现有模型的近似关系。所有可见建筑构件因此标为「推测」，具体平面依据另在构件说明中交代。园树、古地坪和室内席位没有逐项复原。
  zh-Hant: 模型沿用影片中的建築位置和形體，垂直方向不放大。這不表示原高已經測定：劇場以約36米、大廳以約14.8米簷高、廊柱以約5.92米作示意。後兩項借用維特魯威所述法諾公共會堂作有限比較，不是龐培建築的實測值。劇場外圈開口、座席分級和舞臺立面均作簡化，沒有復原全部門窗、柱式與雕飾。各段柱廊的銜接和劇場與庭院的對位保留現有模型的近似關係。所有可見建築構件因此標為「推測」，具體平面依據另在構件說明中交代。園樹、古地坪和室內席位沒有逐項復原。
- zh: 这里既能看演出，也能在柱廊下走动或避雨。维特鲁威直接以庞培柱廊为例，说明剧场后廊可让观众在突然下雨时暂避，也可准备舞台用具。他还主张露天步行空间安排绿植；这说明一种近时代的公共空间用途，并没有留下前44年逐株树木、逐条园路的清单。在另一端，同一组建筑还容纳了元老院的政治活动。
  zh-Hant: 這裡既能看演出，也能在柱廊下走動或避雨。維特魯威直接以龐培柱廊為例，說明劇場後廊可讓觀眾在突然下雨時暫避，也可準備舞臺用具。他還主張露天步行空間安排綠植；這說明一種近時代的公共空間用途，並沒有留下前44年逐株樹木、逐條園路的清單。在另一端，同一組建築還容納了元老院的政治活動。
- zh: 议事厅与东侧柱廊
  zh-Hant: 議事廳與東側柱廊
- zh: 分期研究支持约24×27米的独立大厅，位于东侧柱廊中央。14.8米檐高、15度双坡顶、1.48米墙厚及4.8×5.92米中央门洞均为比较或通行关系下的推测。两翼柱廊的5.92米柱高、柱数、柱距和覆屋亦是估值。门后保留空厅；不复原席位、庞培像或行刺人物，不加入奥古斯都时期的封堵与后加厕所。
  zh-Hant: 分期研究支持約24×27米的獨立大廳，位於東側柱廊中央。14.8米簷高、15度雙坡頂、1.48米牆厚及4.8×5.92米中央門洞均為比較或通行關係下的推測。兩翼柱廊的5.92米柱高、柱數、柱距和覆屋亦是估值。門後保留空廳；不復原席位、龐培像或行刺人物，不加入奧古斯都時期的封堵與後加廁所。
- zh: 半圆形剧场与平直舞台
  zh-Hant: 半圓形劇場與平直舞臺
- zh: 剧场前55年启用、观众席朝东有据。约150米外径是既有古图的近似读数；约36米高、44米乐池尺度、14米舞台深度与48个分段为模型估值，不是共和时期逐项实测。舞台画成平直体量；舞台与最高看台同高也是示意取值，不补公元80年火灾以后重建的曲折舞台立面或未建模的维纳斯神庙。
  zh-Hant: 劇場前55年啟用、觀眾席朝東有據。約150米外徑是既有古圖的近似讀數；約36米高、44米樂池尺度、14米舞臺深度與48個分段為模型估值，不是共和時期逐項實測。舞臺畫成平直體量；舞臺與最高看臺同高也是示意取值，不補西元80年火災以後重建的曲折舞臺立面或未建模的維納斯神廟。
- zh: 北侧柱廊中段
  zh-Hant: 北側柱廊中段
- zh: 柱廊围合园庭的关系有文献与较晚平面依据。这一段69.6米长、18柱、5.92米柱高和屋顶形式承接东廊的估配；各段之间的小缝是模型衔接，不是古代廊界或出入口的证据。
  zh-Hant: 柱廊圍合園庭的關係有文獻與較晚平面依據。這一段69.6米長、18柱、5.92米柱高和屋頂形式承接東廊的估配；各段之間的小縫是模型銜接，不是古代廊界或出入口的證據。
- zh: 南侧柱廊中段与侧向通口
  zh-Hant: 南側柱廊中段與側向通口
- zh: 这一段的长度、18柱、柱高、覆屋和侧向通口均为有界估配。中央4.8米门湾用来示意城街、柱廊与园庭的通行关系，并非已发掘的前44年侧门。南侧商住街坊不在本页模型内。
  zh-Hant: 這一段的長度、18柱、柱高、覆屋和側向通口均為有界估配。中央4.8米門灣用來示意城街、柱廊與園庭的通行關係，並非已發掘的前44年側門。南側商住街坊不在本頁模型內。
- zh: 北侧柱廊西段
  zh-Hant: 北側柱廊西段
- zh: 西延段保留现有模型的72.8米长度、20柱、5.92米柱高及低坡覆屋。这些是以公共建筑关系为约束的示意尺寸；不能把三世纪大理石平面的全部凹室、园池或百柱廊倒放到前44年。
  zh-Hant: 西延段保留現有模型的72.8米長度、20柱、5.92米柱高及低坡覆屋。這些是以公共建築關係為約束的示意尺寸；不能把三世紀大理石平面的全部凹室、園池或百柱廊倒放到前44年。
- zh: 南侧柱廊西段
  zh-Hant: 南側柱廊西段
- zh: 72.8米长、20柱、柱距、墙厚与屋面都是延续既有比较值的估配。它表示园庭南侧的覆顶步行空间，并没有逐间重建较晚平面记录的商铺，也不证明本段在前44年的每个细节。
  zh-Hant: 72.8米長、20柱、柱距、牆厚與屋面都是延續既有比較值的估配。它表示園庭南側的覆頂步行空間，並沒有逐間重建較晚平面記錄的商鋪，也不證明本段在前44年的每個細節。
- zh: 剧场后方横向柱廊
  zh-Hant: 劇場後方橫向柱廊
- zh: 剧场后方有柱廊的用途有维特鲁威记载；此处135米长、35柱及具体位置是模型的近似衔接。剧场与柱廊之间约18.5米的空隙是模型的限制；实际上，柱廊直接接在剧场舞台建筑的后面。这不是一条已经考证的古街宽度，模型也不为接齐外观而移动现有建筑。
  zh-Hant: 劇場後方有柱廊的用途有維特魯威記載；此處135米長、35柱及具體位置是模型的近似銜接。劇場與柱廊之間約18.5米的空隙是模型的限制；實際上，柱廊直接接在劇場舞臺建築的後面。這不是一條已經考證的古街寬度，模型也不為接齊外觀而移動現有建築。
- zh: 从南侧看整组建筑
  zh-Hant: 從南側看整組建築
- zh: 从东北侧看剧场与园庭
  zh-Hant: 從東北側看劇場與園庭
- zh: 从园庭近看议事厅入口
  zh-Hant: 從園庭近看議事廳入口
- zh: 罗马市文物局《La Curia di Pompeo》。记述前44年3月15日的元老院会议、凯撒遇刺、B/C神庙后的遗址及其与剧场、柱廊的关系；不是共和立面图。
  zh-Hant: 羅馬市文物局《La Curia di Pompeo》。記述前44年3月15日的元老院會議、凱撒遇刺、B/C神廟後的遺址及其與劇場、柱廊的關係；不是共和立面圖。
- zh: 罗马市文物局：庞培议事厅
  zh-Hant: 羅馬市文物局：龐培議事廳
- zh: Marra、D'Ambrosio、Gaeta与Monterroso-Checa，《Petrographical and geochemical criteria for a chronology of Roman mortars…》，作者稿第4–5页。记24×27米独立厅、前55年建筑群及原期与奥古斯都封堵的区别；公开作者稿未附图像。
  zh-Hant: Marra、D'Ambrosio、Gaeta與Monterroso-Checa，《Petrographical and geochemical criteria for a chronology of Roman mortars…》，作者稿第4–5頁。記24×27米獨立廳、前55年建築群及原期與奧古斯都封堵的區別；公開作者稿未附影像。
- zh: Marra等，2021：议事厅材料与分期
  zh-Hant: Marra等，2021：議事廳材料與分期
- zh: Antonio Monterroso Checa，《Il complesso pompeiano del Campo Marzio. Forma e dibattito》，第292–301页，尤第300–301页、图17与18。考古研究区分独立厅、庞培原期、奥古斯都封堵及后加厕所；不提供完整共和立面或实测原高。
  zh-Hant: Antonio Monterroso Checa，《Il complesso pompeiano del Campo Marzio. Forma e dibattito》，第292–301頁，尤第300–301頁、圖17與18。考古研究區分獨立廳、龐培原期、奧古斯都封堵及後加廁所；不提供完整共和立面或實測原高。
- zh: Monterroso Checa，2022：考古平面与争论
  zh-Hant: Monterroso Checa，2022：考古平面與爭論
- zh: 维特鲁威《建筑十书》5.9.1、5、7，Morgan英译。庞培柱廊是剧场后避雨及准备舞台用具的具名例；绿植、步行与排水是一般设计原则，不是前44年的逐项清单。
  zh-Hant: 維特魯威《建築十書》5.9.1、5、7，Morgan英譯。龐培柱廊是劇場後避雨及準備舞臺用具的具名例；綠植、步行與排水是一般設計原則，不是前44年的逐項清單。
- zh: 维特鲁威5.9：剧场后廊与步行空间
  zh-Hant: 維特魯威5.9：劇場後廊與步行空間
- zh: 维特鲁威《建筑十书》5.1.6–9，Morgan英译。法诺会堂50罗马尺整柱与20尺支承被模型换算为14.8及5.92米作比较；这些不是庞培议事厅或其廊柱的考古测量。
  zh-Hant: 維特魯威《建築十書》5.1.6–9，Morgan英譯。法諾會堂50羅馬尺整柱與20尺支承被模型換算為14.8及5.92米作比較；這些不是龐培議事廳或其廊柱的考古測量。
- zh: 维特鲁威5.1：法诺会堂的有限比较
  zh-Hant: 維特魯威5.1：法諾會堂的有限比較
- zh: Stanford Digital Forma Urbis Romae Project，39ac，Description、Identification与Significance。记录较晚柱廊及长方形、点方块的不同解释；编目明确指出图上长度与遗存不尽相符，不能当成前44年精确园池或植树图。
  zh-Hant: Stanford Digital Forma Urbis Romae Project，39ac，Description、Identification與Significance。記錄較晚柱廊及長方形、點方塊的不同解釋；編目明確指出圖上長度與遺存不盡相符，不能當成前44年精確園池或植樹圖。
- zh: Stanford《大理石平面图》39ac编目
  zh-Hant: Stanford《大理石平面圖》39ac編目
- zh: 《Theatrum Pompeium / Pompeianum》。既有学术综述支持前55年启用、朝东的半圆座席，并区分早期平直舞台的比较复原与公元80年火灾后的曲折立面；所引更早考古出版物本页未逐一核读。
  zh-Hant: 《Theatrum Pompeium / Pompeianum》。既有學術綜述支持前55年啟用、朝東的半圓座席，並區分早期平直舞臺的比較復原與西元80年火災後的曲折立面；所引更早考古出版物本頁未逐一核讀。
- zh: Digital Augustan Rome：庞培剧场
  zh-Hant: Digital Augustan Rome：龐培劇場
- zh: 《Porticus Pompeianae》。既有学术综述记剧场后方园廊、东端议事厅及约180×135米中央空间；主要平面证据属于塞维鲁时代，不逐项倒用到前44年。
  zh-Hant: 《Porticus Pompeianae》。既有學術綜述記劇場後方園廊、東端議事廳及約180×135米中央空間；主要平面證據屬於塞維魯時代，不逐項倒用到前44年。
- zh: Digital Augustan Rome：庞培柱廊
  zh-Hant: Digital Augustan Rome：龐培柱廊
