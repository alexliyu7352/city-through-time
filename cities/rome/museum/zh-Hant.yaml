  zh-Hant: P. Colagrossi《L'Anfiteatro Flavio nei suoi venti secoli di storia》（1913），第一部第二章第42頁：三層總高與券寬；這段描述現存建築，沒有提供80年狀態的逐項分期測繪
- zh: Colagrossi，1913，第42页
  zh-Hant: Colagrossi，1913，第42頁
- zh: 新圣彼得大教堂
  zh-Hant: 新聖彼得大教堂
- zh: 1506–1626年建成；不含1656–1667年的广场柱廊
  zh-Hant: 1506–1626年建成；不含1656–1667年的廣場柱廊
- zh: 梵蒂冈，旧圣彼得大教堂所在的同一片土地
  zh-Hant: 梵蒂岡，舊聖彼得大教堂所在的同一片土地
- zh: 一百多年，重建同一座圣地
  zh-Hant: 一百多年，重建同一座聖地
- zh: 1506年，教宗儒略二世为新大殿奠基；到1626年，建筑才完成。新旧两座教堂都以传为彼得墓的地点为中心。另一页「旧圣彼得大教堂」展示它的前身：旧殿不是1506年一下子全部拆掉，一部分中殿仍与新工地并存到17世纪初。
  zh-Hant: 1506年，教宗儒略二世為新大殿奠基；到1626年，建築才完成。新舊兩座教堂都以傳為彼得墓的地點為中心。另一頁「舊聖彼得大教堂」展示它的前身：舊殿不是1506年一下子全部拆掉，一部分中殿仍與新工地並存到17世紀初。
- zh: 谁完成了这座穹顶
  zh-Hant: 誰完成了這座穹頂
- zh: 米开朗基罗设计穹顶，1564年去世时只建到鼓座。Giacomo della Porta与Domenico Fontana在1588–1590年完成穹顶主体，顶端的球和十字架在1593年安置。后来，Carlo Maderno延长东侧中殿，建起宽大的入口立面。1626年的建筑包含这些不同年代的工作。
  zh-Hant: 米開朗基羅設計穹頂，1564年去世時只建到鼓座。Giacomo della Porta與Domenico Fontana在1588–1590年完成穹頂主體，頂端的球和十字架在1593年安置。後來，Carlo Maderno延長東側中殿，建起寬大的入口立面。1626年的建築包含這些不同年代的工作。
- zh: 还没有柱廊的广场
  zh-Hant: 還沒有柱廊的廣場
- zh: 今天环抱广场的Bernini柱廊属于1656–1667年，不在这座1626年的模型里。但教堂外不是空旷乡野：北面已有教宗宫殿群，东面通向Borgo街区，西面是梵蒂冈丘地和园地。页面只抽出教堂，空白底板没有复原这些周边，也不是当年广场的边界测绘。
  zh-Hant: 今天環抱廣場的Bernini柱廊屬於1656–1667年，不在這座1626年的模型裡。但教堂外不是空曠鄉野：北面已有教宗宮殿群，東面通向Borgo街區，西面是梵蒂岡丘地和園地。頁面只抽出教堂，空白底板沒有復原這些周邊，也不是當年廣場的邊界測繪。
- zh: 有尺寸依据，也有量体估值
  zh-Hant: 有尺寸依據，也有量體估值
- zh: 立面采用梵蒂冈公布的116米宽、45.5米高（不含顶像）；穹顶沿用同一来源从街面到十字顶133.3米的名义总高。白模按原高度展示。堂身壁柱、窗框与山花、鼓座扶壁和檐口、穹顶三层老虎窗、阳台与栏杆都已画出，但多数细尺寸与剖面是依现存外观估配，未逐一证实为1626年的形制。雕像、铭文和室内未复原。
  zh-Hant: 立面採用梵蒂岡公佈的116米寬、45.5米高（不含頂像）；穹頂沿用同一來源從街面到十字頂133.3米的名義總高。白模按原高度展示。堂身壁柱、窗框與山花、鼓座扶壁和簷口、穹頂三層老虎窗、陽臺與欄杆都已畫出，但多數細尺寸與剖面是依現存外觀估配，未逐一證實為1626年的形制。雕像、銘文和室內未復原。
- zh: 重建延续了一百多年，朝圣和礼拜仍围绕彼得纪念地进行。这里的三幅生活想象让少量朝圣者经过1626年的教堂外部，以人物说明大殿的尺度；衣着、材料风化和未测的地面细节是想象。图中没有后来的椭圆柱廊，也没有20世纪拆出、直通教堂的和解大道。
  zh-Hant: 重建延續了一百多年，朝聖和禮拜仍圍繞彼得紀念地進行。這裡的三幅生活想像讓少量朝聖者經過1626年的教堂外部，以人物說明大殿的尺度；衣著、材料風化和未測的地面細節是想像。圖中沒有後來的橢圓柱廊，也沒有20世紀拆出、直通教堂的和解大道。
- zh: Maderno立面与巨柱
  zh-Hant: Maderno立面與巨柱
- zh: 官方记立面116×45.50米、巨柱高27.48米、直径2.77米、中央山墙30×7.50米。模型保留这些主要尺寸，画八根圆柱、端部壁柱及带线脚的中央山墙；柱脚、收分柱身和柱头分开表现。柱位、分段比例、卷涡和檐线剖面仍是估配，未逐叶雕刻科林斯柱头，也未复原顶像。
  zh-Hant: 官方記立面116×45.50米、巨柱高27.48米、直徑2.77米、中央山牆30×7.50米。模型保留這些主要尺寸，畫八根圓柱、端部壁柱及帶線腳的中央山牆；柱腳、收分柱身和柱頭分開表現。柱位、分段比例、卷渦和簷線剖面仍是估配，未逐葉雕刻科林斯柱頭，也未復原頂像。
- zh: 立面细部
  zh-Hant: 立面細部
- zh: 官方记五个下层入口、五个上层阳台及四个较小壁龛。模型画平顶门洞、拱顶上层开口、中央祝福阳台、壁龛凹部、端部通道、窗框与山花，以及阳台和顶层的瓶形栏杆。开口比例、位置、进深、层高及栏杆形状和间距都是规则化估值，未逐项核定为1626年的细部；雕像、浮雕、纹章和铭文未画。
  zh-Hant: 官方記五個下層入口、五個上層陽臺及四個較小壁龕。模型畫平頂門洞、拱頂上層開口、中央祝福陽臺、壁龕凹部、端部通道、窗框與山花，以及陽臺和頂層的瓶形欄杆。開口比例、位置、進深、層高及欄杆形狀和間距都是規則化估值，未逐項核定為1626年的細部；雕像、浮雕、紋章和銘文未畫。
- zh: 鼓座与成对柱
  zh-Hant: 鼓座與成對柱
- zh: 鼓座的成对柱与扶壁关系有官方说明。模型画16组成对柱、扶壁、带交替山花的窗、柱基、檐口和上下基座分层。50米鼓座外径、20米高度及柱位、窗洞、扶壁和线脚细尺寸均是估配。官方41.50米是穹顶内径，不能当作鼓座实测壁厚；本页没有复原鼓座内壁或内部双壳。
  zh-Hant: 鼓座的成對柱與扶壁關係有官方說明。模型畫16組成對柱、扶壁、帶交替山花的窗、柱基、簷口和上下基座分層。50米鼓座外徑、20米高度及柱位、窗洞、扶壁和線腳細尺寸均是估配。官方41.50米是穹頂內徑，不能當作鼓座實測壁厚；本頁沒有復原鼓座內壁或內部雙殼。
- zh: 穹顶与灯亭
  zh-Hant: 穹頂與燈亭
- zh: 官方给出133.30米外部总高，并说明砖砌双壳、铅覆面、三层带山花的老虎窗及灯亭成对柱。模型画外部主壳、16条肋、三层老虎窗和带窗灯亭。主壳曲线与35米升高、肋的尺寸、老虎窗位置和形状、灯亭柱列与各段比例都是估配；内部双壳和登顶通道未画。
  zh-Hant: 官方給出133.30米外部總高，並說明磚砌雙殼、鉛覆面、三層帶山花的老虎窗及燈亭成對柱。模型畫外部主殼、16條肋、三層老虎窗和帶窗燈亭。主殼曲線與35米升高、肋的尺寸、老虎窗位置和形狀、燈亭柱列與各段比例都是估配；內部雙殼和登頂通道未畫。
- zh: 顶球与十字架
  zh-Hant: 頂球與十字架
- zh: 顶球与十字架在1593年安置；官方列球径2.50米、十字高3.33米、横臂宽2.40米。模型保留这些主要尺寸；球下颈部、杆件厚度、端部小块与连接形状是估配。它们不属于米开朗基罗1564年去世时已完成的部分。
  zh-Hant: 頂球與十字架在1593年安置；官方列球徑2.50米、十字高3.33米、橫臂寬2.40米。模型保留這些主要尺寸；球下頸部、杆件厚度、端部小塊與連接形狀是估配。它們不屬於米開朗基羅1564年去世時已完成的部分。
- zh: 两侧小穹顶
  zh-Hant: 兩側小穹頂
- zh: 两侧小穹顶帮助辨认大殿的轮廓。模型还画基座壁柱与窗框、鼓座窗、壳上肋条和带窗灯亭；20米直径、位置、各段高度、屋面曲线和这些细部均为图像约束的估值，没有逐件的1626年测绘。后期图像只作形制比较，不把图上所有广场设施提前。
  zh-Hant: 兩側小穹頂幫助辨認大殿的輪廓。模型還畫基座壁柱與窗框、鼓座窗、殼上肋條和帶窗燈亭；20米直徑、位置、各段高度、屋面曲線和這些細部均為影像約束的估值，沒有逐件的1626年測繪。後期影像只作形制比較，不把圖上所有廣場設施提前。
- zh: 十字堂身与东侧长殿
  zh-Hant: 十字堂身與東側長殿
- zh: 西部中央体、横向两翼、后殿和Maderno延长的东中殿有据。模型在堂身与后殿外墙画巨壁柱、分层檐线、带三角或弧形山花的窗，以及侧廊上方的高侧窗。房体尺度、42米堂身檐高、屋面、柱跨与这些细部都是估配；1590年旧新叠图不是1626年竣工图，细部也未逐一确认为当时形制。内部礼拜堂与祭坛未画。
  zh-Hant: 西部中央體、橫向兩翼、後殿和Maderno延長的東中殿有據。模型在堂身與後殿外牆畫巨壁柱、分層簷線、帶三角或弧形山花的窗，以及側廊上方的高側窗。房體尺度、42米堂身簷高、屋面、柱跨與這些細部都是估配；1590年舊新疊圖不是1626年竣工圖，細部也未逐一確認為當時形制。內部禮拜堂與祭壇未畫。
- zh: 从东面看立面
  zh-Hant: 從東面看立面
- zh: 从西南面看穹顶
  zh-Hant: 從西南面看穹頂
- zh: 从西北面看后殿
  zh-Hant: 從西北面看後殿
- zh: Pietro Zander，圣彼得营造处《The Basilica》：1506年奠基、彼得墓中心及Maderno延长大殿。正文已核读。
  zh-Hant: Pietro Zander，聖彼得營造處《The Basilica》：1506年奠基、彼得墓中心及Maderno延長大殿。正文已核讀。
- zh: 圣彼得营造处，建筑史
  zh-Hant: 聖彼得營造處，建築史
- zh: 圣彼得营造处《Quando è stata costruita la Basilica di San Pietro?》：1506年开建、1626年完成，替代4世纪旧殿。正文已核读。
  zh-Hant: 聖彼得營造處《Quando è stata costruita la Basilica di San Pietro?》：1506年開建、1626年完成，替代4世紀舊殿。正文已核讀。
- zh: 圣彼得营造处，1506–1626
  zh-Hant: 聖彼得營造處，1506–1626
- zh: 梵蒂冈《Cupolone e Lanterna》：1564／1590／1593分期、133.30米外高、58.90米外径与41.50米内径、顶球和十字尺寸、三层老虎窗及灯亭成对柱。本文已核读；营造处另有136.57米口径，基准未解，不平均。
  zh-Hant: 梵蒂岡《Cupolone e Lanterna》：1564／1590／1593分期、133.30米外高、58.90米外徑與41.50米內徑、頂球和十字尺寸、三層老虎窗及燈亭成對柱。本文已核讀；營造處另有136.57米口徑，基準未解，不平均。
- zh: 梵蒂冈，穹顶与灯亭
  zh-Hant: 梵蒂岡，穹頂與燈亭
- zh: 梵蒂冈《Facciata Basilica》：立面1607–1614、116×45.50米、巨柱及中央山墙尺寸、五入口／五阳台。本文已核读；营造处概述1608–1612，作主施工阶段比较，不抹平差异。
  zh-Hant: 梵蒂岡《Facciata Basilica》：立面1607–1614、116×45.50米、巨柱及中央山牆尺寸、五入口／五陽臺。本文已核讀；營造處概述1608–1612，作主施工階段比較，不抹平差異。
- zh: 梵蒂冈，Maderno立面
  zh-Hant: 梵蒂岡，Maderno立面
- zh: 梵蒂冈《Colonnato》：1656年委托、1657年起工、1667年结束；不用于补画1626年广场。正文已核读。
  zh-Hant: 梵蒂岡《Colonnato》：1656年委託、1657年起工、1667年結束；不用於補畫1626年廣場。正文已核讀。
- zh: 梵蒂冈，1656–1667年柱廊
  zh-Hant: 梵蒂岡，1656–1667年柱廊
- zh: 梵蒂冈城国《Storia》：中世纪宫殿、西斯廷礼拜堂与Belvedere的分期。用作周边存在性约束，不冒称1626年每个宫翼都有测绘。
  zh-Hant: 梵蒂岡城國《Storia》：中世紀宮殿、西斯廷禮拜堂與Belvedere的分期。用作周邊存在性約束，不冒稱1626年每個宮翼都有測繪。
- zh: 梵蒂冈城国宫史
  zh-Hant: 梵蒂岡城國宮史
- zh: 意大利参议院《San Pietro in Vaticano》：Alfarano／Bonifacio1590年平面、旧殿余部使用到1609年及后期版画。所读为展览说明，不是Alfarano全部原稿。
  zh-Hant: 義大利參議院《San Pietro in Vaticano》：Alfarano／Bonifacio1590年平面、舊殿餘部使用到1609年及後期版畫。所讀為展覽說明，不是Alfarano全部原稿。
- zh: 意大利参议院，旧新大殿图记
  zh-Hant: 義大利參議院，舊新大殿圖記
- zh: Giovanni Battista Falda，1667年罗马图，Emory／Pitts馆藏。既有研究用它约束堂身与Borgo、园地的形制关系；它是后期鸟瞰图，不是1626年的实测竣工图。
  zh-Hant: Giovanni Battista Falda，1667年羅馬圖，Emory／Pitts館藏。既有研究用它約束堂身與Borgo、園地的形制關係；它是後期鳥瞰圖，不是1626年的實測竣工圖。
- zh: Falda，1667年罗马图
  zh-Hant: Falda，1667年羅馬圖
- zh: 旧圣彼得大教堂
  zh-Hant: 舊聖彼得大教堂
- zh: 约330年建成；800年前后的核心形制；1506年开始拆旧建新
  zh-Hant: 約330年建成；800年前後的核心形制；1506年開始拆舊建新
- zh: 台伯河西岸的梵蒂冈，今天圣彼得大教堂的同一片土地
  zh-Hant: 台伯河西岸的梵蒂岡，今天聖彼得大教堂的同一片土地
- zh: 围着一座墓建起的大殿
  zh-Hant: 圍著一座墓建起的大殿
- zh: 君士坦丁在4世纪兴建这座教堂，把传为使徒彼得墓的地点留在建筑的中心。高大的中殿两边各有两条低侧廊，西端以横厅和半圆后殿收尾。它在罗马城墙之外，逐渐成为朝圣的目的地。这里展示沿用到800年前后的核心量体和示意前院，不是1506年拆建前每座附属建筑的完整复原。
  zh-Hant: 君士坦丁在4世紀興建這座教堂，把傳為使徒彼得墓的地點留在建築的中心。高大的中殿兩邊各有兩條低側廊，西端以橫廳和半圓後殿收尾。它在羅馬城牆之外，逐漸成為朝聖的目的地。這裡展示沿用到800年前後的核心量體和示意前院，不是1506年拆建前每座附屬建築的完整復原。
- zh: 怎样认识已经消失的建筑
  zh-Hant: 怎樣認識已經消失的建築
- zh: 旧殿的形状来自拆建时期留下的图记，以及20世纪在新殿下面进行的考古。Alfarano绘制、1590年刊行的平面把旧殿与新殿放在一起比较；Grimaldi也留下拆除前后的记录。这里通过近代研究阅读这些材料，没有直接读过他们的全部原稿。Krautheimer等人的复原也经论文转述采用；不同研究的尺寸口径并不完全相同。
  zh-Hant: 舊殿的形狀來自拆建時期留下的圖記，以及20世紀在新殿下面進行的考古。Alfarano繪製、1590年刊行的平面把舊殿與新殿放在一起比較；Grimaldi也留下拆除前後的記錄。這裡通過近代研究閱讀這些材料，沒有直接讀過他們的全部原稿。Krautheimer等人的復原也經論文轉述採用；不同研究的尺寸口徑並不完全相同。
- zh: 前院不是一块没有历史的空地
  zh-Hant: 前院不是一塊沒有歷史的空地
- zh: 800年以前已有铺地的前院和有顶廊道，通向教堂；它们在后来的岁月中不断维修、改建。模型画四面有顶柱廊，其中一面贴着大殿正面，大殿有五个入口门洞。院廊的尺度、柱跨、柱头、坡屋面及门窗细形都是估配，没有完整复原阶梯、钟楼和旁殿。1590年图上的全部附件也不能倒放到君士坦丁或查理曼的时代。
  zh-Hant: 800年以前已有鋪地的前院和有頂廊道，通向教堂；它們在後來的歲月中不斷維修、改建。模型畫四面有頂柱廊，其中一面貼著大殿正面，大殿有五個入口門洞。院廊的尺度、柱跨、柱頭、坡屋面及門窗細形都是估配，沒有完整復原階梯、鐘樓和旁殿。1590年圖上的全部附件也不能倒放到君士坦丁或查理曼的時代。
- zh: 同一片土地上的新圣彼得
  zh-Hant: 同一片土地上的新聖彼得
- zh: 1506年，新大殿开始兴建，旧殿分段拆除；东侧一部分中殿仍使用到17世纪初，并非当年整座消失。另一页「新圣彼得大教堂」展示1626年完成的建筑。两座教堂在同一地点延续对彼得墓的敬奉，体量和空间却改变了。
  zh-Hant: 1506年，新大殿開始興建，舊殿分段拆除；東側一部分中殿仍使用到17世紀初，並非當年整座消失。另一頁「新聖彼得大教堂」展示1626年完成的建築。兩座教堂在同一地點延續對彼得墓的敬奉，體量和空間卻改變了。
- zh: 朝圣者穿过前院进入教堂，来到与彼得相联系的纪念地。800年圣诞节，教宗在这座旧大殿为查理曼加冕。这里的生活想象只以少量行人说明建筑的尺度；衣着、铺地纹理和未测定的周边细节是有标示的想象，不是那个加冕场面的纪实复原。
  zh-Hant: 朝聖者穿過前院進入教堂，來到與彼得相聯繫的紀念地。800年聖誕節，教宗在這座舊大殿為查理曼加冕。這裡的生活想像只以少量行人說明建築的尺度；衣著、鋪地紋理和未測定的周邊細節是有標示的想像，不是那個加冕場面的紀實復原。
- zh: 屋面
  zh-Hant: 屋面
- zh: 高中殿和低侧廊有文献与复原研究支持。模型中殿与横厅用25度双坡顶，侧廊用14度单坡顶；内侧廊高于外侧廊，阶差参数为1.6米。后殿用半锥顶。坡度、阶差、檐高、出檐、屋面厚度与瓦垄细节都是估值，不是800年的屋顶测绘。
  zh-Hant: 高中殿和低側廊有文獻與復原研究支持。模型中殿與橫廳用25度雙坡頂，側廊用14度單坡頂；內側廊高於外側廊，階差參數為1.6米。後殿用半錐頂。坡度、階差、簷高、出簷、屋面厚度與瓦壟細節都是估值，不是800年的屋頂測繪。
- zh: 门窗与窗框
  zh-Hant: 門窗與窗框
- zh: 研究记有宽大的高侧窗。模型画带框的拱顶高侧窗、外侧廊窗和横厅窗，以及正面五个平顶门洞与上方窗洞。开口数量、位置、宽高、进深和边框剖面都是规则化估值，不是逐窗测绘；被其他房体挡住的窗不画。长殿的两段沿同一屋脊与窗列衔接，不表示800年有中隔墙。
  zh-Hant: 研究記有寬大的高側窗。模型畫帶框的拱頂高側窗、外側廊窗和橫廳窗，以及正面五個平頂門洞與上方窗洞。開口數量、位置、寬高、進深和邊框剖面都是規則化估值，不是逐窗測繪；被其他房體擋住的窗不畫。長殿的兩段沿同一屋脊與窗列銜接，不表示800年有中隔牆。
- zh: 中殿与四条侧廊
  zh-Hant: 中殿與四條側廊
- zh: 五廊布局有据。模型沿用约91米长殿、约64米内宽及约23米中殿宽这一研究分支；以66米外宽表示墙厚。每边内侧廊高于外侧廊；侧廊分宽、墙高、墙厚、墙脚及檐口剖面仍是估配，未复原内部柱列、墓葬和装饰。
  zh-Hant: 五廊佈局有據。模型沿用約91米長殿、約64米內寬及約23米中殿寬這一研究分支；以66米外寬表示牆厚。每邊內側廊高於外側廊；側廊分寬、牆高、牆厚、牆腳及簷口剖面仍是估配，未復原內部柱列、墓葬和裝飾。
- zh: 西端横厅
  zh-Hant: 西端橫廳
- zh: 突出两侧的横厅有据。模型采用约90米横跨、18米进深；另一研究记17米，属于不同口径，未将两数平均。墙高、墙脚、檐口与山墙线脚仍是估值；可见立面有拱窗，不是无窗实心块。
  zh-Hant: 突出兩側的橫廳有據。模型採用約90米橫跨、18米進深；另一研究記17米，屬於不同口徑，未將兩數平均。牆高、牆腳、簷口與山牆線腳仍是估值；可見立面有拱窗，不是無窗實心塊。
- zh: 半圆后殿
  zh-Hant: 半圓後殿
- zh: 西端半圆后殿及其与彼得纪念地的关系有据。模型约23米宽的外轮廓、墙高、墙脚和檐口是简化估配，半锥形瓦屋顶也不是实测复原。地下墓室、内部祭坛和历次改建未画。
  zh-Hant: 西端半圓後殿及其與彼得紀念地的關係有據。模型約23米寬的外輪廓、牆高、牆腳和簷口是簡化估配，半錐形瓦屋頂也不是實測復原。地下墓室、內部祭壇和歷次改建未畫。
- zh: 前院与四面柱廊
  zh-Hant: 前院與四面柱廊
- zh: 800年以前已有铺地前院及有顶廊道，后世仍多次改建。模型画四面柱廊，靠大殿的一面不另立背墙；另三面有外墙，前墙有拱门。外轮廓约70×72米、顶高约6米，柱跨、柱头、梁、20度单坡瓦顶、台阶及铺地均是估配。它不是800年院落测绘，未完整复原屋架、外部阶梯、钟楼和附属建筑。
  zh-Hant: 800年以前已有鋪地前院及有頂廊道，後世仍多次改建。模型畫四面柱廊，靠大殿的一面不另立背牆；另三面有外牆，前牆有拱門。外輪廓約70×72米、頂高約6米，柱跨、柱頭、梁、20度單坡瓦頂、臺階及鋪地均是估配。它不是800年院落測繪，未完整復原屋架、外部階梯、鐘樓和附屬建築。
- zh: 从东南面看前院与长殿
  zh-Hant: 從東南面看前院與長殿
- zh: 从西南面看横厅
  zh-Hant: 從西南面看橫廳
- zh: 梵蒂冈城国《Storia》：4世纪教堂、五廊、横厅、后殿及前院；官方概述不能替代各次院落改建的分期研究。
  zh-Hant: 梵蒂岡城國《Storia》：4世紀教堂、五廊、橫廳、後殿及前院；官方概述不能替代各次院落改建的分期研究。
- zh: Federico Guidobaldi，2013，《Leggere l'architettura costantiniana》，梵蒂冈大殿段及注21；本文转引Krautheimer的尺寸，未直接核读其原书。
  zh-Hant: Federico Guidobaldi，2013，《Leggere l'architettura costantiniana》，梵蒂岡大殿段及注21；本文轉引Krautheimer的尺寸，未直接核讀其原書。
- zh: Guidobaldi，君士坦丁建筑
  zh-Hant: Guidobaldi，君士坦丁建築
- zh: Silvia Donadei，2021，博洛尼亚大学博士论文《Sinodi ecclesiastici dell'impero romano d'Oriente (IV–VIII secolo)》，第171–174页；转述考古及Brandenburg、Krautheimer复原。只核读相关段落，未直接读这些原著。
  zh-Hant: Silvia Donadei，2021，博洛尼亞大學博士論文《Sinodi ecclesiastici dell'impero romano d'Oriente (IV–VIII secolo)》，第171–174頁；轉述考古及Brandenburg、Krautheimer復原。只核讀相關段落，未直接讀這些原著。
- zh: Donadei，2021，第171–174页
  zh-Hant: Donadei，2021，第171–174頁
- zh: 意大利参议院《San Pietro in Vaticano》：Alfarano／Bonifacio的1590年平面及旧殿逐段拆除。所读为展览说明，未读Alfarano全部原稿。
  zh-Hant: 義大利參議院《San Pietro in Vaticano》：Alfarano／Bonifacio的1590年平面及舊殿逐段拆除。所讀為展覽說明，未讀Alfarano全部原稿。
- zh: 意大利参议院，Alfarano平面
  zh-Hant: 義大利參議院，Alfarano平面
- zh: Federica Goffi，2010，博士论文《The Sempiternal Nature of Architectural Conservation and the Unfinished Building and Drawing》；所核为Alfarano与Grimaldi相关摘段及图录，不是Grimaldi手稿或1972年版全文。
  zh-Hant: Federica Goffi，2010，博士論文《The Sempiternal Nature of Architectural Conservation and the Unfinished Building and Drawing》；所核為Alfarano與Grimaldi相關摘段及圖錄，不是Grimaldi手稿或1972年版全文。
- zh: Goffi，2010，图记研究
  zh-Hant: Goffi，2010，圖記研究
- zh: Robert Coates-Stephens，1995，《Building in Early Medieval Rome, 500–1000 AD》，前院铺地和屋顶维修段；相关文字不提供800年完整院落测绘。
  zh-Hant: Robert Coates-Stephens，1995，《Building in Early Medieval Rome, 500–1000 AD》，前院鋪地和屋頂維修段；相關文字不提供800年完整院落測繪。
- zh: Coates-Stephens，早期中世纪营建
  zh-Hant: Coates-Stephens，早期中世紀營建
- zh: 梵蒂冈《Braccio di Carlo Magno》：800年圣诞节在圣彼得加冕；不将后世骑马像放入当时场景。
  zh-Hant: 梵蒂岡《Braccio di Carlo Magno》：800年聖誕節在聖彼得加冕；不將後世騎馬像放入當時場景。
- zh: 梵蒂冈，查理曼加冕
  zh-Hant: 梵蒂岡，查理曼加冕
- zh: Pietro Zander，圣彼得营造处《The Basilica》：1506年奠基及两座大殿共同的彼得墓中心。
  zh-Hant: Pietro Zander，聖彼得營造處《The Basilica》：1506年奠基及兩座大殿共同的彼得墓中心。
- zh: 圣彼得营造处，新殿开工
  zh-Hant: 聖彼得營造處，新殿開工
- zh: 圣彼得营造处《Quando è stata costruita la Basilica di San Pietro?》：新殿1506年开建、1626年完成，替代4世纪旧殿。
  zh-Hant: 聖彼得營造處《Quando è stata costruita la Basilica di San Pietro?》：新殿1506年開建、1626年完成，替代4世紀舊殿。
- zh: 文献和既存平面支持剧场、园廊与议事厅同轴，柱廊紧接舞台背面。本页将影片中偏北且分离的剧场向东约20.6米、向南约33.4米，并绕自身锚点转约1.78度，使舞台背面接近西横廊屋檐。平移量是现有示意模型的展馆校正估值，不是考古测量精度；影片与city.yaml保留原位。
  zh-Hant: 文獻和既存平面支持劇場、園廊與議事廳同軸，柱廊緊接舞臺背面。本頁將影片中偏北且分離的劇場向東約20.6米、向南約33.4米，並繞自身錨點轉約1.78度，使舞臺背面接近西橫廊屋簷。平移量是現有示意模型的展館校正估值，不是考古測量精度；影片與city.yaml保留原位。
- zh: 庞培剧场、柱廊与议事厅
  zh-Hant: 龐培劇場、柱廊與議事廳
- zh: 前55年启用；展示前44年遇刺前的示意形态
  zh-Hant: 前55年啟用；展示前44年遇刺前的示意形態
- zh: 罗马战神广场南部；议事厅遗址今在银塔广场考古区西侧
  zh-Hant: 羅馬戰神廣場南部；議事廳遺址今在銀塔廣場考古區西側
- zh: 一组相连的公共建筑
  zh-Hant: 一組相連的公共建築
- zh: 庞培在前55年启用的建筑群，把剧场、舞台后方的柱廊与露天园庭连在一起。剧场的半圆形观众席朝东；园庭的另一端是庞培议事厅，一座供元老院不时开会的近方形大厅。这里展示的是整组建筑在前44年遇刺以前的示意形态，并非三个互不相干的地点。
  zh-Hant: 龐培在前55年啟用的建築群，把劇場、舞臺後方的柱廊與露天園庭連在一起。劇場的半圓形觀眾席朝東；園庭的另一端是龐培議事廳，一座供元老院不時開會的近方形大廳。這裡展示的是整組建築在前44年遇刺以前的示意形態，並非三個互不相干的地點。
- zh: 凯撒在这里遇刺
  zh-Hant: 凱撒在這裡遇刺
- zh: 前44年3月15日，尤利乌斯·凯撒在庞培议事厅参加元老院会议时被杀。地点是园庭东端的大厅，今天遗址位于银塔广场的B、C两座神庙后方。它不是罗马广场上的尤利乌斯议事堂，也不是剧场的舞台。模型保留遇刺以前的大厅，不加入后来封闭它的构筑物。
  zh-Hant: 前44年3月15日，尤利烏斯·凱撒在龐培議事廳參加元老院會議時被殺。地點是園庭東端的大廳，今天遺址位於銀塔廣場的B、C兩座神廟後方。它不是羅馬廣場上的尤利烏斯議事堂，也不是劇場的舞臺。模型保留遇刺以前的大廳，不加入後來封閉它的構築物。
- zh: 平面有依据，上部仍需推测
  zh-Hant: 平面有依據，上部仍需推測
- zh: 银塔广场的遗构和分期研究支持一座约24×27米的独立议事厅。三世纪的《罗马城大理石平面图》保存了较晚柱廊的部分布局；其图形与文献能帮助辨认建筑关系，却不能直接当成前44年的完整平面。图上长方形区域和点状方块究竟表示园地、水池或柱子，仍有不同解释。剧场舞台、廊柱和大厅的高度、屋顶、门窗与装饰都没有完整留下来。
  zh-Hant: 銀塔廣場的遺構和分期研究支持一座約24×27米的獨立議事廳。三世紀的《羅馬城大理石平面圖》保存了較晚柱廊的部分佈局；其圖形與文獻能幫助辨認建築關係，卻不能直接當成前44年的完整平面。圖上長方形區域和點狀方塊究竟表示園地、水池或柱子，仍有不同解釋。劇場舞臺、廊柱和大廳的高度、屋頂、門窗與裝飾都沒有完整留下來。
- zh: 怎样阅读这座模型
  zh-Hant: 怎樣閱讀這座模型
- zh: 模型以影片的建筑平面与主要尺寸为底稿，用细部模型表现，垂直方向不放大；剧场只在本页调整位置与方向，使它与园廊、议事厅同轴并接近相连。影片中的剧场仍偏北、与柱廊分离，city.yaml和成片不变。这不表示原高已经测定：剧场以约36米、大厅以约14.8米檐高、廊柱以约5.92米作示意。后两项借用维特鲁威所述法诺公共会堂作有限比较，不是庞培建筑的实测值。剧场现有两层外拱廊、阁楼层、分区座席、阶梯和出入口，以及三层柱式、三门的平直舞台立面、舞台台面与两翼；拱券、层高、柱式、门洞和座席细分均为类型估配。看台顶端轴线上有胜利维纳斯神庙的文献依据，但模型的四柱山墙、尺度与外伸基座仍是推测。大厅正面门上三窗借用尤利乌斯议事堂的类型，并非本厅已知立面；柱廊柱式、檐部层次、梁、线脚和瓦面细节也为估值。各段柱廊的小接缝仍是模型近似；剧场的位置校正以同轴相连的有据关系为约束，公尺数不是遗址实测值。所有可见建筑构件因此标为「推测」，具体平面依据另在构件说明中交代。园树、古地坪和室内席位没有逐项复原。
  zh-Hant: 模型以影片的建築平面與主要尺寸為底稿，用細部模型表現，垂直方向不放大；劇場只在本頁調整位置與方向，使它與園廊、議事廳同軸並接近相連。影片中的劇場仍偏北、與柱廊分離，city.yaml和成片不變。這不表示原高已經測定：劇場以約36米、大廳以約14.8米簷高、廊柱以約5.92米作示意。後兩項借用維特魯威所述法諾公共會堂作有限比較，不是龐培建築的實測值。劇場現有兩層外拱廊、閣樓層、分區座席、階梯和出入口，以及三層柱式、三門的平直舞臺立面、舞臺臺面與兩翼；拱券、層高、柱式、門洞和座席細分均為類型估配。看臺頂端軸線上有勝利維納斯神廟的文獻依據，但模型的四柱山牆、尺度與外伸基座仍是推測。大廳正面門上三窗借用尤利烏斯議事堂的類型，並非本廳已知立面；柱廊柱式、簷部層次、梁、線腳和瓦面細節也為估值。各段柱廊的小接縫仍是模型近似；劇場的位置校正以同軸相連的有據關係為約束，公尺數不是遺址實測值。所有可見建築構件因此標為「推測」，具體平面依據另在構件說明中交代。園樹、古地坪和室內席位沒有逐項復原。
- zh: 这里既能看演出，也能在柱廊下走动或避雨。维特鲁威直接以庞培柱廊为例，说明剧场后廊可让观众在突然下雨时暂避，也可准备舞台用具。他还主张露天步行空间安排绿植；这说明一种近时代的公共空间用途，并没有留下前44年逐株树木、逐条园路的清单。在另一端，同一组建筑还容纳了元老院的政治活动。
  zh-Hant: 這裡既能看演出，也能在柱廊下走動或避雨。維特魯威直接以龐培柱廊為例，說明劇場後廊可讓觀眾在突然下雨時暫避，也可準備舞臺用具。他還主張露天步行空間安排綠植；這說明一種近時代的公共空間用途，並沒有留下前44年逐株樹木、逐條園路的清單。在另一端，同一組建築還容納了元老院的政治活動。
- zh: 议事厅与东侧柱廊
  zh-Hant: 議事廳與東側柱廊
- zh: 分期研究支持约24×27米的独立大厅，位于东侧柱廊中央。14.8米檐高、15度双坡顶、1.48米墙厚及4.8×5.92米中央门洞均为比较或通行关系下的推测。正面门上三扇有框高窗参照尤利乌斯议事堂类型：窗宽2.4米、窗台与窗顶距地8.2与12米、窗心距7米，均非本厅实测；墙脚、门框、檐口、山墙线脚和瓦面也是估配。两翼柱廊的5.92米柱高、柱数、柱距、托斯卡纳柱式、梁及覆屋细节亦是估值。门窗后用阴影表示空厅；不复原席位、庞培像或行刺人物，不加入奥古斯都时期的封堵与后加厕所。
  zh-Hant: 分期研究支持約24×27米的獨立大廳，位於東側柱廊中央。14.8米簷高、15度雙坡頂、1.48米牆厚及4.8×5.92米中央門洞均為比較或通行關係下的推測。正面門上三扇有框高窗參照尤利烏斯議事堂類型：窗寬2.4米、窗臺與窗頂距地8.2與12米、窗心距7米，均非本廳實測；牆腳、門框、簷口、山牆線腳和瓦面也是估配。兩翼柱廊的5.92米柱高、柱數、柱距、托斯卡納柱式、梁及覆屋細節亦是估值。門窗後用陰影表示空廳；不復原席位、龐培像或行刺人物，不加入奧古斯都時期的封堵與後加廁所。
- zh: 半圆形剧场、舞台与维纳斯神庙
  zh-Hant: 半圓形劇場、舞臺與維納斯神廟
- zh: 剧场前55年启用、观众席朝东有据。约150米外径是既有古图的近似读数；约36米高、44米乐池尺度、14米舞台深度与48个分段为模型估值，不是共和时期逐项实测。舞台保持平直立面，现有三层科林斯柱式、三门、台面与两翼；层数、柱高、柱距、门洞和覆屋都按剧场类型估配，并非前44年立面的逐项证据。外墙两层拱廊的托斯卡纳与爱奥尼柱式、阁楼窗、座席排数、阶梯及出入口也属估值。文献记胜利维纳斯神庙位于看台顶端；模型以轴线上12×12米、四根科林斯柱和山墙的小神庙表示，柱高7.5米及向外伸出的承托同为推测。庙的存在不证明这套形制；不移植公元80年火灾后的曲折舞台凹室。
  zh-Hant: 劇場前55年啟用、觀眾席朝東有據。約150米外徑是既有古圖的近似讀數；約36米高、44米樂池尺度、14米舞臺深度與48個分段為模型估值，不是共和時期逐項實測。舞臺保持平直立面，現有三層科林斯柱式、三門、檯面與兩翼；層數、柱高、柱距、門洞和覆屋都按劇場類型估配，並非前44年立面的逐項證據。外牆兩層拱廊的托斯卡納與愛奧尼柱式、閣樓窗、座席排數、階梯及出入口也屬估值。文獻記勝利維納斯神廟位於看臺頂端；模型以軸線上12×12米、四根科林斯柱和山牆的小神廟表示，柱高7.5米及向外伸出的承托同為推測。廟的存在不證明這套形制；不移植西元80年火災後的曲折舞臺凹室。
- zh: 北侧柱廊中段
  zh-Hant: 北側柱廊中段
- zh: 柱廊围合园庭的关系有文献与较晚平面依据。这一段69.6米长、18柱、5.92米柱高和屋顶形式承接东廊的估配；各段之间的小缝是模型衔接，不是古代廊界或出入口的证据。托斯卡纳柱式、柱础柱头、檐部层次、梁、线脚和瓦面细节也由类型估配。
  zh-Hant: 柱廊圍合園庭的關係有文獻與較晚平面依據。這一段69.6米長、18柱、5.92米柱高和屋頂形式承接東廊的估配；各段之間的小縫是模型銜接，不是古代廊界或出入口的證據。托斯卡納柱式、柱礎柱頭、簷部層次、梁、線腳和瓦面細節也由類型估配。
- zh: 南侧柱廊中段与侧向通口
  zh-Hant: 南側柱廊中段與側向通口
- zh: 这一段的长度、18柱、柱高、覆屋和侧向通口均为有界估配。中央4.8米门湾用来示意城街、柱廊与园庭的通行关系，并非已发掘的前44年侧门。托斯卡纳柱式、柱础柱头、檐梁、线脚和瓦面细节亦为类型估配。南侧商住街坊不在本页模型内。
  zh-Hant: 這一段的長度、18柱、柱高、覆屋和側向通口均為有界估配。中央4.8米門灣用來示意城街、柱廊與園庭的通行關係，並非已發掘的前44年側門。托斯卡納柱式、柱礎柱頭、簷梁、線腳和瓦面細節亦為類型估配。南側商住街坊不在本頁模型內。
- zh: 北侧柱廊西段
  zh-Hant: 北側柱廊西段
- zh: 西延段保留现有模型的72.8米长度、20柱、5.92米柱高及低坡覆屋。这些是以公共建筑关系为约束的示意尺寸；托斯卡纳柱式、柱础柱头、檐梁、线脚和瓦面细节也为估配。不能把三世纪大理石平面的全部凹室、园池或百柱廊倒放到前44年。
  zh-Hant: 西延段保留現有模型的72.8米長度、20柱、5.92米柱高及低坡覆屋。這些是以公共建築關係為約束的示意尺寸；托斯卡納柱式、柱礎柱頭、簷梁、線腳和瓦面細節也為估配。不能把三世紀大理石平面的全部凹室、園池或百柱廊倒放到前44年。
- zh: 南侧柱廊西段
  zh-Hant: 南側柱廊西段
- zh: 72.8米长、20柱、柱距、墙厚与屋面都是延续既有比较值的估配。托斯卡纳柱式、柱础柱头、檐梁、线脚和瓦面细节同为类型估配。它表示园庭南侧的覆顶步行空间，并没有逐间重建较晚平面记录的商铺，也不证明本段在前44年的每个细节。
  zh-Hant: 72.8米長、20柱、柱距、牆厚與屋面都是延續既有比較值的估配。托斯卡納柱式、柱礎柱頭、簷梁、線腳和瓦面細節同為類型估配。它表示園庭南側的覆頂步行空間，並沒有逐間重建較晚平面記錄的商鋪，也不證明本段在前44年的每個細節。
- zh: 剧场后方横向柱廊
  zh-Hant: 劇場後方橫向柱廊
- zh: 剧场后方有柱廊的用途有维特鲁威记载；此处135米长、35柱及具体位置是模型的近似衔接；托斯卡纳柱式、柱础柱头、檐梁、线脚和瓦面细节亦为估配。文献与既存平面支持柱廊紧接舞台背面；本页据此把剧场移到园廊与议事厅的共同轴线上，舞台背面接近横廊屋檐，保留约0.2米的墙面至廊地坪余量。校正量由既有模型形体估配，不能当成古代街宽或发掘坐标；影片仍保留原来的错位与空隙。
  zh-Hant: 劇場後方有柱廊的用途有維特魯威記載；此處135米長、35柱及具體位置是模型的近似銜接；托斯卡納柱式、柱礎柱頭、簷梁、線腳和瓦面細節亦為估配。文獻與既存平面支持柱廊緊接舞臺背面；本頁據此把劇場移到園廊與議事廳的共同軸線上，舞臺背面接近橫廊屋簷，保留約0.2米的牆面至廊地坪餘量。校正量由既有模型形體估配，不能當成古代街寬或發掘座標；影片仍保留原來的錯位與空隙。
