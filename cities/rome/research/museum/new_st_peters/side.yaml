place: New St Peter's Basilica in the Vatican, Rome, its great dome, western core, transverse arms and eastern nave
when: AD 1626, a finished basilica before Bernini's colonnade, a clear mild day with soft daylight
picture: |
  Preserve every mass, roof, opening, height and camera of the attached model. The observer is southwest of the church, looking northeast across its western apse and transverse body toward the main dome and long eastern nave. This is the complete exterior of 1626, not the 1564 open-drum construction site.
  Show warm pale travertine and restrained plaster or masonry on the walls. Preserve the detailed giant pilasters, layered entablatures and attic bands, framed windows with triangular or segmental pediments, clerestory windows and roof steps on the body and apse. Their spacing, profiles and smaller dimensions are model estimates after the standing building, not individually verified details of 1626. Do not smooth these details back into plain blocks or invent measured room layouts.
  The main dome has muted lead-grey covering and pale stone ribs. Preserve all sixteen main ribs, three rows of pedimented dormers, drum buttresses, paired columns, framed drum windows, stepped cornices, and the windowed lantern with its paired columns. The small gilded ball and cross are already present. Retain the two smaller domes, their base pilasters and windows, drum windows, ribs and lanterns, without changing their estimated forms or adding further domes. Where the eastern façade is visible, keep its niches, window frames, balconies and turned balustrades exactly as attached, with no statues, clocks or heraldry added.
  Ground on the western and southern side belongs to the Vatican precinct: compact earth, worn paths, restrained low vegetation and enclosure masonry toward the margins. The distant western hills are garden and cultivated ground, not dense forest, a modern patterned garden or uninhabited desert. Exact garden paths and individual buildings are not surveyed here; do not fabricate named chapels, a monumental new palace or an elaborate measured enclosure attached to the model.
  Northeast and east, beyond the long nave where the actual view leaves a gap, use only a distant, low-information band of the existing papal complex and Borgo's compact tiled roofs. These are the inhabited setting, not a modern straight ceremonial avenue. Keep north-side palace masses geographically north; do not wrap them around the western apse or obscure the core church. If the forecourt is visible beyond the eastern front, it remains a walking and ceremonial space without Bernini's curved colonnade.
  A few very small seventeenth-century walkers may use a path. Materials, dress and unsurveyed ground texture are acknowledged interpretation. The ground runs continuously beyond the frame; the faded museum stand is not a raised plateau, island, excavation pit or moat.
avoid: unmodelled rooftop statuary, Bernini colonnade, modern oval piazza, Via della Conciliazione, later façade clocks or high bell tower, incomplete main dome, scaffolding, construction workers on the drum, old basilica remains inside the completed nave, modern Vatican garden patterns, invented named adjoining buildings, dense forest, deserted blank landscape, water, cliffs, slab edges, modern clothing, vehicles, electric light, text, signs, watermark
sources:
