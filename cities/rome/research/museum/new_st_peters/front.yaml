place: New St Peter's Basilica in the Vatican, Rome, the completed church alone with Maderno's broad eastern façade and the great ribbed dome behind it
when: AD 1626, the basilica completed, before Bernini's colonnade, a clear mild day with soft daylight
picture: |
  Keep the attached church's exact geometry, camera, framing, giant-column positions, openings, roof levels and dome silhouette. The observer is east of the church, looking west and slightly down at Maderno's broad façade, with the main dome behind it. The church is complete and in use, not a construction site.
  Give the façade and exposed monumental stone members warm pale travertine, lightly weathered and clearly articulated. Preserve the central moulded pediment, eight giant round columns with bases and stylised capitals, end pilasters, lintelled portals, arched upper openings, recessed central Loggia, niche recesses, end passages, framed and pedimented windows, layered cornices, and turned balustrades on balconies and the attic. Keep every attached opening and baluster in place. Most smaller dimensions and profiles are estimates after the standing building, not individually verified details of 1626. Rooftop statues existed by 1626, but are omitted from the model: do not add named figures, heraldry, reliefs, inscriptions or modern clocks.
  Give the great dome a subdued lead-grey covering with lighter stone ribs, a pale stone drum and lantern, and the small gilded ball and cross at the top. Preserve all sixteen main ribs, three rows of pedimented dormers, paired drum and lantern columns, drum buttresses and framed windows, stepped cornices and the lantern's arched windows. Keep the two smaller domes with their modelled base windows, pilasters, drum windows, ribs and lanterns. These smaller forms and positions are estimated: render them exactly as attached, without enlarging the shell, inventing additional detail or copying a modern postcard.
  The ground before the church is a used ceremonial approach and walking space with worn stone and dusty joints, not rural emptiness or a lake. There is no oval colonnade in 1626. Do not fill the blank stand with the later symmetrical Bernini square, paired fountains, a modern broad avenue or a second invented obelisk. Historic monuments outside the camera frame remain outside it.
  To the church's north, place a restrained distant suggestion of the already existing papal complex, without pretending to reconstruct every measured palace wing. Beyond the western church end are the Vatican's low hills and garden land: subdued vegetation, enclosure masonry and continuous ground. Borgo lies east, largely behind this eastward observer; do not paste its dense streets behind the western apse. Avoid exact modern garden beds. A few tiny pilgrims in modest seventeenth-century dress cross the approach, giving scale; their dress and unmeasured surfaces are interpretation.
avoid: unmodelled rooftop statuary, Bernini's 1656–1667 colonnade, oval modern square, Via della Conciliazione, later façade clocks, Bernini's later tall bell tower, complete modern statue program, construction scaffolding, cranes, a half-built dome, old St Peter's standing intact beside the completed nave, twentieth-century roads, modern tourists or barriers, arbitrary paired fountains, duplicate obelisk, Borgo behind the western apse, formal modern Vatican gardens, water, moat, cliffs, elevated slab, stand edges, modern objects, text, signs, watermark
