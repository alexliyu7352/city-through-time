place: New St Peter's Basilica in the Vatican, Rome, seen across its western apse and the northern side of its dome and transept
when: AD 1626, the completed church before the colonnade was commissioned, a clear mild day with soft daylight
picture: |
  Keep exactly the attached viewpoint, frame, all building outlines and relative heights. The observer is northwest of the church, looking southeast over the western end toward its high dome, transverse arms and the long nave running east. Do not turn this rear view into the familiar eastern façade postcard.
  Render the monumental masonry in warm pale stone and subdued plaster, and the dome in weathered lead grey with lighter ribs. The drum and lantern's paired-column rhythm and small gilded ball and cross remain where the model puts them. Roof planes and small windows are the model's schematic forms; no newly invented measured room layout or ornament. The finished church has no construction scaffolding.
  The near western ground is part of the Vatican's enclosed, used precinct adjoining hill and garden land: compact paths, muted low vegetation and a little enclosure masonry near the margins. Keep its precise garden design unresolved, rather than copying today's formal beds or making the church float alone in a vacant field.
  The papal complex lies north and northeast of the church and may be suggested only in the appropriate edge of this view, never as a new palace directly behind the western apse. Farther east, beyond the long nave, faint compact tiled roofs can indicate Borgo where visible. They do not form a modern straight boulevard. The eastern forecourt and its monuments are mostly on the far side; do not move an obelisk or fountain behind the apse to make it visible, and do not add the later oval colonnade.
  A few very small pilgrims or attendants in modest seventeenth-century clothing may stand on an existing ground path. Their dress, stone weathering and unsurveyed surroundings remain interpretation. Ground and distant sky extend naturally beyond the model stand, without a cliff, lake, island or square platform edge.
avoid: eastern front substituted for the rear camera, Bernini's colonnade, modern square, Via della Conciliazione, an obelisk or fountain behind the apse, later tall bell tower, later façade clocks, copied modern Vatican gardens, a half-built dome, cranes, scaffolding, old basilica remnants attached to the finished nave, invented measured palace compound, lake, water, cliffs, exposed plinth, floating church, modern people or objects, text, signs, watermark
sources:
  - sources.md — northwest view and geographical separation of west garden land, north papal complex and east Borgo
  - museum/new_st_peters.yaml V1 to V4 — building, completed dome, finial and Maderno chronology; decorative omissions remain acknowledged
  - museum/new_st_peters.yaml V5 and V6 — no colonnade in 1626; earlier papal buildings already present
  - museum/new_st_peters.yaml F1 and A1 — later topographical images used as bounded formal comparisons, not complete 1626 documentation
