place: Old St Peter's Basilica on the Vatican, Rome, its western apse and transverse hall, high nave and lower aisles, and three low walks of the eastern forecourt
when: around AD 800, the old basilica in regular use, a quiet clear day with soft daylight
picture: |
  Preserve every model roof, wall, opening, height, position, camera and frame, including all three low forecourt walks. The observer is northwest of the group, looking southeast across the semicircular western apse and transept toward the long nave and the eastern court beyond it. Keep the apse's half-round shape and simplified roof exactly as the model draws them.
  Turn white surfaces into weathered brick masonry and restrained pale plaster, with muted reddish clay roof tiles. No unsupported glittering dome, fresco reconstruction or ornamental replacement roof. This is a maintained church in use around 800, without scaffolding or demolition.
  The immediate ground is part of a church and funerary precinct on the Vatican slope, not a deserted blank field. Use compact earth, worn footpaths and a little rough vegetation, with low indistinct masonry toward the margins. Associated burial buildings existed around the church, but their precise 800 appearance is not reconstructed here: do not fabricate a named mausoleum attached to the apse, a new palace or an elaborate measured compound.
  Beyond the long nave, the eastward approach and forecourt connect toward Rome. Keep the three existing walks on that far eastern side, with weathered pale masonry and muted top surfaces inside their exact model silhouettes. They are not an arcaded plaza wrapped around the western apse. Their dimensions and regular bays are estimates. Do not add another walk, new columns, roofs, a porch or doors to the omitted entrance. Use worn pale paving inside the court. Only low-information ground and a faint distant inhabited horizon should appear beyond it; no later Borgo street pattern, modern broad road or Renaissance palace skyline.
  Add a few very small pilgrims or attendants on an existing path. Dress and unsurveyed surface detail are acknowledged interpretation. The land continues naturally past every edge; the museum stand is not an elevated platform, island, moat or cliff.
avoid: new St Peter's, a great Renaissance dome, Bernini's colonnade, modern Vatican skyline, a courtyard wrapped around the western apse, a new named mausoleum or chapel, a fourth courtyard walk or extra bays, new roofs or entrance doors, medieval bell tower, Leonine walls of 848–852, broad straight modern avenue, modern city blocks, cranes, demolition rubble, archaeological trenches, formal lawns, water, cliffs, plate edges, floating building, close-up faces, text, signs, watermark
sources:
  - sources.md — northwest viewpoint of the 800 core plus existing three-walk forecourt; adjoining-building omissions are disclosed, not evidence of an empty precinct
  - museum/old_st_peters.yaml G1 and D1 — western apse, transverse hall, nave and funerary function; exact roof and surface details remain estimates
  - museum/old_st_peters.yaml M1 — maintenance and forecourt use before 800, without a measured enclosure plan
  - museum/old_st_peters.yaml V1 and A1 — historical setting and later transformations; the 1590 overlay is not the precinct state in 800
