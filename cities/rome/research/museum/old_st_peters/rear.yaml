  - museum/old_st_peters.yaml G1 and D1 — western apse, transept, nave and funerary function; roof, windows, stepped aisles and surface details remain estimates
  - museum/old_st_peters.yaml V1 and M1 — forecourt and maintenance before 800, without a measured enclosure or detailed column plan
  - museum/old_st_peters.yaml V1 and A1 — historical setting and later transformations; the 1590 overlay is not the precinct state in 800
