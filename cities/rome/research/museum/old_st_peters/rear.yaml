place: Old St Peter's Basilica on the Vatican, Rome, its western apse and transverse hall, tall nave and stepped double aisles, and four roofed colonnades of the eastern forecourt
when: around AD 800, the old basilica in regular use, a quiet clear day with soft daylight
picture: |
  Preserve every detailed-model roof, wall, opening, column, height, position, camera and frame, including all four forecourt walks. The observer is northwest of the group, looking southeast across the semicircular western apse and transept toward the long nave and eastern court beyond it. Keep the apse's half-round wall, plinth, cornice and half-conical tiled roof exactly as drawn.
  Turn white surfaces into weathered brick masonry and restrained pale plaster, with muted reddish clay roof tiles. Preserve the exposed transept's framed arched windows, the nave clerestory and outer-aisle windows, and the higher inner and lower outer lean-to roofs on each side. Roof curves, windows and moulding profiles remain model estimates, rather than newly measured historical detail. This is a maintained church in use around 800, with no glittering dome, replacement roof, scaffolding or demolition.
  The immediate ground is a church and funerary precinct on the Vatican slope. Use compact earth, worn footpaths, a little rough vegetation and low indistinct masonry toward the margins. Associated burial buildings existed, but their precise 800 appearance is not reconstructed here: do not fabricate a named mausoleum attached to the apse, a palace or an elaborate measured compound.
  Beyond the nave, preserve the four colonnades of the eastern forecourt wherever visible, with their beams, inward-sloping tile roofs, outer walls and low floor steps. The fourth walk lies against the basilica's eastern front, and the arched courtyard gate is opposite it; do not wrap the court around the western apse. The church's five front doorways stay on their actual side and may be hidden in this rear view. Do not move them to a visible wall or add another walk, porch, tower, columns or doorways. Use weathered pale masonry, muted red tiles and worn paving inside the court; exact dimensions, capitals and surface texture remain interpretation.
  Only low-information continuous land and a faint distant inhabited horizon should appear beyond the eastward approach; no later Borgo grid, modern broad road or Renaissance palace skyline. Add a few very small pilgrims or attendants on an existing path. Dress and unsurveyed surface detail are acknowledged interpretation. Ground runs beyond every edge without a platform, island, moat or cliff.
avoid: new St Peter's, a great Renaissance dome, Bernini's colonnade, modern Vatican skyline, a courtyard wrapped around the western apse, a new named mausoleum or chapel, a fifth courtyard walk, changed bays or roofs, missing fourth walk, entrance doors relocated to the apse or transept, extra porch or tower, Leonine walls of 848–852, broad straight modern avenue, modern city blocks, cranes, demolition rubble, archaeological trenches, formal lawns, water, cliffs, plate edges, floating building, close-up faces, text, signs, watermark
sources:
