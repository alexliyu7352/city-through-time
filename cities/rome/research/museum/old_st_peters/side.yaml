place: Old St Peter's Basilica on the Vatican, Rome, the five-aisled core with western transept and apse, and four roofed colonnades around its eastern forecourt
when: around AD 800, an established pilgrimage church on a clear mild day with soft daylight
picture: |
  Keep the detailed model's exact camera, footprint, heights, openings, columns and silhouette, including all four forecourt walks. The observer is southwest of the group, looking northeast across the lower aisles toward the higher nave and projecting western transept, with the court beyond the eastern front. Show the finished tiled roofs, not a rebuilding site. Do not restore omitted adjoining buildings as if their plans had been measured.
  Use subdued brick-red masonry, patches of weathered pale plaster and muted clay roof tiles. The tall nave, higher inner aisle, lower outer aisle and transverse hall must remain separately readable. Preserve the framed round-headed clerestory and outer-aisle windows, exposed transept windows, cornices, plinths and gable mouldings. Keep the five front doorways and upper front windows wherever actually visible. These dimensions and profiles are estimates: apply materials to the attached detail, without changing window sizes or adding a new decorative façade.
  Ground beside the basilica belongs to a used church precinct with paths and a funerary history. Give it compacted earth, narrow worn walking surfaces and low-information traces of masonry close to frame edges. Burials and adjoining religious buildings are part of this setting, but their exact 800 forms are unresolved: do not invent named mausoleums or churches against the model, an empty ornamental lawn, a uniform forest or an excavated archaeological park.
  Preserve the eastern forecourt's four colonnades, their beams, estimated capitals and inward-sloping tiled roofs. The fourth walk meets the church front without a separate back wall; the opposite outer wall contains the model's arched gate. Preserve the bay positions, eaves, corner joints and low floor steps. Use worn pale paving inside the court and let the outer approach continue beyond the frame. Do not add a fifth walk, tower, entrance pavilion, external stairs or extra doorways.
  Keep a modest distant horizon of the Vatican precinct with sparse indistinct masonry and trees, without later palace complexes or Renaissance Borgo blocks. A few tiny walkers in simple long garments may use a side path. Materials, dress and unsurveyed ground are interpretation. Land continues beyond the image, with no stand edge or cliff.
avoid: new St Peter's dome, Baroque façade, Bernini colonnade, Via della Conciliazione, Vatican palace wings of the twelfth century or later, Leonine walls built after 800, precise invented chapel or mausoleum façades, a fifth forecourt walk, extra columns or bays, changed roofs, missing fourth walk, added entrance pavilion or doorways, medieval tower, building works, rubble, modern excavations, ornamental lawn, dense forest, water, cliffs, floating slab, model base, close-up people, modern objects, text, signs, watermark
sources:
