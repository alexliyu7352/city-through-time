place: Old St Peter's Basilica on the Vatican, Rome, the five-aisled core with western transept and apse, and its three low eastern forecourt walks
when: around AD 800, an established pilgrimage church on a clear mild day with soft daylight
picture: |
  Keep the model's exact camera, footprint, heights and silhouette, including all three forecourt walks. The observer is southwest of the group, looking northeast across the lower aisles toward the higher nave and projecting western transept, with the court extending beyond the eastern front. Show the finished tiled roofs, not a rebuilding site. Do not restore structures omitted from the model as if their plans had been measured.
  Use subdued brick-red masonry, patches of weathered pale plaster and muted clay roof tiles. The high nave, stepped aisle roofs and the transverse hall must remain separately readable. The tiny model openings are schematic: keep their places and do not add a new decorative façade or a row of oversized modern windows.
  Ground beside the basilica belongs to a used church precinct with paths and a funerary history. Give it compacted earth, narrow worn walking surfaces and small, low-information traces of masonry close to the frame edges; do not fill it with a generic empty lawn, a uniform forest, water or an excavated archaeological park. Burials and adjoining religious buildings are historically part of this setting, but their exact 800 forms are unresolved here: do not invent named mausoleums or churches against the model.
  The entrance and its forecourt lie east of the long nave, toward the far side of this view. Keep the three existing low, flat-topped walks in their exact places, with weathered pale masonry and subdued top surfaces, preserving every opening and the simple roof silhouette. Their dimensions and bay pattern are estimates. Inside the court use worn pale paving; the outer approach continues beyond the frame. Do not add a fourth walk, a tower, an elaborate porch, steps or doors to the model's blank basilica front.
  Farther away, keep a modest low horizon of the Vatican precinct with sparse indistinct masonry and trees. No later Vatican palace complex or Renaissance Borgo blocks. A few tiny walkers in simple long garments may use the side path. Materials, dress and unsurveyed ground are interpretation. Continuous land runs beyond the image, with no stand edge or cliff.
avoid: new St Peter's dome, Baroque façade, Bernini colonnade, Via della Conciliazione, Vatican palace wings of the twelfth century or later, Leonine walls built after 800, precise invented chapel or mausoleum façades, a fourth forecourt walk, extra arcade bays, new roofs, porch or entrance doors, medieval tower added to the core, building works, rubble, modern excavations, ornamental lawn, dense forest, water, cliffs, floating slab, model base, close-up people, modern objects, text, signs, watermark
sources:
  - sources.md — canonical 800 core plus existing forecourt landmark, original positions and geometry retained; adjoining structures and entrance detail remain incomplete
  - museum/old_st_peters.yaml G1 and D1 — five-aisled core, western transverse hall, apse, brick fabric and burial setting; model roof detail estimated
  - museum/old_st_peters.yaml M1 — early medieval maintenance and paved forecourt; no complete measured 800 precinct plan
  - museum/old_st_peters.yaml V1 — medieval palace chronology prevents its later complex appearing in 800
