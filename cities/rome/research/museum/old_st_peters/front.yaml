# tools/living.py old_st_peters/front; sources.md records evidence and model estimates.
place: Old St Peter's Basilica on the Vatican, Rome, its tall nave and four aisles, western transept and apse, and four roofed colonnades around the eastern forecourt
when: around AD 800, the old basilica in established use, a clear mild day with soft daylight
picture: |
  Preserve the attached detailed model, every silhouette, opening, roof line, column, position and exact camera. The observer is southeast of the group, looking northwest and slightly down across the forecourt toward the high nave and lower aisle roofs. This is a finished building in use, not a construction site.
  Give its masonry subdued red-brown brick and weathered pale plaster, with muted reddish clay-tile roofs. Preserve both lean-to roofs on each side: the inner aisle is higher than the outer aisle, and the tall nave rises above both. Retain the model's framed round-headed clerestory and outer-aisle windows, transept windows, five lintelled front doorways, upper front windows, plinths and cornices. Opening sizes, positions, frames, roof slopes and smaller mouldings are estimated; render their attached geometry without inventing a more elaborate measured façade, mosaic or monumental portal.
  Keep all four forecourt colonnades, including the fourth walk against the church front without its own back wall, and the arched gate in the opposite outer wall. The columns carry beams and lean-to tiled roofs sloping toward the court. Preserve their exact bays, capitals, eaves, corners, low floor steps and continuous connection to the church. Use restrained weathered pale masonry and muted red tiles, with worn pale stone paving and dusty joints inside the court. Court dimensions, column details, roof profiles and paving texture remain interpretation. Do not add an extra walk, entrance pavilion, external stairway, fountain or bell tower.
  Outside the court the approach continues beyond the frame, not a vast empty plaza or isolated lawn. Beyond the western church end lie the Vatican's rising ground and the burial and religious setting around the basilica. Use a restrained distant band of earth, low vegetation and indistinct existing masonry, without inventing a named palace or chapel. Do not place a later Borgo street grid behind the western apse. Ground continues naturally, with no cliff, floating slab or exposed square model plinth.
  A handful of pilgrims and attendants in simple long garments, tiny in the frame, indicate scale. Their dress and unsurveyed ground detail are acknowledged interpretation. No coronation procession is reconstructed.
avoid: new St Peter's dome, Renaissance or Baroque façades, Bernini's colonnade, a modern square, Via della Conciliazione, later Vatican palace wings, Leonine walls of 848–852 in a scene of 800, a medieval bell tower, an additional courtyard walk, new entrance pavilion or portals, extra columns or changed bays, altered roofs or missing fourth walk, construction cranes, scaffolding, rubble demolition, people standing on roof edges, planted formal gardens, a lake, cliffs, an island, model stand edges, modern clothing, vehicles, electric lights, text, signs, watermark
sources:
  - sources.md — the 800 core and detailed four-sided forecourt occupy the film landmarks' canonical positions; attached geometry governs the image
  - museum/old_st_peters.yaml G1 and D1 — five aisles, transept, western apse and brick construction; stepped aisle elevations, door and window forms, frames and roof details remain model estimates
  - museum/old_st_peters.yaml V1 and M1 — forecourt and covered walks, paving and maintenance before 800; exact court dimensions, column forms and roof slopes are estimated
  - museum/old_st_peters.yaml V1 and D1 — pilgrimage and burial setting outside Rome's walls, without later palaces or defensive walls
  - museum/old_st_peters.yaml A1 and H1 — later records support study of the lost core, not every later addition in 800
