# tools/living.py old_st_peters/front; sources.md records what was actually read and what is omitted.
place: Old St Peter's Basilica on the Vatican, Rome, its tall nave and four aisles, western transept and apse, with three low schematic covered walks around the eastern forecourt
when: around AD 800, the old basilica in established use, a clear mild day with soft daylight
picture: |
  Preserve the attached core building and three existing forecourt walks, every silhouette, opening, roof line, position and exact camera. The observer is southeast of the group, looking northwest and slightly down across the forecourt toward the high nave and lower aisle roofs. This is a finished building in use, not a construction site.
  Give its masonry the subdued red-brown and weathered pale plaster of a brick-built church, with muted reddish clay-tile roofs. Retain the model's schematic windows, broad roof planes and simple eastern front. Its entrance doors are omitted: do not add a doorway, decorative façade, mosaic or monumental portal to the blank wall. The image remains a material interpretation of a schematic model, not a completed measured elevation.
  The foreground is the approach and paved forecourt of a pilgrimage church. Keep all three attached low walks and their regular flat-topped openings. Use restrained weathered pale masonry and subdued top surfaces, preserving their exact simple silhouette; do not give them newly invented pitched roofs or extra columns. The dimensions and bay pattern are estimated. Do not add a fourth walk, an elaborate entrance porch, steps or a bell tower. Within the court use worn pale stone paving, dusty joints and a few small walkers. Outside it the approach continues beyond the frame, not a vast empty plaza or isolated lawn.
  Beyond the western church end lie the Vatican's rising ground and the burial and religious setting around the basilica. Use only a restrained, distant band of earth, low vegetation and indistinct existing masonry, with no invented identifiable palace. This view must not paste the later Borgo street grid behind the western apse. The ground is continuous; there is no cliff, floating slab or exposed square model plinth.
  A handful of pilgrims and attendants in simple long garments, tiny in the frame, indicate scale. Their dress, exact paving texture and ground detail are acknowledged interpretation. No coronation procession is reconstructed.
avoid: new St Peter's dome, Renaissance or Baroque façades, Bernini's colonnade, a modern square, Via della Conciliazione, seventeenth-century Vatican palace wings, Leonine walls of 848–852 in a scene of 800, a medieval bell tower, a fourth courtyard walk, new porch or doors added to the blank basilica front, extra columns or new roofs on the three existing walks, construction cranes, scaffolding, rubble demolition, people standing on roof edges, planted formal gardens, a lake, cliffs, an island, model stand edges, modern clothing, vehicles, electric lights, text, signs, watermark
sources:
  - sources.md — the 800 core and existing separate three-walk forecourt are shown at their canonical positions; adjoining chapels and detailed entrance are incomplete
  - museum/old_st_peters.yaml G1 and D1 — documented five aisles, transept, western apse and brick construction; roof slopes and precise elevations remain estimated
  - museum/old_st_peters.yaml M1 and part atrium — paved atrium before 800 and maintenance of the old church; court dimensions, height and regular bays are schematic estimates
  - museum/old_st_peters.yaml V1 and D1 — pilgrimage and burial setting outside Rome's walls; scene does not import later palaces or defensive walls
  - museum/old_st_peters.yaml A1 and H1 — later drawings are evidence for the lost core, not permission to move every later addition into 800
