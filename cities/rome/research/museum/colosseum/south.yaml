# museum colosseum/south; detailed amphitheatre, sources and temporal limits: sources.md.
place: The Colosseum in Rome's urban valley, isolated as a museum study of its Flavian architectural form
when: An illustrative view associated with the inauguration in 80 CE under Titus; the model's complete upper arrangement is an acknowledged reconstruction, not proof that every part was finished then
picture: |
  Keep exactly the reference camera, lens, framing, oval outline and height. This view is from the south, azimuth 0 degrees and elevation 22 degrees, aimed 22 m above the centre. Do not turn it into a street-level photograph.
  Follow the detailed reference geometry: three levels of round arches, their engaged columns and entablatures, the second ring of arches and recessed corridor vaults. Keep every opening, spring, moulding and parapet in its modelled position. The ascending Tuscan, Ionic and Corinthian order types are documented; the model's capital profiles and most dimensions are approximate. Do not replace them with a different architectural reconstruction.
  The reference already includes the solid attic, alternate-bay windows, pilasters, corbels and mast sockets. Preserve them exactly. The model also includes a roof over the upper seating colonnade; preserve any portion visible from this camera. Its form and the attic's opening-period completion are uncertain. Do not add masts, ropes, awning fabric, shields, statues or projecting axial entrance porches.
  Give the exterior warm pale travertine and the visible seating a pale stone or marble appearance. Material families are sourced; exact block joints, weathering, colours and roof finish are estimated. Keep the arena a continuous level surface of dry sand over a covered timber floor, at the reference's existing height and outline. No uncovered pit or exposed machinery.
  A handful of very small spectators in simple tunics may approach near the foot of the building. Positions, clothing colours and quiet arrival are illustrative estimates, not a recorded event. Keep them small in proportion to the elevated view.
  Continue level ground beyond the stand to the horizon without a hard platform edge. Restrained paving, dust and distant urban-valley haze are estimates, not an archaeological pavement or city plan. Avoid identifiable invented monuments. Use bright neutral daylight, soft shadows and a sharp building throughout.
avoid: >-
  Changing camera, zoom, crop, silhouette, arch or window outlines, upper colonnade roof, seating or arena geometry; treating the detailed arches as rectangular placeholders; adding sculpture, clipei, awning masts, rigging, velarium, axial porches or an arena roof; exposed later masonry hypogeum, corridors, lifts, traps or water spectacles; the Arch of Titus, Ludus Magnus, Domus Flavia, Venus and Roma temple, Arch of Constantine or Meta Sudans; later ruins, churches, modern roads, cars, railings or tourists; dense forest or open farmland; a cliff or raised plinth; dramatic darkness, shallow focus, combat, blood, readable inscriptions, labels or text.
sources:
  - "S06, KCL Art of Making: inauguration, materials and the three exterior order types; S86, Roma Capitale: seating and sand-covered timber arena."
  - "M01, Colagrossi 1913 p. 42: the model's storey heights and 4.3 m arch widths describe the monument, without proving all details for 80 CE. Springs and pedestals remain DEFAULT estimates."
  - "E07, official archaeological park history: opening-period timber technical spaces, later permanent masonry under Domitian."
  - "E09, Elkins 2006 p. 212: contemporary coin imagery of completed upper levels is not proof of completion; S86V pp. 3, 9, 22: awning uncertainty and mast evidence."
  - "research/museum/colosseum/sources.md: exact detailed model parts, remaining DEFAULT estimates and the four omitted additions. Scene surfaces, figures, lighting and distant setting are estimated."
