# museum colosseum/south; source receipt and model limits: sources.md.
place: The Colosseum, the Flavian amphitheatre in the valley between the Palatine, Esquiline and Caelian hills in Rome; an isolated museum reconstruction of the canonical oval ring
when: The inauguration period in 80 CE under Titus, shown schematically; clear daylight is an illustrative lighting choice, not a documented hour of the opening
picture: |
  Keep exactly the reference camera, lens, framing, oval outline, height, every seating band and all three rows of rectangular dark opening marks. This view is from the south, at azimuth 0 degrees and elevation 22 degrees, aimed 22 m above the building centre. Do not turn it into a street-level photograph.
  Give the exterior a warm pale travertine surface, with restrained block joints and soft shadow. Travertine is sourced; exact block courses, weathering and surface tone are estimated. The white model is not the historical material colour.
  Preserve the simplified geometry. The rectangular opening marks must stay exactly within their existing outlines: do not silently replace them with a different facade of real arches, add a fourth storey, add columns or complete missing sculpture. Architectural detail not present in the model remains omitted. The plain upper rim is a schematic edge, not a claim that the whole final attic was finished in 80 CE.
  Where visible inside, the stepped seating has a pale stone or marble appearance and the central arena is a continuous level surface of sand over a covered timber floor. Sand and timber are sourced; their exact colour and finish are estimated. No uncovered pit, excavated corridors or exposed machinery. Keep the opening at its modelled size, including its documented 3 m length approximation.
  A few very small approaching spectators in simple tunics may give scale near the foot of the building. Their positions, clothing colours and this quiet arrival are illustrative estimates, not a recorded event or a census. Do not enlarge people to compensate for the elevated camera.
  The surrounding level ground runs continuously to the horizon without a platform edge. Its understated pale paving and dust are estimated, not an excavated paving plan. Keep a quiet, hazy suggestion of an urban valley in the distance, without identifiable invented monuments; this is an isolated building study, not a complete panorama or empty countryside. Use bright neutral daylight and keep the whole building sharp.
avoid: >-
  Changing the camera, zoom, crop, silhouette, opening outlines or seating profile; a separately completed attic or shield frieze; a dome, rigid roof, velarium fabric, awning masts or ropes; invented sculpture or readable inscriptions; the exposed later masonry hypogeum, underground corridors, lifts or traps; water spectacles; the Arch of Titus, Ludus Magnus, Domus Flavia, the Temple of Venus and Roma, the Arch of Constantine, Meta Sudans, churches, medieval ruins, modern retaining walls, roads, cars, railings or tourists; dense forests or open farmland; a cliff or raised model plinth; dramatic darkness, depth of field, blood or spectacle violence; signs or text.
sources:
  - "FACTS.md S06; King's College London, Art of Making, Colosseum: inauguration in 80 CE, capacity and travertine exterior. Exact superficial finish and the illustrative spectators are estimated."
  - "FACTS.md S86; Roma Capitale, L'Anfiteatro Flavio (Colosseo): oval dimensions, marble-faced seating, sand over a timber arena floor. Its general monument description is not an 80 CE completion survey."
  - "D'Anna and Molari, Il velarium del Colosseo, p. 22: three rows of 80 bays with an attic above; its awning hypothesis is not adopted."
  - "research/imperial03_events_sources.json E07; archived official I sotterranei del Colosseo: timber technical structures at opening, permanent masonry under Domitian."
  - "research/imperial03_events_sources.json E08; Taylor et al. 2016, p. 26 note 29: later completion of attic; the underlying ancient chronicle was not separately read."
  - "research/museum/colosseum/sources.md: canonical model limits, exact part assignment and camera projection; all scene additions and unmodelled roof/sculpture detail are estimated or omitted."
