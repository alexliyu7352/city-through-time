# museum colosseum/northwest; match the detailed amphitheatre, with its stated chronological limits.
place: The Colosseum in Rome, an isolated museum study on level ground within its urban valley
when: An illustrative view associated with the inauguration in 80 CE; upper-storey completion remains uncertain and the reference model includes estimated details
picture: |
  Keep the north-west reference view exactly: azimuth 240 degrees, elevation 22 degrees, target 22 m above the centre. Preserve camera, lens, crop, oval outline, upper silhouette and all opening and seating outlines.
  Follow the three round-arched storeys in the reference, their engaged half-columns, bases, capitals, entablatures and parapets. Preserve the inner ring of arches and dark vaulted corridor where visible. The ascending Tuscan, Ionic and Corinthian order sequence is documented; the simplified profiles and dimensions remain partly estimated. Keep each feature on its actual reference geometry.
  Retain the attic wall, alternate-bay windows, pilasters, corbels and mast sockets already modelled. Keep any visible part of the existing roofed upper seating colonnade. These complete upper elements belong to the estimated reconstruction; their visibility does not establish that all were finished at the opening. Add no statuary, circular shields, awning masts, ropes, fabric or projecting axial entrance porches.
  Distinguish the higher seating-band exits from the innermost podium retaining wall immediately bordering the sand. In this reference the podium face toward the arena is continuous solid stone: preserve that blank opaque wall, with no added dark holes, doors, windows or entrance panels. Existing openings higher in the seating stay exactly where the reference shows them.
  Paint the intact exterior warm pale travertine with restrained estimated joints and subtle tonal variation. Give visible seating a pale marble or stone appearance. Exact finish, roof covering, paint and weathering are illustrative. Any visible arena is continuous dry sand over a covered timber floor, at the model's existing level and approximate outline. Expose nothing underneath.
  A few tiny figures in simple tunics may stand near the base, leaving the architecture easy to read. Their gathering, clothes and poses are estimated scale cues, not a documented occasion. Avoid a staged fight or enlarged crowd.
  Continue quiet level ground beyond the model stand to the horizon with no slab edge. Understated paving, dust and distant urban-valley haze are estimates, not a measured ancient city. Use no identifiable invented monuments. Clear neutral daylight, soft shadows and no lens blur.
avoid: >-
  Moving camera, crop or zoom; changing oval, arches, windows, mouldings, colonnade roof, seating, arena or parapet geometry; rectangular placeholders replacing the round arches; added sculpture, clipei, axial porches, roof over the arena, velarium, masts or rigging; added holes, doors or windows in the blank inner podium wall; exposed later hypogeum, basement grid, machinery or water; the Arch of Titus, Ludus Magnus, Domus Flavia, Venus and Roma temple, Arch of Constantine or Meta Sudans; medieval broken walls, churches, modern buildings, tourist fixtures, cars or asphalt; cliff, platform edge, park or open farmland; oversized crowds, combat, blood, darkness, shallow focus, inscriptions, writing or signs.
sources:
  - "S06, KCL Art of Making: inauguration, travertine and the exterior order sequence; S86, Roma Capitale: seating and sand-covered timber arena floor."
  - "M01, Colagrossi 1913 p. 42: storey and arch measurements of the monument, with no opening-period completion inventory."
  - "E07, official archaeological park history: opening-period timber technical spaces distinguished from Domitian's permanent masonry."
  - "E09, Elkins 2006 p. 212: the upper structure on Titus's coins does not prove completion in 80 CE; S86V pp. 3, 9, 22: mast evidence and awning uncertainty."
  - "research/museum/colosseum/sources.md: exact detailed-model parts, remaining DEFAULT estimates, arena and podium dimensions, and four omitted additions. Scene figures, surfaces, light and distant setting are estimates."
