# museum colosseum/northwest; matched to the canonical model rather than a later complete reconstruction.
place: The Colosseum in Rome, isolated as a museum reconstruction on level ground in its urban valley
when: The inauguration period in 80 CE under Titus, schematically represented; the clear daylight and quiet pause between spectacles are illustrative estimates
picture: |
  Keep the north-west reference view exactly: azimuth 240 degrees, elevation 22 degrees, target 22 m above the centre. Do not move the camera, change the lens, reframe the oval, alter the upper silhouette or change any existing opening or seating-band outline.
  Paint the intact exterior in warm pale travertine with restrained estimated stone joints and a little tonal variation. Give the visible seating a pale marble appearance and deep neutral shadows in the exterior marks. Sourced material families do not establish exact 80 CE blockwork, paint or weathering.
  The three rows of rectangular dark marks stay rectangular and stay in their reference positions. They only stand for the source-described arcade arrangement; do not replace them with another facade, draw true arches outside their bounds, add columns, sculpture or an extra attic storey. The unseparated upper edge remains a model approximation, not proof of a completed later crown in 80 CE. Leave roofs and velarium entirely unmodelled.
  In the centre, any visible arena surface is level dry sand over a covered timber floor, without today's excavated basement. Keep the model's approximate inner opening and arena-wall height. Nothing beneath the floor is exposed; do not invent access ramps, lift machinery, tunnels or a fully built permanent hypogeum.
  A handful of tiny figures in simple tunics can stand near the base as estimated scale cues, leaving the architecture easy to read. Their gathering, exact clothes and poses are illustrative. Keep them small in proportion and avoid a staged combat scene.
  Continue the level ground to the horizon with no sharp stand edge. A restrained pale forecourt surface is an estimate rather than an archaeological pavement plan. Beyond it use soft urban-valley haze, no newly designed foreground buildings and no identifiable later monuments. This is an isolated architecture study; do not imply that the surrounding ancient city was a field or a forest. Clear neutral daylight, soft shadows, no lens blur.
avoid: >-
  A moved camera, crop, zoom or changed oval/seating geometry; replacing rectangle silhouettes with a newly reconstructed arch facade; an added fourth storey, completed attic, shield frieze, sculpture, readable inscriptions, canopy, roof, velarium masts or ropes; the exposed later hypogeum, underground masonry grid, machinery or water spectacles; the Arch of Titus, Ludus Magnus, Domus Flavia, Venus and Roma temple, Arch of Constantine or Meta Sudans; medieval broken walls, churches, modern structures, tourist fixtures, cars or asphalt; a cliff, plateau edge, park or open farmland; oversized crowds, active combat, blood, dramatic darkness, shallow focus, writing or signage.
sources:
  - "FACTS.md S06; King's College London, Art of Making, Colosseum: 80 CE inauguration, audience capacity and travertine exterior."
  - "FACTS.md S86; Roma Capitale, L'Anfiteatro Flavio (Colosseo): oval monument, marble-covered seating and sand-covered timber arena floor."
  - "D'Anna and Molari, Il velarium del Colosseo, p. 22: three levels of 80 bays and a separate attic above; its awning solution is not used."
  - "research/imperial03_events_sources.json E07: official park history distinguishes timber facilities at inauguration from Domitian's permanent masonry."
  - "research/imperial03_events_sources.json E08; Taylor et al. 2016, p. 26 note 29: later attic completion; underlying ancient chronicle not separately read."
  - "research/museum/colosseum/sources.md: geometry limits, all estimated additions, actual native labels and numerically checked camera."
