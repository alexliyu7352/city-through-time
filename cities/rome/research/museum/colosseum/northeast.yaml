# museum colosseum/northeast; follow the detailed reference, without a newly invented seating plan.
place: The Colosseum in Rome, isolated as a museum reconstruction of its Flavian spectator ring and central arena
when: An illustrative inauguration-period view associated with 80 CE; the complete upper architecture is reconstructed with acknowledged uncertainty about its completion date
picture: |
  Preserve the exact elevated north-east reference view: azimuth 120 degrees, elevation 38 degrees, target 22 m above the centre. Keep camera, lens, framing, oval silhouette, inner opening and all seating and architectural outlines unchanged.
  This detailed reference has three bands of stepped seating, stairs, dividing walls and dark entrance panels, topped by a roofed colonnade. Preserve every row, stair, opening, column and roof edge as modelled. Counts, rake, terrace height and upper colonnade are estimates; do not invent additional subdivisions or turn them into a claimed surveyed 80 CE seat plan.
  Keep the dry sandy arena at its existing flat level, over a covered timber floor. The floor conceals technical spaces below, rather than exposing today's excavation. Retain the approximate 79 by 46 m inner opening and modelled podium and parapet. Do not add a cutaway, pit, radial basement walls, lifts, cages or machinery.
  The exterior already has round arches, engaged columns and entablatures, with a second ring of arches behind. Preserve those recesses and the reference's Tuscan, Ionic and Corinthian order sequence. Above them retain the solid attic with its windows, pilasters, corbels and sockets. Keep the existing upper colonnade roof; add no broader roof or canopy. The completed upper form is part of the estimated model, not an assertion of an entirely finished attic at the opening.
  Give the exterior warm pale travertine, the seating pale marble or stone, and the sheltered recesses neutral deep shadows. Material families are sourced; exact joints, roof covering, colour, finish and weathering are estimates. Leave the sand mostly empty; a few tiny spectators may sit on the existing rows as illustrative scale cues, without obscuring the model.
  Carry quiet level ground beyond the stand to the horizon, with understated estimated paving and soft distant urban-valley haze. Do not place identifiable invented buildings. Keep bright even daylight, legible recesses and everything sharp.
avoid: >-
  A different viewpoint, crop, zoom or cutaway; altered oval, seat rows, stairs, roof edges, arch or window shapes, arena opening or parapets; added measured-looking seating divisions; shields, statues, axial entrance porches, velarium fabric, masts or rigging; exposed hypogeum, corridors, lifts, machinery or water; the Arch of Titus, Ludus Magnus, Flavian palace, Venus and Roma temple, Arch of Constantine or Meta Sudans; churches, later ruins, modern furniture, roads, cars or tourists; hard-edged stand, cliff, green park or open farmland; blur, night lighting, combat, blood, inscriptions, labels or writing.
sources:
  - "S06, KCL Art of Making: inauguration, exterior materials and order sequence; S86, Roma Capitale: seating and sand-covered timber arena."
  - "M01, Colagrossi 1913 p. 42: storey heights and arch widths; its monument description does not establish the completion state in 80 CE."
  - "E07, official archaeological park history: timber technical spaces at inauguration, permanent masonry under Domitian; neither is shown as an exposed excavation."
  - "E09, Elkins 2006 p. 212: completed upper levels on contemporary coins do not demonstrate completed works. S86V pp. 3, 9, 22: awning and mast evidence, without adopting its reconstruction."
  - "research/museum/colosseum/sources.md: DEFAULT seating, colonnade, spring and pedestal estimates, model arena dimensions and four omitted additions. Figures, surfaces, light and distant setting are illustrative estimates."
