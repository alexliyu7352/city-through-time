# museum colosseum/northeast; no separately invented archaeological plan.
place: The Colosseum in Rome, an isolated museum reconstruction of the canonical oval spectator ring and its central arena
when: The inauguration period in 80 CE under Titus, represented schematically in clear daylight; no exact opening-day hour is claimed
picture: |
  Preserve the exact elevated north-east reference view: azimuth 120 degrees, elevation 38 degrees, target 22 m above the centre. Keep its camera, framing, oval silhouette, seating bands, inner opening and every rectangular exterior mark unchanged.
  This view explains the open centre and the slope from the outer rim towards the arena. Give the exterior warm pale travertine and the seating a pale marble surface. These material families are sourced; exact joints, block courses, colours, seating divisions and weathering are estimated. Do not split the model's broad seating bands into a supposedly measured ancient seat plan.
  Show a continuous dry sandy arena over the timber floor, at the flat level already present in the reference. The floor covers the technical spaces below; it is not today's open archaeological excavation. No cross-section, uncovered hypogeum, underground corridors, radial walls, lift cages or machinery. The inner opening remains the canonical approximate 79 by 46 m rather than changing to another researched arena measurement.
  Keep the three rows of dark rectangular opening marks in exactly their existing bounds. They are schematic placeholders, not a complete reconstruction of Roman arches. Do not add a separate attic wall, portico, sculptural crown, roof, canopy or awning mechanism to make the view seem more complete. Unmodelled details remain omitted and the model's upper edge remains explicitly schematic for the 80 CE period.
  Leave the sand mostly empty; a few tiny spectators may be scattered across the existing seating bands as estimated scale cues. Exact crowd placement and tunic colours are illustrative, not source evidence. Keep people small enough to match this elevated view.
  Carry the neutral level forecourt surface beyond the model stand to the horizon; its paving pattern is estimated and kept inconspicuous. A soft distant urban-valley haze may suggest the setting without placing identifiable invented buildings or turning the isolated building into a fabricated city plan. Bright even daylight, legible recesses, everything sharp.
avoid: >-
  A different viewpoint, a cutaway, a new crop or zoom, taller walls or a changed arena opening; detailed seat rows presented as surveyed; real arch shapes replacing the reference rectangular marks; a complete later attic, shield decoration, statues or column orders; a roof or velarium, masts and rigging; an exposed excavated basement, Domitian's permanent masonry hypogeum, corridors or lifts; water in the arena; the Arch of Titus, Ludus Magnus, Flavian palace, Venus and Roma temple, Arch of Constantine or Meta Sudans; later ruins, churches, modern urban furniture, cars or tourists; a hard-edged ground slab, cliff, green park or open farmland; atmospheric blur, night light, spectacle violence, labels or writing.
sources:
  - "FACTS.md S06 and King's College London, Art of Making, Colosseum: inauguration, spectators and sourced exterior materials."
  - "FACTS.md S86 and Roma Capitale, L'Anfiteatro Flavio (Colosseo): overall oval dimensions, marble-covered seating and sand-covered timber arena. Exact scene surfaces are estimated."
  - "D'Anna and Molari, Il velarium del Colosseo, p. 22: three arcaded levels of 80 bays and an attic; no awning reconstruction adopted."
  - "research/imperial03_events_sources.json E07: the official park distinguishes opening-period timber structures from Domitian's permanent masonry; neither is modelled as an exposed pit."
  - "research/imperial03_events_sources.json E08, Taylor et al. 2016 p. 26 note 29: dedication does not establish completion of the attic; underlying ancient chronicle not separately read."
  - "research/museum/colosseum/sources.md: estimated seating profile, 79 by 46 m model arena, 4 m arena wall, missing architecture, bounds and camera checks."
