rome_round10_stpeter_open_drum:
  kind: parts
  exaggeration: 1
  basis: 'research/rome07_renaissance_survey.md R01-R07 and R03_plan_work.jpg. Vatican
    exterior dome diameter58.90m and facade116x45.50m. Plan articulation follows Alfarano1590
    and Falda1667, not a solid church box. The body42m, crossing attic12.5m, drum20m,
    shell35m, lantern18.17m and all wings/openings/roof slopes are source-constrained
    massing estimates, not a surveyed elevation;133.30m is the selected Vatican overall
    exterior-height branch. No internal double-shell reconstruction; the external
    ribs added in round9 are schematic massing. Formal native child stages retain
    one level site. Drum and peristyle, shell, lantern, ball/cross and Maderno nave
    are separate native classes with the same sourced dimensions. Cut removes an anachronistic
    whole-footprint platform while the old east nave stands; current DEM remains a
    schematic grade, not the ancient church floor. 05b-07 adaptation: work1606 and
    work1609 are exact copies of the last low construction long_hall in research/rome07_renaissance_landmark_types.yaml#rome07_renaissance_newstpeter_1606/_1609,
    also used in the approved phase study. The old east nave follows the approved
    formal whole-part retirement; the separate 30m study remnant is not introduced
    into the unchanged prefix. Round9: research/rome_round9_stpeter.md. R07 official
    facade: column height27.48m; single central pediment30x7.50m, all inside the retained116x45.50m
    facade. Cornice/parapet depths and levels, shallow central/end facade projections
    and two chapel-domes20m across at[22,+/-37]m are graphic massing estimates from
    Falda1667 and the existing comparison references, not surveyed details. The main
    shell has16 native ribs,1.4m wide and0.7m raised; widths/relief are estimates.
    The retained32 drum columns form16 pairs (+/-2.5deg);8 lantern pairs at4.5m radius
    are graphic estimates following R05 paired-column articulation. The0.7m ball offset
    correction only compensates native atop following the raised rib height. The round9
    facade detail is superseded by the round10 treatment below. Round10 supersedes
    the round9 facade-window and omitted-Loggia scope: research/rome_round10_stpeter.md.
    R07 gives columns27.48m high and diameter2.77m; giant order has8 round shafts
    and flat end pilasters. Column positions, simple capital masses, five lower/upper
    openings, the central balcony, attic windows and all smaller levels/depths are
    schematic photo-constrained estimates from the retained2002 front view, not a
    measured elevation. Native arches cut actual apertures in all overlapping facade
    bodies; the central upper aperture is the Loggia. No named figures, statue substitutes,
    clocks or leaf ornament are added. The same outer116x45.5m facade, child IDs,
    construction stage and previous dome/ribs/small domes are retained. Drum-only
    correction: research/rome_round10_stpeter_drum.md. The same drum ID and atop3
    keep its50m outer diameter,20m rise,48-sided outside and unchanged upper support
    plane. An annular native revolve replaces only the solid cap and interior, with
    a41.50m clear opening constrained by the existing Vatican R05 interior-diameter
    comparison. The inferred4.25m annular working edge and vertical inner wall are
    schematic, not a survey of the1564 wall or scaffolding. The ring itself provides
    the working edge; no new permanent platform or people. Dome, cornice and all other
    atop/index/stage relations are unchanged.'
