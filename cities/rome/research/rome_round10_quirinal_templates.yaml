    uses R21 Caprini named palazzo comparison. Roofs, ornament and exact historical
    ground footprint are not reconstructed. Shown only in the late complete-city observation,
    not asserted newly built1667 or copied into1506. research/rome_director_v9_0507_facade_patch.md;
    P06/P07:2 principal model levels adopted as E, not a reconstruction of every mezzanine.
    Named contemporary Farnese P03/P05 average57/13≈4.38m; adjusted native carrier
    pitch gives26 model bays on its existing115.8m front, not26 actual Quirinal windows.
    The original main court has no whole-front ground arcade. Original23m flat top/plan/holes
    retained. Original prism is part[0]; all native long_hall wings append. Their2m
    bodies are inside the source prism; flat roof tops stay0.1m below the retained
    core top (Massimo ground carriers below5m) to avoid coplanar roof faces. Native
    windows project0.2m and ledges project at most0.4m normal to the corresponding
    source edge, including court sides; this approved facade detail is not bitwise-identical
    exterior bounds. No nested parts or per-window bespoke geometry. research/rome_round10_quirinal.md.
    Presidency official history and imperiali.pdf: Manica Lunga is the south side
    of the palace, begun under Sixtus V, extended by Bernini1656-1659 and Specchi,
    completed by Fuga under Clement XII1730-1740. Constitutional Court official booklet
    gives approximately360m. Censo1866 registered by the existing native affine controls:
    the long narrow wing and Fuga terminal are source-graphic traces, not a present-day
    footprint. The 351.3m axis,14m body width,18m eaves/two principal levels,21m terminal
    and18deg hip roof are constrained massing estimates, not surveyed dimensions.
    Height compares with the retained23m main court; bay4.38m retains its named Farnese
    comparison, not a count of real Manica windows. Undated later Savoyard heightening
    is not assigned to1871. Existing palace stock, not1871 construction. The connector
    shares the existing core edge without duplicating its court.'
