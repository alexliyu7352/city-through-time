    page confirms six columns and post1943 reconstruction. AMS1944 north traced west–east
    church axis; TourismRoma door point controls its west front. Portico8m overall
    depth/6m open column bay is a source-photo scale estimate against its7m columns,
    not a measured plan. Source-plan90m body length/30m width rounded from 1:10000
    scan. Heights6/9/14/30m, roof4.2m rise,12 comparative nave bays, simplified rear
    hall and tower are massing estimates against reused urban-basilica types and source
    photographs, not an architectural survey. Roof skin is a named part;1943 loss
    removes that skin only, retains standing side arcades, six front columns, rear
    body and campanile. Surviving individual timber trusses, broken upper facade edges
    and1944 repair scaffolding omitted. Does not assert an unrepaired roof through1945.
