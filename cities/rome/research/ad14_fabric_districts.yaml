policy:
  default: Subtract early public reservations, gardens, water and frozen sample; assemble connected blocks
    inside source built coverage. Use each street edge direction. District windows only choose basis/type
    applicability, never create ruler-cut housing edges.
  seam: Overlapping windows are context transitions, not duplicate housing. Assign each whole block to
    its dominant local context, record the choice; no house is cut at a district line.
  shares: No population, building count or percentage target. Place complete domestic/work courts in deep
    buildable plots, commercial front buildings on evidenced business streets. Resulting counts are production
    inventory only.
  edge: Brown DAR edge is approximate and source white is no-information. Sparse road-edge service buildings/fields/gardens
    beyond it may be schematic only when separately justified; never treat the entire map-white as vacant
    ground.
  floor_rule: Fixed whole-building floor count. One/two-storey courts are simplified whole buildings.
    Three-storey street-building height uses pre79 Insula Orientalis II comparison, independently schematic
    Roman street-house plot; no proof the same AD14 structure existed.
