rome07_renaissance_closed_wing:
  kind: long_hall
  w_m: 16.77
  d_m: 54
  h_m: 16.047
  exaggeration: 1
  site: cut
  roof:
    shape: gabled
    pitch_deg: 10
  basis: research/rome07_renaissance_colonnade_sources.md. Falda1667 and Falda1665-69
    give continuous curved entablature/rail and closed west wings; unbuilt third arm
    excluded. Villani printed36 gives 12.847m column system and3.20m entablature;
    printed149 fig119 multi-centred plan, dimensioned to Fabbrica196x149m. Four rows
    and 16.77m covered width Vatican R06. The three-circle fits, column spacing/distribution,1.5m
    diameter,1.5m hidden roof rise,1.56m railing, terminal pediments and wing lengths
    are bounded source-comparison estimates. No claim of all284columns/88piers or
    complete statuary. Native prism bands and4m roof segments avoid the full-circle
    bounds of partial revolve; straight roof segment approximation is explicit. 1734raised
    southern roof is not backdated. No medieval diagram is evidence for the Bernini
    roof. Interior vaults and sculpture omitted. Closed inclined wing separately grounded;
    no invented raised whole-square podium.
