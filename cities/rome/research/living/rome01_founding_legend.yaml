place: The approved Cermalus hut group on the Palatine hillside beside the Tiber
when: The legendary founding of Rome, traditionally 753 BCE, not a witnessed historical event
picture: 'Keep the reference camera, all hut outlines, ground slopes, paths and visible river
  in exactly the same positions. Paint the huts as the approved single-room timber-and-earth
  huts with straw thatch and the existing two-post entrance porches. Do not add buildings. In
  the open foreground place a small plausible imagined group: Romulus in a plain wool tunic
  and mantle guides a wooden ard with a bronze share, drawn by one bull and one cow yoked side
  by side. Two or three companions behind turn clods inward. The short furrow lies only in the
  existing empty ground and is not a completed wall. Keep people and animals scaled believably
  to the huts. Natural daylight, restrained earthy documentary realism and very light painterly
  texture matching the approved Rome illustrations. Fill the distant dark background as continuous
  low wooded hills and natural sky. Show the Tiber only where it is visible in the reference,
  never move it or force a new view.


  Surrounding ground and skyline: The bare ground is the sloping, open ground between the approved
  Cermalus hut groups, with paths and uncultivated grass or low vegetation; it is not a later
  paved Roman city or a new lake. Continue the same low wooded hill profile in the distance.
  This is a conservative environmental setting for the approved schematic hut model, not a surveyed
  753 BCE field or a claim about exact tree cover.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No changes to viewpoint, lens, framing, horizon, hut positions, sizes or roof lines.
  No giant platforms, marble temples, aqueducts, Colosseum, stone city walls, modern bridges
  or embankments, Renaissance domes, metal machinery, crowns, imperial armour, white ceremonial
  togas, wolves, twins, violence, portrait closeups, text, border or watermark. Not a documentary
  record or a reconstruction of a proven individual biography.
sources:
- FACTS S191; Plutarch, Romulus 11.2–3, the later literary tradition of the bull-and-cow ploughing
  rite
- FACTS S128 and the approved Cermalus model; PArCo Casa Romuli model and archaeological hut
  plans, upper elevations estimated
- Director instruction 2026-11-04: legendary founding as a living moment; up to 4–5 seconds
    after r01_013
