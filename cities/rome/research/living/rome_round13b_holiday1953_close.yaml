picture: >-
  EDIT the native white-model reference into a restrained natural-colour historical
  reconstruction. Keep exactly its genuinely close road-level native camera, lens,
  horizon, framing and all visible existing building and Colosseum outlines. The
  Colosseum is a partly ruined surviving monument in 1953, only a cropped background
  fragment in this low close shot. Preserve every visible arcade and gap, including
  the different-height inner supports and northern remnant if visible; never restore
  the complete ancient amphitheatre. Preserve the 1953 surrounding inhabited city.

  The immediate foreground action is TWO anonymous normal-sized adults riding ONE
  small rounded early Vespa-style scooter away from the viewer, seen from behind at
  rear three-quarter angle. Make both riders visibly distinct through their natural
  seated silhouettes: plain-shirted man at the handlebar in front, light-bloused woman
  in a modest mid-calf skirt seated behind. They share one seat and vehicle. No faces
  or actor likenesses. The native camera is close enough that the paired riders and
  scooter together should occupy about 220–300px in height at 1920×1080, at the correct
  real street perspective, about11–13m from the native camera, nearer than the aim point. No giant
  people. Keep their feet/wheel contact and rear wheel believable. Early restrained
  single-colour metal body, low front-lamp form, no logo or modern accessories.
  Frame them in the lower-middle foreground, immediately readable on a phone, with
  the existing road and cropped monument behind; no half-frame of empty street.

  A few ordinary small 1950s-or-earlier rounded cars and sparse anonymous bystanders
  at true perspective scale may appear farther away on the existing street. Do not
  add a crowd or chase. Natural weathered travertine, restrained warm plaster,
  muted road grey and roof colours. Model white/lilac/gold are projector colours,
  not real materials. Natural readable daylight, low saturation, documentary realism
  and extremely light painterly texture matching the approved Rome living set.
  This is a new imagined source-based image, not a copied movie frame or archival
  photograph. Deliver identical native landscape 16:9 composition, no crop or zoom.
avoid: >-
