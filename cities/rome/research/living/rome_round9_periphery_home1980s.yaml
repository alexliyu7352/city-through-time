place: A residential access path beside an existing apartment block in the approved
  outer-Rome model; no identified household, address or estate is claimed
when: After 1975, represented as the early 1980s; the specific moving day is imagined
picture: >-
  Edit the final model reference into one quiet moment of a family arriving at its
  new home. Preserve the exact camera, perspective, terrain, access path, every
  building footprint, facade plane, height and roof outline. A few small ordinary
  adults and a child carry a modest suitcase, a plain cardboard carton and folded
  bedding along the existing access path towards one existing apartment block.
  The gestures are practical and unposed. Use restrained late-1970s to early-1980s
  everyday clothes, without visible brands. Show the building from outside, its
  solid roof above the family and the surrounding open residential setting already
  visible in the reference. Running water and electricity are facts carried by
  the narration; do not invent a kitchen, bathroom, exposed pipes or an electrical
  installation to illustrate them. Natural colours, well-lit restrained documentary
  realism and light painterly texture matching the approved Rome living pictures.
avoid: >-
  No changed camera, relocated buildings, added wings or floors, invented courtyard,
  invented balconies, cutaway, interior room, tap, sink, utility meter, staged
  switching-on gesture, copied identifiable family, named estate or house number.
  No present-day cars, smartphones, satellite dishes, photovoltaic panels, luxury
  moving service, branded cartons, close-up faces, slogans, text, border or watermark.
  Do not imply that all peripheral families had the same origin or experience.
sources:
  - FACTS S68; research/rome_restart_modern_sources.md M08; research/stories.md 12-modern_growth
  - >-
    Maria Immacolata Macioti, Roma, le borgate di ieri, le periferie di oggi,
    Dialoghi Mediterranei, 2019-07-01, paragraphs beginning Avere casa popolare
    and A Roma, ad esempio; https://www.istitutoeuroarabo.it/DM/roma-le-borgate-di-ieri-le-periferie-di-oggi/
  - >-
    This source is a sociologist's fieldwork-based retrospective of some families,
    not a dated photograph of this model block. Moving objects, clothes and the
    anonymous family are restrained period-plausible staging, not an attested biography.
