place: St Peter's Square, Rome, looking west towards the basilica from the empty square
when: the rainy evening of 27 March 2020
picture: 'Preserve the reference model''s exact view, perspective, horizon, basilica silhouette,

  colonnades, the obelisk and all paving and street geometry. Turn the white-model

  surfaces into the actual warm travertine and wet stone of St Peter''s Square.

  Rain at dusk, dark blue-grey sky, the broad square empty of crowds, wet paving

  reflecting restrained warm lights. At the distant basilica entrance put a small

  lit temporary canopy and one very small white-robed figure at prayer beneath it.

  The figure is seen at a distance without a face or identifiable portrait detail.

  A restrained documentary film still with natural materials, no theatrical spectacle.


  Surrounding ground and skyline: Bare dark model ground outside the colonnade is the built-up
  Vatican/Borgo precinct and its real streets, not a lake or open countryside. Preserve the
  final reference''s surrounding present-day buildings and ground surfaces: the Vatican palace
  complex stands beside the basilica, the Borgo city blocks lie beyond the north and south edges,
  and Via della Conciliazione approaches the square from the east wherever this camera can actually
  see it. The square, adjacent streets and urban ground form continuous dry land made wet by
  rain. Render wet stone and shallow rain sheen only, with local reflections broken by paving
  texture; water must not reach column bases like a continuous flooded basin. Preserve the approved
  solitary prayer figure, distant canopy, empty square, rain and dusk mood. Do not add crowds,
  visible traffic or a new city layout.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: "crowds, a packed audience, close-up faces, invented medieval structures,\nmodern vehicles,\
  \ news logos, lettering, captions, watermarks, changed architecture,\na different camera,\
  \ cropped or zoomed framing, a bright sunny sky.\n Do not copy the white model or projection\
  \ tint as real plaster, stone or metal colour. No lake, floodwater, floating square, river\
  \ round the colonnade, vanished Borgo blocks or invented shoreline."
sources:
- FACTS S53/S54; approved pandemic narration r10_010-r10_012.
- Vatican, Extraordinary Moment of Prayer, 27 March 2020; evening, thick atmosphere and empty
  square; https://www.vatican.va/content/francesco/en/homilies/2020/documents/papa-francesco_20200327_omelia-epidemia.html
- The film's sourced Saint Peter's, Bernini colonnade and current urban model supply geometry;
  the canopy, rain and distant white-robed figure are generated reconstruction, not third-party
  photography.
- 'Turismo Roma / Roma Capitale, Rione XIV - Borgo: the surrounding inhabited district and buildings
  along Via della Conciliazione; use the approved current model for exact visible massing, not
  a guessed skyline; https://www.turismoroma.it/it/pagina/rione-xiv-borgo'
- FACTS S54 explicitly retains the houses in the pandemic depiction; public activity recedes,
  buildings do not disappear. The new reference must keep the actual current urban context.
