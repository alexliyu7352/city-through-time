place: Piazza Pia, looking along the approved surface connection into Via della
  Conciliazione towards Saint Peter's, Rome
when: Late December 2024, after the pedestrian space opened on 23 December;
  an ordinary winter day, not the opening ceremony
picture: >-
  Edit the final model reference into an ordinary lived-in pedestrian square.
  Preserve the exact camera, lens, horizon, paving extent, ground levels, every
  building outline and the position and silhouette of Saint Peter's wherever it
  is already visible. Place small, naturally spaced anonymous adults and families
  in winter coats walking on the existing surface route from Piazza Pia into Via
  della Conciliazione towards the basilica. Most are seen from behind or the side;
  a few walk the other way. Keep the view open enough to read the continuous route.
  Paint only the fountains, steps or trees already represented in the approved
  reference; do not supply missing project geometry from imagination. Soft winter
  daylight, natural colours, restrained documentary realism and light painterly
  texture matching the approved Rome living pictures.
avoid: >-
  No changed viewpoint or landmark size, new buildings, invented tunnel section,
  new fountains or trees, surface traffic across the pedestrian connection,
  ribbon cutting, officials, pope, identifiable real people, posed faces, dense
  ceremonial procession, 2025 conclave or Jubilee event, banners, readable logos,
  slogans, text, border or watermark. Do not use a later named event to populate
  December 2024 or turn the square's possible capacity into an observed crowd.
sources:
  - FACTS S62; research/rome_tail_0810_sources.md; research/rome_director_v7_facts_07_10_20261101.md N10
  - >-
