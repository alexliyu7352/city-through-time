    paragraph: the surface connects Castel Sant'Angelo and Via della Conciliazione,
    with road traffic below; https://www.comune.roma.it/web/it/notizia/ecco-la-nuova-piazza-pia-dicembre-2024.page
  - >-
    Ordinary walkers are anonymous imagined inhabitants and visitors. The official
    article establishes the place and opening date, not this group or a documented
    winter-day photograph. No third-party photograph is included in the output.
