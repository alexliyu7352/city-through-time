place: A residential access path beside an existing apartment block in the approved outer-Rome
  model; no identified household, address or estate is claimed
when: After 1975, represented as the early 1980s; the specific moving day is imagined
picture: 'Edit the final model reference into one quiet moment of a family arriving at its new
  home. Preserve the exact camera, perspective, terrain, access path, every building footprint,
  facade plane, height and roof outline. A few small ordinary adults and a child carry a modest
  suitcase, a plain cardboard carton and folded bedding along the existing access path towards
  one existing apartment block. The gestures are practical and unposed. Use restrained late-1970s
  to early-1980s everyday clothes, without visible brands. Show the building from outside, its
  solid roof above the family and the surrounding open residential setting already visible in
  the reference. Running water and electricity are facts carried by the narration; do not invent
  a kitchen, bathroom, exposed pipes or an electrical installation to illustrate them. Natural
  colours, well-lit restrained documentary realism and light painterly texture matching the
  approved Rome living pictures. Present a clean newly occupied public-housing exterior in this
  late-1970s/early-1980s moment: fresh intact plaster and simple sound frames, with the same
  family and moving possessions. Avoid grime, peeling paint and a derelict appearance.


  Surrounding ground and skyline: The bare foreground and spaces between blocks are the open
  residential grounds and access paths already implied by the approved outer-Rome apartment
  model. Keep them as modest grass, dry soil and simple paths between existing low apartment
  blocks and distant taller blocks. They are not an isolated country farmhouse or a dense historic
  central-Rome street. Preserve the modelled distribution of open space and buildings without
  adding a named estate, playground, formal garden or exact planting plan. The address and the
  precise landscaping are not documented.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No changed camera, relocated buildings, added wings or floors, invented courtyard, invented
  balconies, cutaway, interior room, tap, sink, utility meter, staged switching-on gesture,
  copied identifiable family, named estate or house number. No present-day cars, smartphones,
  satellite dishes, photovoltaic panels, luxury moving service, branded cartons, close-up faces,
  slogans, text, border or watermark. Do not imply that all peripheral families had the same
  origin or experience. Do not copy the white model or projection tint as real plaster, stone
  or metal colour.
sources:
- FACTS S68; research/rome_restart_modern_sources.md M08; research/stories.md 12-modern_growth
- Maria Immacolata Macioti, Roma, le borgate di ieri, le periferie di oggi, Dialoghi Mediterranei,
  2019-07-01, paragraphs beginning Avere casa popolare and A Roma, ad esempio; https://www.istitutoeuroarabo.it/DM/roma-le-borgate-di-ieri-le-periferie-di-oggi/
- This source is a sociologist's fieldwork-based retrospective of some families, not a dated
  photograph of this model block. Moving objects, clothes and the anonymous family are restrained
  period-plausible staging, not an attested biography.
