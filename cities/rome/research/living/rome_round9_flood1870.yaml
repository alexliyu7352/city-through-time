place: A small street-level part of the approved pre-embankment river-side Rome model, in the
  documented context of flooded Via della Fiumara in the former Ghetto
when: December 1870; the exact hour and water depth are not reconstructed
picture: 'Edit the final reference into a single quiet moment in a flooded residential street.
  Preserve the exact camera, perspective, ground alignment, every existing building position,
  height, roof outline and visible street opening. Let muddy floodwater occupy the visible street
  between the existing house fronts so that the loss of ordinary foot passage is unmistakable.
  A small plain open wooden rowing boat carries two or three ordinary residents close to the
  houses; one person works an oar, the others sit low. Keep people and the boat in believable
  proportion to the buildings. Muted nineteenth-century winter clothing, coats, shawls and simple
  head coverings, no posing. The later Roesler Franz painting supplies the visual motif of boat
  passage beside flooded houses, not a measured level or permission to copy its different buildings
  or viewpoint. Overcast but legible natural light, restrained documentary realism and light
  painterly texture matching the approved Rome living pictures. This is an imagined local street
  moment based on the sources, not a flood simulation.


  Surrounding ground and skyline: The bare foreground is the flooded local residential street
  in the source-described pre-embankment Via della Fiumara/Ghetto context, immediately beside
  existing house fronts. It is not a permanent lake, sea or a newly widened engineered river
  channel. Continue only muddy street floodwater within this local view; preserve the existing
  house frontage and the narrow openings. The camera does not establish the city-wide flood
  edge or an exact street depth. No completed modern Lungotevere wall belongs here.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No camera change, relocated buildings, copied painting skyline, giant waves, city-wide
  flood panorama, exact depth scale or invented flood boundary. No completed modern high embankments,
  modern vehicles, motorboat, plastic rescue gear, uniforms, hero pose, royal visit, named residents,
  drowning scene, close-up faces, readable street signs, text, border or watermark. Do not turn
  a modern dry DEM into evidence of the historical water level or claim this is an 1870 photograph.
  Do not hide a river-wall construction change beneath the living image.
sources:
- FACTS S19; research/rome_director_v9_0507_flood_picture.md; research/rome08_capital_tiber_basis.md
- Eugenio Di Loreto and Pio Bersani, Le alluvioni storiche del Tevere a Roma, ISPRA Memorie
  Descrittive della Carta Geologica d'Italia 108 (2021), p.216, fig.13, which identifies Roesler
  Franz's painting as Via della Fiumara flooded in December 1870; https://www.isprambiente.gov.it/it/pubblicazioni/periodici-tecnici/memorie-descrittive-della-carta-geologica-ditalia/4-2diloreto-bersani_layout-1.pdf
- Ettore Roesler Franz, Via della Fiumara in Ghetto allagata, c.1880 in the Commons catalogue,
  a later painting. The Commons File page explicitly marks this reproduction Public domain /
  PD-Art (PD-old-100), checked for reuse; https://commons.wikimedia.org/wiki/File:Ettore_Roesler_Franz_ViaDellaFiumaraAllagata.jpg
- The painting is already held as assets/restart_sources/rome1870_flood_fiumara_roesler_franz.jpg.
  It is a reference, not a replacement camera or the date of a live photograph. The boat's occupants
  and their exact clothing are anonymous plausible staging.
