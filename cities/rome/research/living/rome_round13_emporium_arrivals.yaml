place: The approved 160 BCE early Emporium loading reservation, with the existing service yard and residential/service buildings left unchanged; working activity centred 12.4756 E, 41.88085 N
when: Around 160 BCE, an anonymous working day after the documented 174 BCE Emporium improvements; not a named shipload, triumph or exact delivery date
picture: >-
  EDIT the final native reference into one ordinary grain-arrival moment in middle-Republican
  Rome. Keep the exact camera, framing, lens, every roof, wall, opening, ground slope and
  street position. The visible backdrop is the existing closed-atrium residential/service
  building row, not an invitation to draw a new covered portico. Use the existing empty
  service/loading yard in front without changing any wall, roof, doorway or building use.
  Do not turn these modest buildings into the later enormous concrete barrel-vault warehouse. The
  camera looks inland from the river side, so the Tiber and any quays are behind the camera
  and entirely outside the picture.

  On the existing loading ground in the left foreground, one ordinary adult porter brings a
  heavy unbranded plant-fibre sack of grain on his shoulder from the off-camera river direction;
  a second adult helps receive it, while a third steadies a few waiting sacks at the work edge.
  Show physical weight, believable hands and feet, one loosened sack opening with a little
  visible grain if the final scale permits. In the 1920 x 1080 native frame place the group
  around x714, y727, the integrator-checked point inside the source loading reservation.
  All workers remain ordinary true human scale, about 25-35 pixels tall at this native size,
  compared with the existing two-metre door openings, never enlarged. Plain short tunics and modest natural
  fibre materials, no trade uniform or specific social identity. A few plain containers or
  small wrapped packages can remain secondary ordinary cargo, never labelled as proven loot.

  Bare ground here is a working loading/service court, with the existing approach paths
  and low residential/service buildings toward the Aventine. No covered work range needs
  to appear in this view. Continue
  only the modelled buildings and ground. Keep reasonable passage space open. Natural earth,
  restrained stone working surfaces and worn timber; muted clay roof tiles and warm plaster
  where present. No new shoreline or unmodelled terraces. Model white, lilac, teal or gold
  are projection colours, not real material colours. Natural readable daylight, restrained
  documentary realism with extremely light painterly texture matching the approved Rome
  living set. Deliver the same native landscape 16:9 composition.
avoid: >-
  No camera change, crop, zoom, relocated roof or enlarged people. No water anywhere in this
  inland-facing frame, invented quay, sea harbour, giant merchant ship, cranes, new stairs,
  new portico, newly opened colonnade, removed residential wall or invented warehouse facade.
  No 487 x 60 m fifty-vault Porticus Aemilia, Sullan warehouse, later Galbana, imperial Ostia,
  Portus, Trajan's hexagonal harbour, Colosseum, imperial Annona officials, legionary parade,
  triumphal arch, captives, slave chains, named general or portrait. No oil amphorae replacing
  all the grain, modern sacks, printing, pallets, vehicles, metal lifting equipment, bright
  white toga crowd, text, watermark or border. Do not claim this exact cargo is a documented
  160 BCE tribute or spoils consignment.
