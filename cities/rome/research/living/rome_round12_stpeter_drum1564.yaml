place: The unfinished drum of new Saint Peter's in the approved Renaissance Rome model; the
  final film camera decides which construction edge is visible
when: Around 1563-1564, at the drum-only stage reached by Michelangelo's death
picture: 'Edit this exact final reference into a working Renaissance building site. Preserve
  the camera, perspective, terrain, every standing building mass, wall, column, drum opening
  and roof outline. Keep the top of the drum conspicuously open to the sky: the dome shell has
  not been built. Give the existing stonework a restrained worked-stone surface. At the visible
  construction edge add only modest temporary timber working planks, a simple mast-and-rope
  lifting rig and a few small ordinary workers in plain mid-sixteenth-century tunics, hose and
  soft caps. One worker guides a modest rope-slung stone while another handles a rope; any other
  worker carries a small tool. Keep their scale subordinate to the monumental drum. The lifting
  method follows the mast cranes documented in Dosio''s near-contemporary view of the same site,
  without claiming its exact machine position or reproducing undocumented gearing. Use natural
  colours, legible daylight, restrained documentary realism and light painterly texture matching
  the approved Rome living pictures. This is one anonymous work moment, not a portrait of Michelangelo
  or the instant of his death. The camera targets the upper drum work platform. Ordinary 1.6–1.8-metre
  people must remain at true architectural scale, clearly readable as ordinary workers in the
  approved near reference. Their pixel size must come from the native camera being closer to
  the upper work edge, never from enlarged human bodies. Make the mast, rope and one modest
  hanging stone legible through this near composition.


  Surrounding ground and skyline: This final camera is on the east-northeast side of the upper
  drum, looking west-southwest. Its framing is a close work-edge view: the near drum wall continues
  below the image, with the open elliptical rim crossing the frame. Do not pull back to reveal
  the whole drum. Borgo, the old basilica''s still-standing eastern nave/front half and atrium
  are mainly behind the camera; do not move them into this western background. The earlier Vatican
  palace complex also exists beside the site, but do not invent an unmodelled palace skyline
  in the central western garden view. Preserve any building mass that is actually in this final
  reference; the background land visible above the drum is the rising Vatican hill and the established
  enclosed garden precinct, with restrained grass, a few orchard trees or low vegetation and
  plain paths. Vatican State''s Giardini Vaticani history documents garden/orchard/meadow uses
  from 1279, not the exact 1564 path layout, tree positions or present formal garden design.
  Keep this backdrop low-information and subordinate to the work. Do not paint a patchwork of
  Tuscan farm fields, remote village panorama, rows of vineyards, modern formal garden beds
  or a free-standing country church. The site remains attached to the existing Vatican/Borgo
  urban precinct outside the camera.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No changed camera or building dimensions, completed dome, partial dome shell, lantern,
  apex ball or cross, completed later nave and facade, Bernini colonnade, modern tower crane,
  steel scaffolding, hard hats, modern safety vests, motor, invented giant treadwheel, impossible
  enormous hanging block, dramatic collapse, heroic portrait, text, border or watermark. Do
  not use Dupérac's ideal completed design as a record of the 1564 construction state. Do not
  transfer a later dome- vaulting centering system back to the drum-only site. Do not copy the
  white model or projection tint as real plaster, stone or metal colour. No isolated rural church,
  continuous surrounding farmland, full-drum panorama substituted for the near work-edge shot,
  enlarged people or 1565-and-later new Borghi.
sources:
- FACTS S38 and S174; research/rome_stpeter_completion_timetable.md
- 'Fabbrica di San Pietro, La Cupola: Michelangelo designed and built to the drum; the dome
