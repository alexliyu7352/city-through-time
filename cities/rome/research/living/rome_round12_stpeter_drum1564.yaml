- The official history establishes the drum-only stage. The near-period drawing establishes
  mast-crane handling, not the exact rigging, worker count, clothing or external mast positions
  in this final model view; these remain restrained plausible reconstruction. The source illustration
  is not included in the film.
- research/rome07_renaissance_phases_review.md; approved 1564 Vatican phase retains the eastern
  old nave/atrium beside the new central body; pre-1565 Borgo context only. The later R43 palace
  stage must not be copied backwards.
- 'Senato della Repubblica, San Pietro in Vaticano, Alfarano/Bonifacio 1590 plan commentary:
  the old apse had gone while part of the old nave continued in use beside the new works; https://antiquorum-habet.senato.it/index.php/section/section_61_it/'
- 'Vatican City State, La Citta del Vaticano nel tempo: medieval palace, Sistine Chapel and
