place: The bridge towards old Saint Peter’s, Rome, from the approved1300 city model
when: Around the Jubilee of1300
picture: 'Edit this exact model view into a lived-in crossing. Preserve the bridge, parapets,
  riverbanks, castle, every building silhouette, camera and lens. Small pilgrims in simple muted
  woollen long garments, cloaks, soft caps and head coverings walk in two opposing streams,
  some towards the basilica and some returning. No posing or close-up faces. The opposing flow
  follows Dante Inferno XVIII28–33; it does not prove a physical divider or an exact crowd size.
  Natural daylight, restrained documentary realism, consistent with the other approved Rome
  imagined pictures.


  Surrounding ground and skyline: Bare ground beside the bridge is the approved medieval riverbank
  and open ground outside the modelled building strips and walls; keep river, bank and land
  distinct. The existing dense house strip belongs to the inhabited town, while open land beyond
  the walls may remain low grass, rough paths and limited vegetation. Do not expand that open
  land into an assertion that all Borgo or the Vatican precinct was empty: the approved 1300
  city includes the inhabited Borgo approach, the medieval Vatican palace and the basilica elsewhere
  in their proper positions, and only elements actually in this camera view may be painted.
  No exact crop, garden boundary or additional house frontage is established here.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No Bernini angels, new St Peter’s dome, colonnade, Via della Conciliazione, modern high
  embankments, modern vehicles, invented buildings or camera change. No uniform badges, physical
  crowd barriers, Dante portrait, printed slogans, text, watermark or archaeological claim about
  an exact number of pilgrims.
sources:
- research/rome_restart_picture_plan.md LM02; research/rome_restart_story_questions.md Q04–Q05
- Dante Inferno XVIII 28–33, opposing Jubilee streams; Jubilee visitor rule 15 days, not a crowd
  count
- Siena Museo Civico, Lorenzetti 1338–39, only a near-period Italian clothing comparison; buildings
  are the Rome model
- 'research/rome06_medieval_survey.md M01/M07/M09/M10; approved 1300 Borgo and riverside model:
  inhabited approaches, period palace and low-information open land are distinct; the image
  is not a cadastral map.'
