place: Piazza Pia, looking along the approved surface connection into Via della Conciliazione
  towards Saint Peter's, Rome
when: Late December 2024, after the pedestrian space opened on 23 December; an ordinary winter
  day, not the opening ceremony
picture: 'Edit the final model reference into an ordinary lived-in pedestrian square. Preserve
  the exact camera, lens, horizon, paving extent, ground levels, every building outline and
  the position and silhouette of Saint Peter''s wherever it is already visible. Place small,
  naturally spaced anonymous adults and families in winter coats walking on the existing surface
  route from Piazza Pia into Via della Conciliazione towards the basilica. Most are seen from
  behind or the side; a few walk the other way. Keep the view open enough to read the continuous
  route. Paint only the fountains, steps or trees already represented in the approved reference;
  do not supply missing project geometry from imagination. Soft winter daylight, natural colours,
  restrained documentary realism and light painterly texture matching the approved Rome living
  pictures. Saint Peter’s uses natural pale cream or warm grey stone and a muted weathered metal
  dome. The lilac or purple projection tint is not its real material.


  Surrounding ground and skyline: This final camera is inside the pedestrian plaza looking west
  towards Via della Conciliazione. The Tiber and its high Lungotevere embankment are behind
  the camera, entirely outside this frame: do not add any river water, shoreline, parapet or
  embankment to this view. The whole lower half is the square''s continuous stone pedestrian
  paving. The two existing low oval rings are the already-modelled fountain basins, and the
  simple angular crowns at both sides are the already-modelled trees; render these exact basins
  and tree locations without adding new project geometry. A modest amount of calm water may
  appear only inside those two fountain basins. The paving runs between the existing buildings
  into the avenue. Preserve every modelled building plane and the distant basilica in their
  exact reference positions. No tunnel portal or new square design is established by the scene.


  Use real, restrained material colours throughout. White, lilac, teal or gold in the reference
  are projection colours, not the place''s materials.'
avoid: No changed viewpoint or landmark size, new buildings, invented tunnel section, new fountains
  or trees, surface traffic across the pedestrian connection, ribbon cutting, officials, pope,
  identifiable real people, posed faces, dense ceremonial procession, 2025 conclave or Jubilee
  event, banners, readable logos, slogans, text, border or watermark. Do not use a later named
  event to populate December 2024 or turn the square's possible capacity into an observed crowd.
  Do not copy the white model or projection tint as real plaster, stone or metal colour. No
  river touching the plaza paving, same-level waterfront, beach, canal along the pedestrian
  avenue, guessed low quay or invented waterline.
