place: The approved schematic pair of floating mills on the Tiber in Rome
when: The Ostrogothic siege of 537 CE
picture: Preserve the reference camera and every visible boat hull, deck, millhouse,
  water wheel, millstone, shaft and bank exactly in place and at the same size. Paint
  the model as working timber boats and a simple timber mechanism, the existing water
  surface as a natural flowing river. Add only a few ordinary workers in plain early
  medieval tunics, one carrying a modest grain sack and another tending or measuring
  grain near the mill. Keep people small and proportionate. The river supplies the
  power; do not make people drive an invented treadmill. Sparse ropes may moor the
  model boats without changing the hull geometry. Natural daylight, restrained documentary
  realism and light painterly texture matching the existing Rome pictures. This is
  a functional schematic, not a discovered mill location or a definitive reconstruction
  of gearing.
avoid: No new buildings, extra ships, changed camera, moved or resized wheels, invented
  complicated gearing, Renaissance clothing, modern concrete river walls, steam machinery,
  motors, fantasy siege crowds, giant sacks, closeup posed faces, text, border or
  watermark. Do not turn present-day land under a model boat into an invented harbour
  panorama; keep only the visible approved river context.
sources:
- FACTS S165 on 537 boat mills; Procopius, Wars V.19, Dewing translation, pages 191–193
- research/rome_restart_boat_mill.md; the approved two-boat/four-millstone/one-wheel
  functional model
- 'Director instruction 2026-11-04: begin only after boats and wheel stand; no image
  over functional change.'
