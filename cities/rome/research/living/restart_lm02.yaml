place: The bridge towards old Saint Peter’s, Rome, from the approved1300 city model
when: Around the Jubilee of1300
picture: Edit this exact model view into a lived-in crossing. Preserve the bridge,
  parapets, riverbanks, castle, every building silhouette, camera and lens. Small
  pilgrims in simple muted woollen long garments, cloaks, soft caps and head coverings
  walk in two opposing streams, some towards the basilica and some returning. No posing
  or close-up faces. The opposing flow follows Dante Inferno XVIII28–33; it does not
  prove a physical divider or an exact crowd size. Natural daylight, restrained documentary
  realism, consistent with the other approved Rome imagined pictures.
avoid: No Bernini angels, new St Peter’s dome, colonnade, Via della Conciliazione,
  modern high embankments, modern vehicles, invented buildings or camera change. No
  uniform badges, physical crowd barriers, Dante portrait, printed slogans, text,
  watermark or archaeological claim about an exact number of pilgrims.
sources:
- research/rome_restart_picture_plan.md LM02; research/rome_restart_story_questions.md
  Q04–Q05
- Dante Inferno XVIII 28–33, opposing Jubilee streams; Jubilee visitor rule 15 days,
  not a crowd count
- Siena Museo Civico, Lorenzetti 1338–39, only a near-period Italian clothing comparison;
  buildings are the Rome model
