place: The demolition edge of the Spina di Borgo in front of Saint Peter's, Rome,
  using the approved 1937 model and its remaining buildings
when: During the 1936-1937 clearance, represented as 1937; no exact moving day is claimed
picture: >-
  Edit the final model reference into one restrained moment of residents carrying
  their belongings away from their old neighbourhood. Preserve the exact camera,
  lens, ground levels, remaining building silhouettes and the cleared space that
  the approved demolition stage actually shows. A small anonymous group of adults
  and a child carries folded bedding, a modest suitcase and a simple wooden chair
  along the existing street at the edge of the clearance. They are walking away,
  not posing for a farewell portrait. Wear plain 1930s civilian coats, skirts,
  trousers and simple caps, without uniforms or distinctive insignia. Loose dust
  and a few small pieces of masonry may lie only on already cleared ground; keep
  the household movement the subject. Buildings still standing remain exactly
  where the reference puts them; do not restore a house which the model has removed.
  Natural colours, legible subdued daylight, restrained documentary realism and
  light painterly texture matching the approved Rome living pictures.
avoid: >-
  No changed camera, restored demolished houses, invented ruined wall silhouettes,
  new doorways, opened interiors or identifiable household address. No completed
  1950 streetlamp row, finished postwar avenue architecture, Piazza Pia 2024 paving,
  modern vehicles, excavators, rubble mountains, modern cartons with logos,
  Mussolini portrait, political pageant, violent confrontation, invented dialogue,
  crying close-up, text, border or watermark. Do not label everyone as poor or
  claim that every family was sent to the same distant estate. Do not depict
  postwar bombing destruction as the 1937 demolition.
sources:
  - >-
    Research/rome09_fascist_sources.md B01 and research/rome09_fascist_facts_proposed.md;
    the existing r08_017-020 narration is unchanged.
  - >-
    Senato della Repubblica, ANTIQUORUM HABET, Via della Conciliazione: work began
    in October 1936; 1937 newspaper exhibits document the clearance; postwar
    completion for the 1950 Holy Year is separate;
    https://antiquorum-habet.senato.it/index.php/poi/via-della-conciliazione/
  - >-
    Laura Moure Cecchini, The Via della Conciliazione (Road of Reconciliation):
    Fascism and the Deurbanization of the Working Class in 1930s Rome, Selva 2
    (Fall 2020), p.206 / PDF p.19, relocation paragraphs and notes 43-48;
    https://selvajournal.org/wp-content/uploads/2020/10/12_Cecchini.pdf
  - >-
    The household, exact possessions and route are anonymous imagined staging,
    not an attested family or address. The scene does not reuse the article's
    third-party photographs or impersonate the resident quoted there.
