place: The unfinished drum of new Saint Peter's in the approved Renaissance Rome
  model; the final film camera decides which construction edge is visible
when: Around 1563-1564, at the drum-only stage reached by Michelangelo's death
picture: >-
  Edit this exact final reference into a working Renaissance building site.
  Preserve the camera, perspective, terrain, every standing building mass, wall,
  column, drum opening and roof outline. Keep the top of the drum conspicuously
  open to the sky: the dome shell has not been built. Give the existing stonework
  a restrained worked-stone surface. At the visible construction edge add only
  modest temporary timber working planks, a simple mast-and-rope lifting rig and
  a few small ordinary workers in plain mid-sixteenth-century tunics, hose and
  soft caps. One worker guides a modest rope-slung stone while another handles
  a rope; any other worker carries a small tool. Keep their scale subordinate to
  the monumental drum. The lifting method follows the mast cranes documented in
  Dosio's near-contemporary view of the same site, without claiming its exact
  machine position or reproducing undocumented gearing. Use natural colours,
  legible daylight, restrained documentary realism and light painterly texture
  matching the approved Rome living pictures. This is one anonymous work moment,
  not a portrait of Michelangelo or the instant of his death.
avoid: >-
  No changed camera or building dimensions, completed dome, partial dome shell,
  lantern, apex ball or cross, completed later nave and facade, Bernini colonnade,
  modern tower crane, steel scaffolding, hard hats, modern safety vests, motor,
  invented giant treadwheel, impossible enormous hanging block, dramatic collapse,
  heroic portrait, text, border or watermark. Do not use Dupérac's ideal completed
  design as a record of the 1564 construction state. Do not transfer a later dome-
  vaulting centering system back to the drum-only site.
sources:
  - FACTS S38 and S174; research/rome_stpeter_completion_timetable.md
  - >-
    Fabbrica di San Pietro, La Cupola: Michelangelo designed and built to the
    drum; the dome was completed after his death in 1588-1590, with the ball and
    cross placed in 1593; https://www.basilicasanpietro.va/it/san-pietro/la-cupola
  - >-
    Giovanni Antonio Dosio, construction view of Saint Peter's, c.1563,
    Uffizi GDSU 91 A; reproduced and identified as drum construction with mast
    cranes in Stefan M. Holzer, ETH Zürich, Von Michelangelo zum Barock (2024),
    PDF p.23 / zero-based page 22;
    https://ethz.ch/content/dam/ethz/special-interest/arch/idb/holzer-dam/Lehrveranstaltungen/Vorlesungen/2024_FS/Bachelor_BaugeschichteII/26_Barock.pdf
  - >-
    The official history establishes the drum-only stage. The near-period drawing
    establishes mast-crane handling, not the exact rigging, worker count, clothing
    or external mast positions in this final model view; these remain restrained
    plausible reconstruction. The source illustration is not included in the film.
