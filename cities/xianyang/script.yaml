# The film's narration: every line, in the order shown (pipeline/script.py). Pictures are in city.yaml.
# Told to the narrator's arc (docs/SCRIPT.md).
# Numbers in digits 0-9; kept as written: reign years (洪武四年, 乾隆十六年, 武德二年, 元鼎三年), names (十五五, 国棉一厂), quotations.
langs: [zh, en]

opening:
  - { id: opening, t: 0.8, zh: "山之南、水之北，古人都叫作阳。", en: "South of a mountain, north of a river: the ancients called both yang." }

nodes:
  name:
    - { id: name_1, zh: "九嵕山在北，渭水在南，两个阳它都占了，所以叫咸阳。", en: "Mountains to the north, the Wei to the south: yang on both sides. Hence Xianyang, all yang." }
  neolithic:
    - { id: neolithic_1, zh: "约6000年前，已经有人在渭河边住了下来。", en: "Some 6,000 years ago, people had already made their homes by the Wei." }
    - { id: neolithic_2, t: 6.2, zh: "他们的村子大概是这样：圆屋围着空场，外面一道壕沟。", en: "Their village looked something like this: round houses around an open ground, a ditch outside." }
  qin:
    - { id: qin_1, zh: "公元前350年，秦孝公把都城迁到这里。", en: "In 350 BCE Duke Xiao of Qin moved his capital here." }
    - { id: qin_shang, zh: "主持营建新都的，是正在变法的商鞅。", en: "The man who built it was Shang Yang, then remaking the state with his reforms." }
    - { id: qin_2, zh: "宫殿筑在渭北的高台上，宫城一圈约2.7公里。", en: "Palaces rose on the terrace north of the Wei, inside a wall some 2.7 km around." }
    - { id: qin_hall6, with: "shot:glide", lead: 0.6, zh: "6号宫殿的台基高11.3米，可能是当年的政务大殿。", en: "Palace No. 6 stood on a terrace 11.3 m high: perhaps the hall where the state was governed." }
    - { id: qin_3, t: 32.2, zh: "台下西南的滩地上，是作坊和民居。", en: "Below, on the flats to the south-west, lay workshops and homes." }
    - { id: qin_4, zh: "考古60多年，至今没有找到它的外城墙。", en: "After 60 years of digging, no outer wall has ever been found." }
    - { id: qin_5, zh: "商鞅统一了秦国的尺、斗和秤，秦一天天强大起来。", en: "Shang Yang gave Qin one set of measures, and Qin grew stronger by the day." }
  empire:
    - { id: empire_1, zh: "100多年后，秦用10年扫平六国。", en: "Over 100 years later, Qin swept away the six states in 10 years." }
    - { id: empire_ying, t: 7.8, zh: "嬴政自称始皇帝，建起中国第一个大一统的帝国。", en: "Ying Zheng named himself the First Emperor, and built China's first unified empire." }
    - { id: empire_one, zh: "文字、车轨、尺和秤，从此全天下一样。", en: "One script, one axle width, one rule and one scale, everywhere." }
    - { id: empire_unity, zh: "此后的2000多年里，无论谁坐天下，都把大一统当作正道；", en: "For the next 2,000 years, whoever held the throne held unity to be the only right way;" }
    - { id: empire_root, zh: "几经分裂，中国一次次重归一统。这份执念，从咸阳开始。", en: "through every division China came back together. That resolve began in Xianyang." }
    - { id: empire_2, zh: "那时，每灭一国，就照它的宫殿在北阪上再造一座；", en: "Back then, for each state it destroyed, it built a copy of that state's palace on the north slope;" }
    - { id: empire_3, zh: "天下富户12万家，也迁到了这里。", en: "and 120,000 of the realm's richest families were moved here." }
    - { id: empire_4, with: "shot:sky", lead: -0.9, zh: "始皇照着星空，排布他的都城：", en: "The First Emperor laid out his capital after the sky:" }
    - { id: empire_5, zh: "咸阳宫是紫宫，天帝住的地方；渭水是天河，横桥是牵牛。", en: "the palace was the Purple Palace, home of the Lord of Heaven; the Wei the Milky Way, the bridge the Herdsman." }
    - { id: empire_6, zh: "复道从阿房跨过渭水连到咸阳：天上的阁道，横过天河。", en: "A covered way ran from Epang across the Wei to Xianyang: the Gallery Road crossing the Milky Way." }
    - { id: empire_wanshi, zh: "他说，帝位要“二世三世至于万世，传之无穷”。", en: "He decreed the throne would pass 'to the second, the third, to ten thousand generations, without end'.", note: "《史记·秦始皇本纪》: a quotation, kept as written" }
  burn:
    - { id: burn_1, zh: "然而，它只撑了15年。", en: "It lasted 15 years." }
    - { id: burn_2, zh: "项羽引兵入咸阳，烧秦宫室。", en: "Xiang Yu took Xianyang and set the palaces alight." }
    - { id: burn_4, zh: "火三月不灭。", en: "The fire burned for three months.", note: "火三月不灭: a quotation (《史记·项羽本纪》), kept as written" }
    - { id: burn_3, t: 16.8, zh: "如今，那里只剩一片田野。", en: "Today only fields remain." }
  han:
    - { id: han_1, zh: "汉朝在渭河南岸另筑长安，都城从此去了对岸。", en: "The Han built Chang'an on the south bank. The capital had crossed the river." }
    - { id: han_changan, with: "pin:p_changan", lead: 7.0, zh: "长安城墙周长约25公里，未央宫在西南角。", en: "Chang'an's walls ran about 25 km; the Weiyang Palace stood in the south-west corner." }
    - { id: han_2, with: "shot:weicheng", lead: 5.0, zh: "北岸的旧咸阳，成了对岸的一座小县城；", en: "Old Xianyang, on the north bank, became a small town across the water;" }
    - { id: han_rename, with: "shot:weicheng", lead: -5.0, zh: "汉武帝元鼎三年，改名渭城。", en: "under Emperor Wu it was renamed Weicheng." }
    - { id: han_3, with: "shot:terrace", lead: 7.4, zh: "北岸的高原，成了帝王的长眠之地。", en: "The plateau on the north bank became the emperors' resting place." }
    - { id: han_4, zh: "原上排着9座西汉帝陵，比河谷高出约90米。", en: "Along it lie 9 Western Han emperors, some 90 m above the valley." }
    - { id: han_5, with: "route:r_wei", zh: "2000多年里，渭河北移4公里，秦都的一部分沉进了河底。", en: "Over 2,000 years the Wei shifted 4 km north, and part of the Qin capital sank beneath it." }
  tang:
    - { id: tang_1, zh: "唐武德二年，咸阳县城设在了杜邮。", en: "Early in the Tang, Xianyang's county town was set up at Duyou." }
    - { id: tang_2, zh: "西去的人，在这里渡过渭河，也在这里告别。", en: "Travellers heading west crossed the Wei here, and here they said goodbye." }
    - { id: tang_3, with: "shot:ferry", lead: 1.5, zh: "王维在此送友：渭城朝雨浥轻尘，客舍青青柳色新。", en: "Here Wang Wei saw a friend off: morning rain in Weicheng settles the dust; the willows by the inn are fresh." }
    - { id: tang_poem, zh: "劝君更尽一杯酒，西出阳关无故人。", en: "Drink one more cup, my friend: west of Yang Pass there will be no old friends.", note: "王维《送元二使安西》: a quotation, kept as written" }
    - { id: tang_4, zh: "如今，渡口成了一座遗址博物馆。", en: "Today the ferry is a site museum." }
  ming:
    - { id: ming_1, zh: "明洪武四年，县城西迁到今天的老城。", en: "Early in the Ming, the town moved west, to what is now the old town." }
    - { id: ming_2, zh: "此后500多年，它一直是一座县城：", en: "For more than 500 years it remained a county town:" }
    - { id: ming_gates, with: "shot:street", zh: "9座城门，文庙、钟楼、凤凰台；", en: "9 gates, a Confucian temple, a bell tower, Phoenix Terrace;" }
    - { id: ming_ferry, with: "pin:p_ferry", zh: "出南门，就是关中八景之一的咸阳古渡。", en: "beyond the south gate, the old ferry, one of the Eight Views of Guanzhong." }
    - { id: ming_3, with: "card:f_town_map", zh: "乾隆十六年的县志，把它画了下来。", en: "In 1751 the county gazetteer drew it like this." }
    - { id: ming_today, with: "card:f_belltower", zh: "老城的钟楼和中山街，今天都还在。", en: "The old town's bell tower and Zhongshan Street are still there today." }
  rail:
    - { id: rail_1, zh: "1936年，陇海铁路修到咸阳，火车来了。", en: "In 1936 the Longhai Railway reached Xianyang. The trains had arrived." }
    - { id: rail_2, with: "shot:station", lead: 7.5, zh: "1949年5月18日，解放军进城，咸阳翻开了新的一页。", en: "On 18 May 1949 the People's Liberation Army entered the city, and a new chapter began." }
    - { id: rail_station, with: "card:f_station", zh: "这座车站，一直用到了今天。", en: "The station is still in use today." }
  mills:
    - { id: mills_1, zh: "20世纪50年代，渭河边建起一座又一座纺织厂。", en: "In the 1950s, one cotton mill after another rose beside the Wei." }
    - { id: mills_first, with: "shot:mill1", zh: "国棉一厂，是新中国在西北建的第一家国有棉纺厂；", en: "Mill No. 1 was the first state cotton mill the new China built in the north-west;" }
    - { id: mills_2, t: 13.5, zh: "1952年开工，5万枚纱锭转了起来。", en: "it opened in 1952, and 50,000 spindles began to turn." }
    - { id: mills_fame, zh: "咸阳，成了闻名全国的纺织城。", en: "Xianyang became known across China as the textile city." }
  m1975:
    - { id: m1975_1, zh: "1975年起，卫星记下了这座城每一年的样子。", en: "From 1975, satellites have recorded the city year by year." }
  m1979:
    - { id: m1979_1, zh: "1979年，陕西彩色显像管总厂在咸阳动工。", en: "In 1979 work began on the Shaanxi Colour Picture Tube Plant." }
    - { id: m1979_2, zh: "这是中国第一个彩色显像管厂，1982年建成投产。", en: "It was China's first colour picture-tube plant, in production by 1982.", later: true }
    - { id: m1979_3, zh: "这里一度是全国最大的彩色显像管生产基地。", en: "For a time it was the largest maker of colour picture tubes in the country." }
  m1983:
    - { id: m1983_1, zh: "1983年9月，咸阳改设地级市；", en: "In September 1983 Xianyang became a prefecture-level city;" }
    - { id: m1983_qindu, zh: "原来的咸阳市，成了秦都区。", en: "the old city became Qindu District, 'the Qin capital'." }
    - { id: m1983_2, zh: "1986年12月，又设渭城区。", en: "In December 1986 came Weicheng District.", later: true }
    - { id: m1983_3, zh: "秦的都城、汉的渭城：古老的名字，又回来了。", en: "The Qin capital, the Han town of Weicheng: the old names had come home." }
  m1991:
    - { id: m1991_1, zh: "1991年9月，西安的机场搬到了咸阳原上。", en: "In September 1991 Xi'an's airport moved out to the Xianyang plateau." }
    - { id: m1991_2, t: 7.2, zh: "1995年，它改名西安咸阳国际机场。", en: "In 1995 it became Xi'an Xianyang International Airport.", later: true }
    - { id: m1991_3, zh: "帝王长眠的高原，成了飞向远方的起点。", en: "The plateau where emperors lie had become a gateway to far places." }
  m1998:
    - { id: m1998_1, zh: "20世纪90年代后，纺织城陷入了低谷。", en: "From the 1990s the textile city fell on hard times." }
    - { id: m1998_2, zh: "1998年前后，国棉一厂、八厂相继改制。", en: "Around 1998 Mills No. 1 and No. 8 were restructured." }
    - { id: m1998_3, zh: "2011年起，老厂陆续迁往城外的新园区。", en: "From 2011 the old mills moved, one by one, to a new park outside the city.", later: true }
    - { id: m1998_4, zh: "国棉一厂的老厂房留了下来，成了纺织工业博物馆。", en: "Mill No. 1's old sheds were kept, and became a museum of the textile industry." }
    - { id: m1998_5, zh: "一代纺织人的青春，就留在了这里。", en: "A generation of mill workers left their youth here." }
  m2005:
    - { id: m2005_1, zh: "2005年7月，渭河在城中拦坝蓄水，有了咸阳湖。", en: "In July 2005 the Wei was dammed in the city, and Xianyang had a lake." }
    - { id: m2005_2, zh: "2017年二期建成，水面扩大到1万多亩。", en: "With the second stage in 2017, the water spread to more than 700 hectares.", later: true }
  m2006:
    - { id: m2006_1, zh: "2002年底，西安、咸阳签下经济一体化协议书。", en: "At the end of 2002 Xi'an and Xianyang signed an agreement to bind their economies together." }
    - { id: m2006_2, zh: "2006年9月16日零时，两市电话并网，共用029区号。", en: "At midnight on 16 September 2006 their telephones joined: one network, one area code, 029." }
    - { id: m2006_3, zh: "这是全国首例。两座城，好像只差一步就能合一。", en: "It was a first in China. The two cities seemed only a step from becoming one." }
  m2011:
    - { id: m2011_1, zh: "2011年，西咸新区设立。", en: "In 2011 Xixian New Area was founded." }
    - { id: m2011_2, zh: "秦都咸阳的遗址，落在了其中的秦汉新城里。", en: "The ruins of the Qin capital fell inside one of its new towns, Qinhan." }
    - { id: m2011_3, zh: "2016年，媒体报道新城的违建正在蚕食遗址保护区。", en: "In 2016 the press reported unauthorised building eating into the protected site.", later: true }
    - { id: m2011_4, zh: "好在2025年，宫殿区约7平方公里建成国家考古遗址公园。", en: "In 2025, at last, some 7 km² of the palace area became a national archaeological park.", later: true }
  m2014:
    - { id: m2014_1, zh: "2014年1月，西咸新区升为国家级新区，规划882平方公里。", en: "In January 2014 Xixian became a state-level new area, 882 km² in plan." }
    - { id: m2014_2, zh: "新城有空港、沣东、秦汉、沣西、泾河，大部分在咸阳境内。", en: "Its new towns: Konggang, Fengdong, Qinhan, Fengxi, Jinghe, most of them in Xianyang." }
    - { id: m2014_3, t: 16.5, zh: "2017年起，它交由西安代管。", en: "From 2017 it was placed under Xi'an.", later: true }
    - { id: m2014_4, zh: "最精华的一块地，从此归西安管了；", en: "Its richest ground was now Xi'an's to run;" }
    - { id: m2014_5, zh: "盼了10多年的两城合一，就此落了空。", en: "and the union hoped for over 10 years came to nothing." }
  m2019:
    - { id: m2019_1, zh: "2019年9月，西安地铁1号线向西延伸6.1公里；", en: "In September 2019 Xi'an Metro Line 1 was extended 6.1 km west;" }
    - { id: m2019_2, zh: "终点沣河森林公园站在秦都区：地铁第一次开进咸阳。", en: "its new end, Fenghe Forest Park, lies in Qindu District: for the first time, the metro reached Xianyang." }
  m2023:
    - { id: m2023_2, zh: "2023年9月21日，1号线开到咸阳西站，两城由地铁相连。", en: "On 21 September 2023 Line 1 reached Xianyang West: the two cities were joined by metro." }
    - { id: m2023_3, zh: "同一天，咸阳渭河高新大桥通车。", en: "The same day the Weihe Gaoxin Bridge opened." }
  today:
    - { id: today_1, zh: "2026年，“十五五”开局，两市之间相连的道路已有41条。", en: "2026: a new five-year plan begins, and 41 roads now link the two cities." }
    - { id: today_2, t: 8.4, zh: "咸阳高新区以面板和基板玻璃为龙头，打造“西部屏谷”。", en: "Its high-tech zone, led by display panels and substrate glass, is building a 'Screen Valley of the West'." }
    - { id: today_3, t: 16.8, zh: "两座城没有合并；可从天上看，它们正长成同一座城，", en: "The two cities never merged; yet from above they are growing into one," }
    - { id: today_4, zh: "就像2000多年前，渭水两岸本是一座咸阳。", en: "just as, 2,000 years ago, both banks of the Wei were one Xianyang." }
    - { id: today_5, t: 30.6, zh: "它在这片土地上搬了几次家，每一处都还留着痕迹。", en: "It moved across this land several times, and every place still bears its mark." }
    - { id: today_6, zh: "2400年，它辉煌过，焚毁过，又一次次从头再来。", en: "In 2,400 years it has shone, it has burned, and again and again it has begun anew." }
    - { id: today_7, zh: "这座城，还在生长。", en: "And the city is still growing." }
    - { pause: 4.0, why: "the last line settles before the lights go out" }

quiet:
  burn: [[12.5, 16.5, "the fire burns on: silence"]]
