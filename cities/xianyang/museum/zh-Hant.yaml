- zh: 咸阳宫一号宫殿
  zh-Hant: 咸陽宮一號宮殿
- zh: 战国中晚期始建，此后多次维修、改建
  zh-Hant: 戰國中晚期始建，此後多次維修、改建
- zh: 秦都咸阳宫城的北部，咸阳原的原边上（今牛羊沟西侧）
  zh-Hant: 秦都咸陽宮城的北部，咸陽原的原邊上（今牛羊溝西側）
- zh: 这是什么
  zh-Hant: 這是什麼
- zh: 一号宫殿是秦都咸阳宫城里的一座高台宫殿。先用夯土筑起一座高约 6 米的大台，台的里面、台的上面都盖着房子，台顶正中是一座两层楼的主殿。整组宫殿东西长约 177 米，左右两半对称，平面像一个「凹」字。考古学家推断它始建于战国中晚期，以后多次维修、改建。公元前 206 年，项羽进咸阳，「烧秦宫室，火三月不灭」。
  zh-Hant: 一號宮殿是秦都咸陽宮城裡的一座高臺宮殿。先用夯土築起一座高約 6 米的大臺，臺的裡面、臺的上面都蓋著房子，臺頂正中是一座兩層樓的主殿。整組宮殿東西長約 177 米，左右兩半對稱，平面像一個「凹」字。考古學家推斷它始建於戰國中晚期，以後多次維修、改建。西元前 206 年，項羽進咸陽，「燒秦宮室，火三月不滅」。
- zh: 我们怎么知道
  zh-Hant: 我們怎麼知道
- zh: 秦咸阳宫的考古从 1973 年开始。一号宫殿的台基被后来冲出的牛羊沟从中间切开：沟东已成平地，沟西还剩一段长 31 米、高 6 米的夯土台。考古队只清理了西半座：西半座台约东西 60、南北 45 米，台里南面 5 间、北面 2 间房，台顶主殿约 13.4 × 12 米，地面涂成朱红色，房里有壁画碎片、壁炉、陶地漏和排水管。最早的发掘简报登在《文物》1976 年第 11 期，我们没能读到原文；这里的数字来自转述它的论文和文章。台顶房间的布局、屋顶的样子和两半之间的飞阁，都按杨鸿勋的复原推测。
  zh-Hant: 秦咸陽宮的考古從 1973 年開始。一號宮殿的臺基被後來衝出的牛羊溝從中間切開：溝東已成平地，溝西還剩一段長 31 米、高 6 米的夯土臺。考古隊只清理了西半座：西半座臺約東西 60、南北 45 米，臺裡南面 5 間、北面 2 間房，臺頂主殿約 13.4 × 12 米，地面塗成硃紅色，房裡有壁畫碎片、壁爐、陶地漏和排水管。最早的發掘簡報登在《文物》1976 年第 11 期，我們沒能讀到原文；這裡的數字來自轉述它的論文和文章。臺頂房間的佈局、屋頂的樣子和兩半之間的飛閣，都按楊鴻勳的復原推測。
- zh: 这座模型
  zh-Hant: 這座模型
- zh: 白模由程序按上面的尺寸生成，高度照原样，没有放大。有考古或文献依据的部分和按复原推测的部分可以分开看：打开「有据 / 推测」，再点任何一个构件，就能看到史料怎么说。地面画成平的：今天切开遗址的牛羊沟，是秦亡以后才冲出来的。
  zh-Hant: 白模由程式按上面的尺寸生成，高度照原樣，沒有放大。有考古或文獻依據的部分和按復原推測的部分可以分開看：開啟「有據 / 推測」，再點任何一個構件，就能看到史料怎麼說。地面畫成平的：今天切開遺址的牛羊溝，是秦亡以後才衝出來的。
- zh: 宫里的日子，从遗址里的东西看得出几分。台南一排房间，西边四间是卧室，出土了壁画残片和陶纺轮，可能住着宫中的女子；最东一间有取暖的壁炉、大陶地漏和排水管，应是浴室，角落里还挖了储存食物的窖穴。宫里有让肉不容易坏的冷藏窖。宫室的地面先铺红烧土、抹粗草泥和细糠泥，再用卵石磨光，最后涂一层朱砂。屋檐下的瓦当，九成以上是云纹。
  zh-Hant: 宮裡的日子，從遺址裡的東西看得出幾分。臺南一排房間，西邊四間是臥室，出土了壁畫殘片和陶紡輪，可能住著宮中的女子；最東一間有取暖的壁爐、大陶地漏和排水管，應是浴室，角落裡還挖了儲存食物的窖穴。宮裡有讓肉不容易壞的冷藏窖。宮室的地面先鋪紅燒土、抹粗草泥和細糠泥，再用卵石磨光，最後塗一層硃砂。屋簷下的瓦當，九成以上是雲紋。
