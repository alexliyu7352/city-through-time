- zh: 屋顶
  zh-Hant: 屋頂
- zh: 屋顶没有留下来，文字里也没写屋顶是什么式样。出土的瓦当多是云纹圆瓦当。模型的屋顶式样是照杨鸿勋复原图推测的。
  zh-Hant: 屋頂沒有留下來，文字裡也沒寫屋頂是什麼式樣。出土的瓦當多是雲紋圓瓦當。模型的屋頂式樣是照楊鴻勳復原圖推測的。
- zh: 东半座
  zh-Hant: 東半座
- zh: 整组宫殿跨在今天牛羊沟的两侧，左右对称，但只清理了西半部；沟东今天已是平地。模型把东半座画成西半座的镜像。
  zh-Hant: 整組宮殿跨在今天牛羊溝的兩側，左右對稱，但只清理了西半部；溝東今天已是平地。模型把東半座畫成西半座的鏡像。
- zh: 夯土台基
  zh-Hant: 夯土臺基
- zh: 台高 6 米。西半座台约东西 60、南北 45 米，平面略呈 L 形；宫殿先从地面以下整体夯土，深可达 4 米。模型把台画成长方形，L 形的缺角没有画出来。
  zh-Hant: 臺高 6 米。西半座臺約東西 60、南北 45 米，平面略呈 L 形；宮殿先從地面以下整體夯土，深可達 4 米。模型把臺畫成長方形，L 形的缺角沒有畫出來。
- zh: 台里的房间
  zh-Hant: 臺裡的房間
- zh: 下层的房间都在台体里面：南侧 5 间，北侧 2 间。南排西边 4 间是卧室；最东一间有壁炉、陶地漏和排水管，应是浴室。模型只画出房门，门的位置和大小是推测的。
  zh-Hant: 下層的房間都在臺體裡面：南側 5 間，北側 2 間。南排西邊 4 間是臥室；最東一間有壁爐、陶地漏和排水管，應是浴室。模型只畫出房門，門的位置和大小是推測的。
- zh: 回廊
  zh-Hant: 迴廊
- zh: 台基四周修有回廊，环绕全台，廊外沿铺着用方砖镶边的卵石散水。也有文章说回廊只在南、西、北三面；模型按四面画。廊顶的样子是推测的。
  zh-Hant: 臺基四周修有迴廊，環繞全臺，廊外沿鋪著用方磚鑲邊的卵石散水。也有文章說迴廊只在南、西、北三面；模型按四面畫。廊頂的樣子是推測的。
- zh: 台顶与露台
  zh-Hant: 臺頂與露臺
- zh: 主殿前面有露台。杨鸿勋的复原在台面南部留出宽大的露台。台边的矮墙是推测的。
  zh-Hant: 主殿前面有露臺。楊鴻勳的復原在臺面南部留出寬大的露臺。臺邊的矮牆是推測的。
- zh: 台顶四周的房间
  zh-Hant: 臺頂四周的房間
- zh: 文章说主殿东边连着一间有壁炉的小房间，西边有慢道上楼。杨鸿勋复原：台顶西部 2 间、东南角 1 间、东北部是转角敞厅，四周绕着回廊。模型画成围着主殿的一圈单层房屋，具体布局是推测的。
  zh-Hant: 文章說主殿東邊連著一間有壁爐的小房間，西邊有慢道上樓。楊鴻勳復原：臺頂西部 2 間、東南角 1 間、東北部是轉角敞廳，四周繞著迴廊。模型畫成圍著主殿的一圈單層房屋，具體佈局是推測的。
- zh: 主殿
  zh-Hant: 主殿
- zh: 台基中央的主殿东西 13.4 米、南北 12 米，南、北墙各开两道门，东墙一道；正中有一根直径 60 厘米的「都柱」，地面涂成朱红色，殿上还有一层楼。模型的主殿连同四周的走廊一起画，比 13.4 × 12 米的殿室大。
  zh-Hant: 臺基中央的主殿東西 13.4 米、南北 12 米，南、北牆各開兩道門，東牆一道；正中有一根直徑 60 公分的「都柱」，地面塗成硃紅色，殿上還有一層樓。模型的主殿連同四周的走廊一起畫，比 13.4 × 12 米的殿室大。
- zh: 台阶
  zh-Hant: 臺階
- zh: 文章说楼梯设在东西两端，又说西侧有慢道上楼；踏步用大型空心砖。模型在台的南面画了一道台阶，位置是推测的。
  zh-Hant: 文章說樓梯設在東西兩端，又說西側有慢道上樓；踏步用大型空心磚。模型在臺的南面畫了一道臺階，位置是推測的。
- zh: 飞阁
  zh-Hant: 飛閣
- zh: 复原研究认为，两座高台之间有一道跨过谷道的飞阁把它们连成一体。飞阁的长短、高低和下面的墩子都是推测的。
  zh-Hant: 復原研究認為，兩座高臺之間有一道跨過谷道的飛閣把它們連成一體。飛閣的長短、高低和下面的墩子都是推測的。
