    # ---- 1975-2026: one year line. The city grows in the background (GHSL from 1975, CMAB from 1987, both estimates) while the
    # camera tours the moments that made it (docs/STAGING.md 9i): it flies from one to the next as the counter runs (at most a
    # year a second), and the counter holds while a moment is told. Sources: research/modern_a.md, modern_b.md, xianyang_research.md.
    - id: m1975
      mood: { feel: calm, level: 1 }   # the satellites begin
      years: [1975, 1975]
      dur: 11.2   # one line; its source note needs 9.9 s on screen (readcheck)
      label: { zh: 起点, en: The starting point }
      col: '#2f98ff'
      tint: 0
      night: 0.3
      reset: { year: 1975.5 }   # inside this node's ring the city goes back to what stood by 1975 (GHSL-dated), then grows year by year
      tour: { ll: [108.715, 34.343], d: 0.95, el: 40 }
      readout: { label: "1975 年起：卫星资料里的咸阳", note: "GHSL 建成体积（1975 起，100 m · 5 年）· CMAB 建筑年份（1987 起）· 北塬等 CMAB 缺漏处：Overture 建筑轮廓 · 均为估算" }
      grow:
        at: 0
        bands: [{ t: {year: 1976}, spread: 8.0 }, { t: {year: 1988}, spread: 3.0 }, { t: {year: 1996}, spread: 3.0 }, { t: {year: 2006}, spread: 2.6 }, { t: {year: 2013}, spread: 2.0 }, { t: {year: 2019}, spread: 1.6 }]
        dim: { t: {year: 2014}, to: 0.5 }
        mono: true   # every building rises white with a flash; no colour per year band
        warm: 4.0    # a new building stays warm for 4 s after it rises (the moment the counter reaches its year), then white
        change: ghsl   # the first layer dated 1975-1987, rebuilt-taller buildings, counters (pipeline/ghsl_change.py)
        counters_until: today
        counters_note: "CMAB 首次出现年份 · GHSL 建成体积 · 估算 · 资料至 2020"
    # ---- the stops: turning points of the city itself (its status, its industry, its links, its rise and decline, its joining
