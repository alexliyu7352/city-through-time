# 咸阳 · first pass (box and scale under test)
slug: xianyang
name: { zh: 咸阳, en: Xianyang }
box: [108.60, 34.245, 108.94, 34.44]     # west, south, east, north (WGS84): the old town, the Qin palace site, the Han tombs on the plateau, Han Chang'an and Xi'an's north-west across the river
scale: 10000                              # 1:10000 -> 1 model metre = 10 km
raw:
  cmab: cmab/shaanxi                       # under this machine's raw root (local/config.json raw; pipeline/local.py)
buildings:
  source: cmab
  fill: overture_ghsl   # where CMAB has no buildings (the northern plateau, villages): Overture footprints, years from GHSL (estimates)
  fill_gap_m: 100
  simplify_m: 1.0
  min_area_m2: 15
  exaggeration: 4.0          # today's heights x4 so the massing reads at 1:10000 (the plate: terrain.exaggeration; era cities: city.exaggeration)
# CMAB age = first year the centroid shows in GAIA impervious surface (1985-2018); the oldest band is "already there by 1987"
bands:
  - { lo: 1900, hi: 1988, zh: 1987 年已有, en: by 1987 }
  - { lo: 1988, hi: 1996, zh: 1988–1995, en: 1988–1995 }
  - { lo: 1996, hi: 2006, zh: 1996–2005, en: 1996–2005 }
  - { lo: 2006, hi: 2013, zh: 2006–2012, en: 2006–2012 }
  - { lo: 2013, hi: 2019, zh: 2013–2018, en: 2013–2018 }
  - { lo: 2019, hi: 2100, zh: 2018 年后, en: after 2018 }
landmarks:
  - { id: qin_site, lon: 108.85753, lat: 34.41435, snap_to_building: false }          # 秦咸阳城遗址 (OSM node)
  - { id: qin_fuku, lon: 108.84955, lat: 34.41401, snap_to_building: false }          # 秦咸阳宫府库遗址 (OSM way centre)
  - { id: qinhan_museum, lon: 108.85953, lat: 34.40805, snap_to_building: false }     # 陕西历史博物馆秦汉馆
  - { id: old_town, lon: 108.72000, lat: 34.33583, snap_to_building: false }          # 咸阳博物院 / 明文庙, 中山街
  - { id: ferry, lon: 108.72102, lat: 34.32914, snap_to_building: false }             # 咸阳古渡廊桥
  - { id: station, lon: 108.73012, lat: 34.34570, snap_to_building: false }           # 咸阳站 (1936)
  - { id: lake, lon: 108.71863, lat: 34.32977, snap_to_building: false }              # 咸阳湖
  - { id: airport, lon: 108.76003, lat: 34.44236, snap_to_building: false }           # 西安咸阳国际机场 (aerodrome centroid)
  - { id: airport_t, lon: 108.7517, lat: 34.4472, snap_to_building: false }           # terminal area (wiki infobox)
  - { id: qinhan_city, lon: 108.84414, lat: 34.39267, snap_to_building: false }       # 秦汉新城 (place node)
  - { id: metro_west, lon: 108.65813, lat: 34.33531, snap_to_building: false }        # 咸阳西站 (metro line 1 phase 3 terminus)
  - { id: yinjiacun, lon: 108.60, lat: 34.32, snap_to_building: false }               # 尹家村遗址 [EST: "咸阳市以西约10公里, 渭河岸边"]
  - { id: east_edge, lon: 108.879, lat: 34.44, snap_to_building: false }              # plate edge pointer toward 汉阳陵 (6 km east, off the plate)
# earthworks on the model: real mounds, base from the OpenStreetMap outline, height from FACTS.md (h_m); top_ratio = flat top / base
mounds:
  - { id: changling, osm: 汉高祖长陵, h_m: 30, top_ratio: .4, year: -195, zh: 汉长陵, en: Changling }
  - { id: anling, osm: 汉惠帝安陵, h_m: 30, top_ratio: .4, year: -188, zh: 汉安陵, en: Anling }
  - { id: pingling, osm: 平陵, h_m: 33, top_ratio: .4, year: -74, zh: 汉平陵, en: Pingling }
  - { id: yanling, osm: 汉成帝延陵, h_m: 30, top_ratio: .4, year: -7, zh: 汉延陵, en: Yanling }
  - { id: zhou_wen, osm: 周文王陵, h_m: 12, top_ratio: .4, year: -300, zh: 周陵（文王陵）, en: Zhou tombs }
  - { id: zhou_wu, osm: 周武王陵, h_m: 12, top_ratio: .4, year: -300, zh: 周陵（武王陵）, en: Zhou tombs }
  - { id: shunling, osm: 顺陵封土堆, h_m: 12.6, top_ratio: .4, year: 690, zh: 唐顺陵, en: Shunling }

# ================================================================ THE FILM v4 — whole period cities (pipeline/citygen.py); copy written as one script
terrain: { enabled: true, exaggeration: 3.0,   # x3: at x6 every foundation on the 北阪 stands as tall as its house; terrain.py and clipcheck put the period cities' limit at about x4.5
           context: { box: [108.36, 34.245, 108.86, 34.72], res_m: 60, exaggeration_far: 2.5, blend_km: 6,
                     shade: { az: 250, el: 22, k: 0.8 } } }   # the land beyond the plate to the north-west, for 九嵕山 (34.6285, 108.4835: the name's mountain); 60 m so its ridges show, a low west-south-west sun so they read
film:
  lang: [zh, en]
  yearFmt: zh
  identity: { l1: "咸阳 · 1:10000", l2: "{stats.centre_wgs[1]:.3f}°N  {stats.centre_wgs[0]:.3f}°E  ·  渭河两岸 {plate_km[0]:.0f} × {plate_km[1]:.0f} km" }
  light: { base: 0.62 }
  rise: { sinkDur: 2.8, ghost: 1.0 }   # today's white city stays whole all film (the reference's grammar); eras replace their own regions
  drift: 0.6
  wave_dur: 4.5              # a node's colour crosses the plate as a ring of light in this many seconds
  era_look: { dim: 0.5, glow: 1.0, edge: 1.0, line: 1.0, light_m: 45, halo_m: 14, edge_m: 150 }   # while a period city stands: today's city dims; a thin neon line on its edge lights what stands within ~45 m of it
  emblem: none   # no emblem: none stages well enough on the white model to earn its place (docs/SCRIPT.md)
  satellite_source: sentinel   # Copernicus Sentinel-2 (CC-compatible); 'hr' (Esri World Imagery, pipeline/imagery_tiles.py) is for internal tests only, never published
  copy: { keep: ['十五五', '三月不灭', '国棉一厂', '国棉七厂', '洪武四年', '乾隆十六年', '武德二年', '元鼎三年'] }   # names, a quotation and reign years kept as written (pipeline/copylint.py)
  sfx: [relay, lamp, burn, lights]   # the sound effects kept beside the score: the lamp coming on, the burning, the lights going out
  music:   # the score (MUSIC.md: prompts, takes, licence; tools/music.py makes the candidates, audio/lay.py lays them): a cue starts
           # at its node (the first at the film's start) and runs to the next; take: the chosen candidate <wording>-<seed>, unset = silent
    loop: M01   # after the film the preview plays the opening on in a loop: the drone, the heartbeat and the xun, the city's oldest sound
    cues:
      - { id: M01, node: name, take: 2-2, fade_in: 3.0 }   # (from the dark before the lamp)
      - { id: M02, node: qin, take: 1-1, offset: 0 }   # (from its first stroke, on the node: laid later it would open on a 2 s rest; its climax runs on into M03, generated on it)
      - { id: M03, node: burn, continue: M02, take: 2-2 }   # (the same drums fall apart, generated on M02; 2-2 thins out toward its end, 2-1 and 2-3 stay at the climax)
      - { id: M04, node: han, take: 2-3 }   # (2-1 rises out of silence: a hole after the burning)   # Han and Tang in one: the two greatest dynasties, one mood
      - { id: M05, node: ming, take: 1-1, offset: 2.52 }   # (offset pinned: M06 was generated on M05 laid so)
      - { id: M06, node: rail, take: 6-1 }   # (wording 2 kept the old town's sound; 3-1 'goes mad from 53 s'; 4-x 'the wrong feeling'; 6-1 rises 8 dB to its close, as the narration does)
      - { id: M07, node: m1975, take: 1-2 }   # (1-1: its rhythm loses its footing 36-68 s in)
      - { id: M08, node: m1998, take: 1-1 }
      - { id: M09, node: m2005, take: 1-1 }
      - { id: M10, node: m2014, take: 1-2 }   # (1-1 has a gap at 17 s)
      - { id: M11, node: m2019, take: 1-1 }
  fonts:   # one font per job, by family name and weight; looked up in fonts/ (python -I pipeline/fonts.py list .; add one: fonts.py add . "<Family>")
    zh_strong:      { family: Noto Serif SC, weight: 600 }        # Chinese subtitles, chapter names, tags, place names, the end title
    zh:             { family: Noto Serif SC, weight: 300 }        # readout labels, the timeline label, small Chinese text
    zh_sans:        { family: Noto Sans SC, weight: 300 }         # end-card lines
    zh_sans_strong: { family: Noto Sans SC, weight: 500 }         # the sky plan's labels
    numeral:        { family: Cormorant Garamond, weight: 300 }   # big numerals (the year, the counters), the English title
    numeral_strong: { family: Cormorant Garamond, weight: 500 }   # the timeline year, measured heights
    en:             { family: Inter Tight, weight: 300 }          # English subtitles and captions (200 vanished over bright buildings: tested)
    en_strong:      { family: Inter Tight, weight: 400 }          # English under tags and labels, measurements
    mono:           { family: IBM Plex Mono, weight: 400 }        # notes, credits, the locator
  palette:
    epochs: ['#ffb070', '#e8553a', '#c9a7ff', '#7fe0c8', '#cfe9ff', '#ffa13d', '#ffa13d', '#ffffff']
    bands: ['#ffb070', '#2a63ff', '#2f98ff', '#6fdcff', '#b9f1ff', '#eefcff']
