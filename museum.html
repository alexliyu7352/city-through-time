<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一城春秋 · A City Through Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Noto+Serif+SC:wght@500;700&display=swap">
<script>
// three.js: the pinned copy in node_modules when served from this machine (tools/museum.mjs, the preview), the same version from a CDN anywhere else
{ const t = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? './node_modules/three/' : 'https://cdn.jsdelivr.net/npm/three@0.170.0/';
  const m = document.createElement('script'); m.type = 'importmap';
  m.textContent = JSON.stringify({ imports: { three: t + 'build/three.module.js', 'three/addons/': t + 'examples/jsm/' } });
  document.currentScript.after(m); }

<style>
/* A museum page (site/museum.js; docs/MUSEUM.md): the building in a bright, neutral exhibition room, its label beside it. The
   room is a cool light grey so the white model and the pictures carry the colour; the one strong colour is cinnabar (the red
   of the palace floors), for what can be pressed. The model's two tones: loess (rests on sources) and slate (estimated). */
:root {
  --room: #e6e9eb; --paper: #f8f8f6; --ink: #1d2430; --ink-2: #4c5562; --ink-3: #6b7380; --line: rgb(29 36 48 / .13);
  --cinnabar: #a3361f; --cinnabar-2: #8a2b18; --loess: #d4ac74; --slate: #8aa1c1;
  --display: "Bodoni Moda", "Noto Serif SC", Georgia, serif; --zh-display: "Noto Serif SC", "Songti SC", serif;
  --text: "Albert Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --col: 440px; --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.7 var(--text); -webkit-font-smoothing: antialiased; }
:lang(zh-Hans) body { line-height: 1.85; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 3px; border-radius: 4px; }
img { display: block; max-width: 100%; }

.mu { display: grid; grid-template-columns: 1fr var(--col); min-height: 100svh; }
.hall { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--room); }
.stage { position: absolute; inset: 0; touch-action: none; }
.stage canvas { display: block; }
#first { position: absolute; max-width: none; pointer-events: none; transition: opacity .7s var(--ease); }
#first.gone { opacity: 0; }
#first.band { -webkit-mask-image: linear-gradient(transparent, #000 3.5%, #000 96.5%, transparent); mask-image: linear-gradient(transparent, #000 3.5%, #000 96.5%, transparent); }

/* over the stage: the way back and the languages; the AI label; the controls and the part's note at the foot */
.top { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: 16px; padding: max(14px, env(safe-area-inset-top)) 18px 0; pointer-events: none; }
.top > * { pointer-events: auto; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: rgb(248 248 246 / .82);
  backdrop-filter: blur(10px); text-decoration: none; font-size: 14px; color: var(--ink-2); }
.back:hover { color: var(--ink); }
.back b { font: 700 15px/1 var(--zh-display); letter-spacing: .12em; color: var(--ink); }
.langs { margin-left: auto; display: flex; border-radius: 999px; background: rgb(248 248 246 / .82); backdrop-filter: blur(10px); padding: 3px; }
.langs button { min-width: 44px; min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 14px; color: var(--ink-3); }
.langs button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
.ai { position: absolute; left: 18px; top: calc(max(14px, env(safe-area-inset-top)) + 52px); margin: 0; display: flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 12px; border-radius: 10px; background: rgb(29 36 48 / .78); color: #f4f2ee; font-size: 13.5px; line-height: 1.35;
  backdrop-filter: blur(8px); transition: opacity .35s var(--ease); max-width: calc(100% - 36px); }
.ai[hidden] { display: flex; opacity: 0; pointer-events: none; }
.ai i { width: 8px; height: 8px; border-radius: 50%; background: #e0684f; flex: none; }
.ai small { color: rgb(244 242 238 / .7); font-size: 12.5px; }
.dock { position: absolute; inset: auto 0 0 0; padding: 0 18px max(16px, env(safe-area-inset-bottom)); display: grid; gap: 10px; justify-items: start; pointer-events: none; }
.dock > * { pointer-events: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sw { display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 16px 0 10px; border-radius: 999px; background: rgb(248 248 246 / .9);
  backdrop-filter: blur(10px); font-size: 14.5px; cursor: pointer; box-shadow: 0 1px 0 rgb(29 36 48 / .06); }
.sw input { appearance: none; width: 34px; height: 20px; margin: 0; border-radius: 999px; background: #c5cad0; position: relative; transition: background .2s; cursor: pointer; }
.sw input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.sw input:checked { background: var(--cinnabar); }
.sw input:checked::after { transform: translateX(14px); }
.legend { display: inline-flex; gap: 14px; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 999px; background: rgb(248 248 246 / .9); backdrop-filter: blur(10px); font-size: 13.5px; color: var(--ink-2); }
.legend[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.chip::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); box-shadow: inset 0 0 0 1px rgb(29 36 48 / .15); }
.chip.sourced { --c: var(--loess); } .chip.estimated { --c: var(--slate); }
.fly { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--cinnabar); color: #fff; font-size: 14.5px; font-weight: 500; }
.fly:hover { background: var(--cinnabar-2); }
.fly[hidden] { display: none; }
.fly svg { width: 18px; height: 18px; }
.hint { margin: 0; font-size: 13px; color: var(--ink-3); text-shadow: 0 1px 0 rgb(255 255 255 / .6); }
.wait { position: absolute; left: 50%; bottom: 96px; translate: -50% 0; margin: 0; padding: 6px 14px; border-radius: 999px; background: rgb(248 248 246 / .9); font-size: 13px; color: var(--ink-2); }
.wait[hidden] { display: none; }
.part { width: min(380px, 100%); padding: 16px 18px 14px; border-radius: 14px; background: var(--paper); box-shadow: 0 10px 30px rgb(29 36 48 / .16), 0 0 0 1px var(--line); position: relative; }
.part[hidden] { display: none; }
.part h3 { margin: 0 34px 6px 0; font: 600 18px/1.35 var(--text); }
:lang(zh-Hans) .part h3 { font-family: var(--zh-display); font-weight: 700; letter-spacing: .04em; }
.part p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
.part .cite { font-size: 13px; color: var(--ink-3); }
.part .x { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-3); }
.part .x:hover { background: rgb(29 36 48 / .06); color: var(--ink); }

/* the label: a printed museum label, the name large */
.label { padding: 56px 40px 64px; border-left: 1px solid var(--line); background: var(--paper); }
.label h1 { margin: 0; font: 700 40px/1.2 var(--zh-display); letter-spacing: .06em; text-wrap: balance; }
.label:lang(en) h1 { font: 500 38px/1.12 var(--display); letter-spacing: 0; }
.label .alt { margin: 8px 0 0; font: 500 17px/1.4 var(--display); color: var(--ink-2); }
.label:lang(en) .alt { font: 700 16px/1.4 var(--zh-display); letter-spacing: .08em; }
.facts { margin: 26px 0 0; padding: 16px 0 0; border-top: 2px solid var(--ink); display: grid; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.facts p { margin: 0; }
.label h2 { margin: 40px 0 10px; font: 600 20px/1.35 var(--text); }
.label:lang(zh-Hans) h2 { font: 700 21px/1.4 var(--zh-display); letter-spacing: .06em; }
.label p.t { margin: 0; max-width: 34em; }
.label:lang(zh-Hans) p.t { max-width: 26em; }
.cite { margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }
.cite a { color: var(--ink-3); text-underline-offset: 3px; text-decoration-color: rgb(29 36 48 / .3); }
.cite a:hover { color: var(--cinnabar); }
figure { margin: 22px 0 0; }
figure img { width: 100%; border-radius: 6px; background: var(--room); }
figcaption { margin-top: 8px; font-size: 14px; line-height: 1.5; }
figcaption small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.parts { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
.parts li { border-bottom: 1px solid var(--line); }
.parts button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; text-align: left; font-size: 15px; }
.parts button:hover, .parts button[aria-pressed=true] { color: var(--cinnabar); }
.parts .chip { font-size: 13px; color: var(--ink-3); }
.sources { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.sources b { display: block; color: var(--ink); font-weight: 600; }
.sources li:target { background: rgb(163 54 31 / .07); outline: 6px solid rgb(163 54 31 / .07); border-radius: 2px; }
.sources a { word-break: break-all; color: var(--ink-3); }
.foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
.foot a { color: var(--ink-2); }

@media (max-width: 860px) {
  .mu { display: block; }
  .hall { position: relative; height: min(66svh, 640px); }
  .label { border-left: 0; padding: 30px 20px 48px; }
  .label h1 { font-size: 32px; } .label:lang(en) h1 { font-size: 30px; }
  .hint { display: none; }
  .dock { padding: 0 12px max(12px, env(safe-area-inset-bottom)); gap: 8px; }
  .part { width: 100%; max-height: 38svh; overflow: auto; }
  .ai { left: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 50px); }
  .top { padding: max(12px, env(safe-area-inset-top)) 12px 0; }
}
/* the reference still (tools/living.py ref): the model alone, the whole window */
.clean .mu { display: block; } .clean .hall { height: 100vh; } .clean .label, .clean .top, .clean .ai, .clean .dock, .clean .wait, .clean #first { display: none; }
@media (prefers-reduced-motion: reduce) { #first, .ai, .sw input, .sw input::after { transition: none; } }
</style>
</head><body>
<div class="mu">
  <section class="hall" id="hall">
    <div class="stage" id="stage" role="img"><img id="first" alt=""></div>
    <header class="top"><a class="back" id="back"><b>一城春秋</b><span id="back-text"></span></a>
      <nav class="langs" aria-label="Language"><button type="button" data-lang="zh" lang="zh-Hans">中文</button><button type="button" data-lang="en" lang="en">EN</button></nav></header>
    <p class="ai" id="ai" hidden role="status"><i aria-hidden="true"></i><span><span id="ai-text"></span><br><small id="ai-vp"></small></span></p>
    <p class="wait" id="wait" role="status"></p>
    <div class="dock">
      <div class="part" id="part" hidden role="dialog" aria-labelledby="part-name"><button class="x" id="part-x" type="button"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11m0-11-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <h3 id="part-name"></h3><span class="chip" id="part-status"></span><p id="part-note"></p><p class="cite" id="part-cite"></p></div>
      <div class="bar">
        <label class="sw"><input type="checkbox" id="tones"><span id="tones-text"></span></label>
        <span class="legend" id="legend" hidden><span class="chip sourced" id="lg-s"></span><span class="chip estimated" id="lg-e"></span></span>
        <button class="fly" id="fly" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h3l1.6-2.2h6.8L17 7.5h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12.8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span id="fly-text"></span></button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
  </section>
  <article class="label" id="label"></article>
</div>
<script type="module" src="site/museum.js"></script>
</body></html>
