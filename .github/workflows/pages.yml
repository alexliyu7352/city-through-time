# The site on GitHub Pages: on every push to main, check each city's entry.json (tools/registry.mjs), build the site from them
# (tools/site.mjs: cities.json, the entry page and every city's page in each language, the sitemap) and publish it.
# (Settings, Pages: the source has to be "GitHub Actions"; the custom domain is set there too.)
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the entries
        run: node tools/registry.mjs --check
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        run: node tools/site.mjs --copy --out _site --origin "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
