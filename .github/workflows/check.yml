# A pull request: every entry.json must be complete and valid, and a city brings text only (tools/registry.mjs --check). A push to main:
# the entries checked as the site's build reads them (the site is built and served by Cloudflare Pages, connected to the repository).
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the entries and the files under cities/
        run: node tools/registry.mjs --check ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}
