<header class="bar" id="bar">
  <a class="logo" href="./"><span class="logo-mark" lang="zh-Hant">一城春秋</span><span class="logo-word" data-t="tagline">A City Through Time</span></a>
  <nav class="nav" aria-label="Sections"><a href="#collection" data-t="navCollection"></a><a href="#make" data-t="navMake"></a></nav>
  <div class="tools">
    <div class="search" role="search">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <kbd aria-hidden="true">/</kbd>
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <button class="icon-btn search-open" id="search-open" type="button"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><span class="sr" data-t="searchOpen"></span></button>
    <div class="lang">
      <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-list">
        <svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg><span id="lang-now"></span><svg class="ico chev" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
      <ul class="lang-list" id="lang-list" role="listbox" tabindex="-1" hidden></ul>
    </div>
    <a class="icon-btn gh" id="gh" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true"><use href="#i-github"/></svg><span class="sr" data-t="github"></span></a>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="stage" id="stage">
      <canvas id="globe" aria-hidden="true"></canvas>
      <div class="pins" id="pins"></div>
    </div>
    <div class="hero-copy">
      <h1 data-t="headline"></h1>
      <p class="lede" data-t="lede"></p>
      <div class="ctas"><a class="btn btn-main" href="#collection" data-t="ctaWatch"></a><a class="btn btn-line" href="#make" data-t="ctaMake"></a></div>
      <p class="hint" id="hint" data-t="hint"></p>
    </div>
    <p class="caption" id="caption"><strong data-t="exhibitTitle"></strong><span id="caption-text"></span></p>
  </section>

  <section class="collection" id="collection" aria-labelledby="collection-h">
    <div class="sec-head">
      <h2 id="collection-h" data-t="collectionTitle"></h2>
      <p class="sec-note" data-t="collectionNote"></p>
      <p class="count" id="count"></p>
    </div>
    <ul class="exhibits" id="exhibits"></ul>
    <button class="btn btn-line more-cities" id="more-cities" type="button" data-t="showMore" hidden></button>
  </section>

  <section class="how" id="how" aria-labelledby="how-h">
    <div class="sec-head">
      <h2 id="how-h" data-t="howTitle"></h2>
      <p class="sec-note" data-t="howLede"></p>
    </div>
    <ol class="stills">
      <li><figure><img src="site/img/xianyang_research.webp" width="1600" height="733" loading="lazy" alt="" data-alt="how1Cap"><figcaption data-t="how1Cap"></figcaption></figure><h3 data-t="how1"></h3><p data-t="how1Text"></p></li>
      <li><figure><img src="site/img/xianyang_model.webp" width="1600" height="733" loading="lazy" alt="" data-alt="how2Cap"><figcaption data-t="how2Cap"></figcaption></figure><h3 data-t="how2"></h3><p data-t="how2Text"></p></li>
      <li><figure><img src="site/img/xianyang_light.webp" width="1600" height="733" loading="lazy" alt="" data-alt="how3Cap"><figcaption data-t="how3Cap"></figcaption></figure><h3 data-t="how3"></h3><p data-t="how3Text"></p></li>
    </ol>
  </section>

  <section class="make" id="make" aria-labelledby="make-h">
    <div class="make-inner">
      <div class="make-head">
        <h2 id="make-h" data-t="makeTitle"></h2>
        <p class="sec-note" data-t="makeLede"></p>
        <div class="ctas">
          <a class="btn btn-main" data-guide="making" target="_blank" rel="noopener" data-t="makingGuide"></a>
          <a class="btn btn-line" id="repo-cta" target="_blank" rel="noopener" data-t="openRepo"></a>
        </div>
      </div>
      <ol class="steps">
        <li><h3 data-t="step1"></h3><p data-t="step1Text"></p></li>
        <li><h3 data-t="step2"></h3><p data-t="step2Text"></p></li>
        <li><h3 data-t="step3"></h3><p data-t="step3Text"></p><a class="more" data-guide="submit" target="_blank" rel="noopener" data-t="submitGuide"></a></li>
      </ol>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="foot-inner">
    <p class="foot-logo"><span lang="zh-Hant">一城春秋</span> <span data-t="tagline"></span></p>
    <p data-t="footLicence"></p>
    <p><span data-t="footEarth"></span> <a id="repo" target="_blank" rel="noopener" data-t="github"></a></p>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-labelledby="panel-name" role="dialog">
  <div class="grab" id="grab" aria-hidden="true"></div>
  <button class="icon-btn close" id="close" type="button"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg><span class="sr" data-t="close"></span></button>
  <figure class="panel-poster" id="poster"></figure>
  <div class="panel-body">
    <h2 id="panel-name"></h2>
    <p class="panel-alt" id="panel-alt"></p>
    <p class="panel-years" id="panel-years"></p>
    <div class="bar-film big" id="panel-bar" role="img"></div>
    <div class="actions" id="actions"></div>
    <p class="summary" id="summary"></p>
    <dl class="facts" id="facts"></dl>
    <p class="ai" id="ai"></p>
    <a class="more" id="source" target="_blank" rel="noopener" data-t="source"></a>
  </div>
</aside>

<dialog class="player" id="player">
  <form method="dialog" class="player-bar"><div class="player-sites" id="player-sites" role="group"></div><button class="icon-btn" type="submit"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg><span class="sr" data-t="close"></span></button></form>
  <div class="player-frame" id="player-frame"></div>
</dialog>

<dialog class="search-sheet" id="search-sheet">
  <div class="sheet-row">
    <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q2" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results2" aria-autocomplete="list">
    <button class="icon-btn" id="sheet-close" type="button"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg><span class="sr" data-t="searchClose"></span></button>
  </div>
  <ul class="results in-sheet" id="results2" role="listbox"></ul>
</dialog>

<script type="module" src="site/app.js"></script>
</body>
</html>
